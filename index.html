<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pulse — Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --bg:#0b0b0c;
    --card:#17181a;
    --card-2:#1d1e21;
    --line:#2a2c30;
    --line-soft:#232529;
    --ink:#f4f2ee;
    --ink-2:#a9aab0;
    --ink-3:#6e7076;

    /* gold — the product's primary accent */
    --gold:#d9b45f;
    --gold-soft:#e8cf94;
    --gold-line:#8d7434;
    --gold-ink:#221a08;
    --gold-grad:linear-gradient(180deg,#e0be6c 0%,#c39a3d 100%);

    /* bill pill (unpaid) */
    --bill-bg:#3a3125;
    --bill-ink:#e6d6b0;

    /* paid */
    --green:#3f9f6b;
    --green-line:#2f7a51;
    --green-bg:#16241c;
    --green-pill:#2f6f4c;
    --green-ink:#dff3e6;

    --teal:#22b8a6;
    --purple:#7d5cf6;
    --red:#d8483f;

    --r-card:14px;
    --r-btn:12px;
    --nav-h:74px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  i[data-lucide]{width:16px;height:16px;display:inline-flex;flex-shrink:0}
  i.xs[data-lucide]{width:13px;height:13px}
  i.sm[data-lucide]{width:14px;height:14px}
  i.lg[data-lucide]{width:20px;height:20px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2e3034;border-radius:4px}

  /* ─────────── shell ─────────── */
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:14px 18px;position:relative;
  }
  .tb-side{flex:1 1 0;min-width:0;display:flex;align-items:center}
  .tb-side.right{flex:0 0 auto;justify-content:flex-end}
  .seg{
    flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;
    display:inline-flex;align-items:center;gap:2px;
    background:#151618;border:1px solid var(--line-soft);
    border-radius:999px;padding:5px;
  }
  .seg button{
    padding:9px 26px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);
    transition:background .16s,color .16s;
  }
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:0 0 auto;white-space:nowrap}
  .seg button.on{background:#efece3;color:#1a1a1a;font-weight:700}
  .view-title{font-size:17px;font-weight:800;display:none;white-space:nowrap}
  .sec-btn{
    display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;
    border-radius:999px;background:#151618;border:1px solid var(--line-soft);
    font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;transition:all .16s;
  }
  .sec-btn:hover{color:var(--ink);border-color:#3a3d42}
  .sec-btn.filtered{color:var(--gold-soft);border-color:var(--gold-line);background:rgba(217,180,95,.1)}
  .sec-menu{
    display:none;position:absolute;top:60px;left:18px;z-index:40;min-width:184px;
    background:#1b1c1f;border:1px solid var(--line);border-radius:12px;padding:6px;
    box-shadow:0 18px 44px -14px rgba(0,0,0,.75);
  }
  .sec-menu.on{display:block}
  .sec-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);
  }
  .sec-item:hover{background:#232529;color:var(--ink)}
  .sec-item.on{color:var(--gold-soft)}
  .sec-item .n{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .top-actions{display:flex;gap:10px;flex:0 0 auto}
  .top-btn{
    width:44px;height:44px;border-radius:50%;
    background:#151618;border:1px solid var(--line-soft);
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
    transition:border-color .16s,background .16s;
  }
  .top-btn:hover{border-color:var(--line);background:#1b1c1f}
  .phase-chip{
    display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 15px;
    border-radius:999px;background:#151618;border:1px solid var(--line-soft);
    font-size:13px;font-weight:700;color:var(--ink-2);transition:all .16s;
  }
  .phase-chip:hover{border-color:var(--gold-line);color:var(--ink)}
  .phase-chip .pc-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
  .phase-chip.p3{border-color:var(--gold-line);color:var(--gold-soft);background:rgba(217,180,95,.1)}
  .phase-chip.p3 .pc-dot{background:var(--gold);box-shadow:0 0 8px rgba(217,180,95,.6)}

  /* ─────────── table legend ─────────── */
  .legend{
    display:none;max-width:1420px;margin:0 auto 16px;
    background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px;
  }
  .legend.on{display:block}
  .lg-h{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:11px}
  .lg-grid{display:flex;flex-wrap:wrap;gap:10px 22px}
  .lg-item{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#b4b2ac;font-weight:600}
  .lg-sw{width:26px;height:20px;border-radius:5px;border:1.5px solid var(--line-soft);background:#131416;flex:0 0 auto}
  .lg-sw.seated{border-color:#e6e2d6}
  .lg-sw.fresh{border-color:var(--gold)}
  .lg-sw.paid{border-color:var(--green-line);background:repeating-linear-gradient(-45deg,transparent 0 5px,rgba(63,159,107,.14) 5px 10px),#14201a}
  .lg-sw.blocked{border-color:#1e2023;background:repeating-linear-gradient(-45deg,transparent 0 5px,rgba(255,255,255,.03) 5px 10px),#121316}
  .lg-sw.bill{background:var(--bill-bg);border-color:transparent}

  .content{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 18px 22px}

  /* the floor-level call bar — a request is never left to be scrolled to */
  .callbar{
    flex:0 0 auto;display:none;gap:10px;align-items:center;
    margin:0 18px 10px;padding:11px 14px;border-radius:12px;
    background:rgba(216,72,63,.14);border:1px solid #6b332c;
    animation:barIn .28s cubic-bezier(.2,.7,.2,1) both;
  }
  .callbar.on{display:flex}
  @keyframes barIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .callbar .cb-ic{
    width:32px;height:32px;border-radius:50%;flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(216,72,63,.22);color:#f0b3ab;
    animation:callPulse 1.8s ease-in-out infinite;
  }
  .callbar .cb-b{flex:1;min-width:0}
  .callbar .cb-t{font-size:13.5px;font-weight:800;color:#f0b3ab}
  .callbar .cb-s{font-size:12px;color:#c9a29c;margin-top:1px}
  .callbar .cb-go{
    flex:0 0 auto;height:38px;padding:0 15px;border-radius:9px;
    background:#f0b3ab;color:#3a1512;font-size:13px;font-weight:800;
  }
  .callbar .cb-go:hover{background:#f6c9c3}
  body.light .callbar{background:rgba(184,54,46,.09);border-color:#e0b3ae}
  body.light .callbar .cb-t{color:#8e2a23}
  body.light .callbar .cb-s{color:#a1665f}
  body.light .callbar .cb-ic{background:rgba(184,54,46,.14);color:#b8362e}
  body.light .callbar .cb-go{background:#b8362e;color:#fff}

  /* ─────────── table grid ─────────── */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));
    gap:22px;max-width:1420px;margin:0 auto;
  }
  .tcard{
    position:relative;overflow:hidden;
    background:var(--card);
    border:1.5px solid var(--line-soft);
    border-radius:var(--r-card);
    padding:14px 15px 15px;
    min-height:152px;
    display:flex;flex-direction:column;
    cursor:pointer;
    transition:transform .16s,border-color .16s,box-shadow .16s;
  }
  .tcard:active{transform:scale(.985)}

  /* vacant — just the table number, centred */
  .tcard.vacant{
    align-items:center;justify-content:center;
    background:#131416;border-color:#212327;
  }
  .tcard.vacant .tc-vac{font-size:25px;font-weight:700;color:#e9e7e1}
  .tcard.vacant:hover{border-color:var(--gold-line)}

  /* blocked / unavailable */
  .tcard.blocked{
    align-items:center;justify-content:center;
    background:
      repeating-linear-gradient(-45deg,transparent 0 9px,rgba(255,255,255,.022) 9px 18px),
      #121316;
    border-color:#1e2023;cursor:not-allowed;
  }
  .tcard.blocked .tc-vac{font-size:25px;font-weight:700;color:#4a4c51}

  /* occupied */
  .tcard.seated{border-color:#e6e2d6}
  .tcard.fresh{border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,180,95,.18)}
  .tcard.paid{
    border-color:var(--green-line);
    background:
      repeating-linear-gradient(-45deg,transparent 0 9px,rgba(63,159,107,.10) 9px 18px),
      #14201a;
  }

  .tc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .tc-id{font-size:13px;font-weight:600;color:var(--ink-2)}
  .tc-doc{color:var(--gold);opacity:.9;display:inline-flex}
  .tcard.paid .tc-doc{color:var(--green)}
  .tc-name{
    font-size:23px;font-weight:800;letter-spacing:-.01em;line-height:1.1;
    color:#f2efe7;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tcard.fresh .tc-name{color:var(--gold-soft)}
  .tc-name .others{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0}
  .tc-meta{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:13px;color:#cfcdc6;font-weight:500}
  .tc-meta span{display:inline-flex;align-items:center;gap:5px}
  .tc-meta i[data-lucide]{color:var(--ink-2)}
  /* one indicator, one line — the card must still be readable in a glance */
  .tc-act{
    display:flex;align-items:center;gap:5px;margin-top:8px;
    font-size:11.5px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tc-act i[data-lucide]{width:12px;height:12px}
  .tc-act.red{color:#e8a099}
  .tc-act.amber{color:#dcae6e}
  .tc-act.gold{color:var(--ink-2)}

  /* a guest calling is the one thing that must be unmistakable */
  .tc-call{
    display:flex;align-items:center;gap:6px;margin-top:8px;
    background:rgba(216,72,63,.16);border:1px solid #6b332c;color:#f0b3ab;
    border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:800;
    animation:callPulse 1.8s ease-in-out infinite;
  }
  .tc-call i[data-lucide]{width:13px;height:13px}
  @keyframes callPulse{0%,100%{box-shadow:0 0 0 0 rgba(216,72,63,.45)}50%{box-shadow:0 0 0 6px rgba(216,72,63,0)}}
  .seg button .cnt{
    display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
    padding:0 5px;border-radius:10px;background:var(--red);color:#fff;
    font-size:10.5px;font-weight:800;margin-left:7px;vertical-align:middle;
  }
  .seg button.on .cnt{background:#1f1f1f;color:#efece3}

  .tc-bill{
    margin-top:auto;background:var(--bill-bg);color:var(--bill-ink);
    border-radius:9px;padding:10px 13px;font-size:13.5px;font-weight:700;
  }
  .tcard.paid .tc-bill{background:var(--green-pill);color:var(--green-ink)}
  .tc-bill.solo{justify-content:center}

  /* floating edit affordance, as in the app */
  .fab-edit{
    position:fixed;right:6px;top:50%;transform:translateY(-50%);
    width:26px;height:52px;border-radius:9px 0 0 9px;
    background:#1b1c1f;border:1px solid var(--line-soft);border-right:none;
    display:flex;align-items:center;justify-content:center;color:var(--ink-2);z-index:20;
  }

  /* ─────────── bottom nav ─────────── */
  .bnav{
    flex:0 0 auto;height:var(--nav-h);
    background:#0e0f10;border-top:1px solid #1c1d20;
    display:flex;align-items:stretch;
  }
  .bnav button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    color:var(--ink-3);font-size:12px;font-weight:600;position:relative;
  }
  .bnav button i[data-lucide]{width:21px;height:21px}
  .bnav button.on{color:var(--gold)}
  .bnav button.on::before{
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:52px;height:2px;background:var(--gold);border-radius:0 0 2px 2px;
  }

  /* placeholder views for the other tabs */
  .stub{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;color:var(--ink-3);padding:60px 20px;text-align:center;
  }
  .stub i[data-lucide]{width:34px;height:34px}
  .stub b{color:var(--ink-2);font-size:15px;font-weight:700}

  /* ─────────── settings ─────────── */
  .setwrap{max-width:820px;margin:0 auto;padding:10px 0 30px}
  .set-h{font-size:17px;font-weight:800;margin-bottom:5px}
  .set-sub{font-size:13px;color:var(--ink-2);line-height:1.55;margin-bottom:14px;max-width:620px}
  .ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:1180px){ .ph-grid{grid-template-columns:1fr 1fr} }
  @media (max-width:640px){ .ph-grid{grid-template-columns:1fr} }
  .ph-card{
    display:flex;flex-direction:column;gap:8px;text-align:left;
    background:var(--card);border:1.5px solid var(--line-soft);border-radius:var(--r-card);
    padding:16px;transition:border-color .16s,background .16s;
  }
  .ph-card:hover{border-color:#3a3d42}
  .ph-card.on{border-color:var(--gold);background:#1b1913}
  .ph-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ph-top b{font-size:15px;font-weight:800}
  .ph-body{font-size:13px;color:#b4b2ac;line-height:1.55}
  .ph-n{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .ph-card.on .ph-n{color:var(--gold-soft)}
  .theme-row{display:flex;gap:10px}
  .theme-opt{
    display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;
    background:var(--card);border:1.5px solid var(--line-soft);border-radius:11px;
    padding:12px 20px;color:var(--ink-2);transition:all .15s;
  }
  .theme-opt:hover{color:var(--ink);border-color:#3a3d42}
  .theme-opt.on{border-color:var(--gold);color:var(--gold-soft);background:rgba(217,180,95,.1)}
  body.light .theme-opt{background:#fff}
  body.light .theme-opt.on{background:#fdf6e6}
  .rm-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .rm-tab{
    display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
    background:var(--card);border:1px solid var(--line-soft);border-radius:999px;
    padding:8px 14px;color:var(--ink-2);transition:all .14s;
  }
  .rm-tab:hover{color:var(--ink);border-color:#3a3d42}
  .rm-tab.on{background:#efece3;color:#1a1a1a;border-color:#efece3}
  .rm-tab .rm-n{
    font-size:10.5px;font-weight:800;background:#2a2c30;color:var(--ink-2);
    border-radius:8px;padding:1px 6px;
  }
  .rm-tab.on .rm-n{background:rgba(0,0,0,.14);color:#1a1a1a}
  .rm-list{display:flex;flex-direction:column;gap:7px}
  .rm-row{
    display:flex;align-items:flex-start;gap:11px;
    background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;
  }
  .rm-row.built{border-color:#25402f;background:#151d18}
  .rm-tick{flex:0 0 auto;margin-top:2px;color:var(--ink-3)}
  .rm-row.built .rm-tick{color:#5fae82}
  .rm-b{flex:1;min-width:0}
  .rm-n2{display:block;font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.35}
  .rm-note{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;font-style:italic}
  .rm-ui{display:flex;align-items:flex-start;gap:5px;font-size:11.5px;color:var(--gold-soft);margin-top:4px;line-height:1.4}
  .rm-ui i[data-lucide]{margin-top:2px;flex:0 0 auto}
  .rm-pill{
    font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    border-radius:4px;padding:2px 5px;vertical-align:middle;margin-left:4px;
    background:#2a2c30;color:var(--ink-2);
  }
  .rm-pill.hero{background:var(--gold);color:var(--gold-ink)}
  body.light .rm-pill{background:#efece4;color:#6a655c}
  .rm-meta{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .rm-own{font-size:11px;font-weight:700;color:var(--ink-3);white-space:nowrap}
  .rm-tag{
    font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:var(--gold-soft);background:rgba(217,180,95,.11);border:1px solid var(--gold-line);
    border-radius:5px;padding:2px 6px;white-space:nowrap;
  }
  @media (max-width:640px){
    .rm-row{flex-wrap:wrap}
    .rm-meta{flex-direction:row;align-items:center;width:100%;margin-top:4px}
  }
  .call-sim{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:15px}
  .cs-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .cs-btns{display:flex;flex-wrap:wrap;gap:9px}
  .cs-btns .pax{height:40px;width:auto;flex:0 0 auto}
  .cs-live{
    display:flex;align-items:center;gap:8px;margin-top:13px;font-size:12.5px;font-weight:700;
    color:#f0b3ab;background:rgba(216,72,63,.13);border:1px solid #6b332c;border-radius:9px;padding:9px 12px;
  }
  .bkt-list{display:flex;flex-direction:column;gap:9px}
  .bkt-row{
    display:flex;align-items:center;gap:12px;font-size:13px;color:#b4b2ac;
    background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;
  }
  .bkt-row .bkt{flex:0 0 92px;justify-content:center}
  @media (max-width:760px){ .ph-grid{grid-template-columns:1fr} }

  /* ─────────── sheets & modals ─────────── */
  .veil{
    position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);
    z-index:60;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .veil.on{display:flex}
  .veil.bottom{align-items:flex-end;justify-content:center;padding:0}

  .sheet{
    width:100%;max-width:420px;background:#191a1d;
    border:1px solid var(--line-soft);border-radius:20px;
    max-height:92vh;overflow:auto;
    animation:sheetIn .24s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .grabber{width:40px;height:4px;border-radius:3px;background:#3a3c41;margin:12px auto 4px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px}
  .sheet-title{font-size:19px;font-weight:800;color:var(--gold)}
  .x-btn{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .x-btn:hover{background:#222427;color:var(--ink)}
  .sheet-body{padding:12px 20px 20px}

  .sec-lbl{font-size:16px;font-weight:800;margin:14px 0 10px}
  .fld-lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .pax-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .pax{
    height:44px;border-radius:10px;background:#202226;border:1.5px solid #2b2d32;
    font-size:15px;font-weight:700;color:var(--ink);transition:all .14s;
  }
  .pax:hover{border-color:#3d4046}
  .pax.on{border-color:var(--gold);background:rgba(217,180,95,.13);color:var(--gold-soft)}
  .pax.wide{grid-column:1/-1;height:44px;font-size:14px;font-weight:600;color:var(--ink-2)}
  .inp{
    width:100%;height:46px;border-radius:10px;background:#202226;border:1.5px solid #2b2d32;
    color:var(--ink);font-size:15px;padding:0 14px;outline:none;transition:border-color .14s;
  }
  .inp:focus{border-color:var(--gold)}
  .inp::placeholder{color:#5c5e64}
  .phone-row{display:flex;gap:10px}
  .cc{
    display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 12px;
    border-radius:10px;background:#202226;border:1.5px solid #2b2d32;
    font-size:14px;font-weight:600;flex:0 0 auto;
  }
  .btn-gold{
    width:100%;height:52px;border-radius:12px;background:var(--gold-grad);
    color:var(--gold-ink);font-size:15.5px;font-weight:800;letter-spacing:-.005em;
    box-shadow:0 6px 18px -8px rgba(217,180,95,.6);transition:filter .15s,transform .12s;
  }
  .btn-gold:hover{filter:brightness(1.05)}
  .btn-gold:active{transform:scale(.99)}
  .btn-gold:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed;box-shadow:none}
  .sheet-foot{padding:6px 20px 20px}

  /* ─────────── table detail ─────────── */
  .dm-veil{
    position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;
    display:none;padding:26px 26px 26px 70px;
  }
  .dm-veil.on{display:block}
  .dm-close{
    position:absolute;left:16px;top:26px;width:42px;height:42px;border-radius:50%;
    background:#1b1c1f;border:1px solid var(--line-soft);
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink);z-index:2;
  }
  .dm{
    height:100%;background:#141517;border:1px solid var(--line-soft);border-radius:16px;
    display:flex;flex-direction:column;overflow:hidden;
    animation:sheetIn .24s cubic-bezier(.2,.7,.2,1) both;
  }
  .dm-cols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.25fr 1fr}
  .dm-col{min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:20px}
  .dm-col + .dm-col{border-left:1px solid #202225}
  .dm-h{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .dm-h.tab{
    align-self:flex-start;color:var(--gold);padding-bottom:9px;
    border-bottom:2px solid var(--gold);
  }
  .dm-h.tab i[data-lucide]{color:var(--gold)}
  .dm-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:4px}

  /* guest column */
  .gstats{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .gstats::-webkit-scrollbar{display:none}
  .gstat{
    display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-2);
    background:#1c1e21;border:1px solid #262a2e;border-radius:8px;padding:5px 8px;
    white-space:nowrap;flex:0 0 auto;
  }
  .gstat i[data-lucide]{width:12px;height:12px;color:var(--ink-3)}
  .occ-chip{
    display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
    background:#1f1c15;border:1px solid #3a3223;color:var(--gold-soft);
    border-radius:8px;padding:7px 11px;margin-bottom:10px;
  }
  .score-chip{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px;
  }
  .score-chip .sc-b{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
    color:var(--gold-ink);background:var(--gold-grad);border-radius:8px;padding:6px 10px;
  }
  .score-chip .sc-n{font-size:11.5px;font-weight:700;color:var(--gold-soft)}
  .lv-rate{
    margin-left:auto;font-size:10.5px;font-weight:800;border-radius:5px;padding:2px 6px;
  }
  .lv-rate.ok{background:#1e3b2b;color:#8fe0b0}
  .lv-rate.bad{background:#3a2320;color:#e8a099}
  .lv-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12.5px;color:#b4b2ac}
  .lv-grid b{color:var(--ink);font-weight:700}
  .lv-quote{
    font-size:12px;color:#9c9a95;line-height:1.5;margin-top:9px;padding-top:9px;
    border-top:1px solid #26282c;font-style:italic;
  }
  .promo-row{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:#c9c7c1;padding:3px 0;line-height:1.45}
  .promo-row i[data-lucide]{width:12px;height:12px;color:var(--gold);margin-top:3px;flex:0 0 auto}
  .promo-note{font-size:11px;color:var(--ink-3);margin-top:8px;font-style:italic}
  .info-card{
    background:#1c1a14;border:1px solid #322c1e;border-radius:11px;
    padding:12px 13px;margin-bottom:10px;
  }
  .info-card.plain{background:#1a1b1e;border-color:#26282c}
  .ic-h{
    display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;
    color:var(--gold-soft);margin-bottom:6px;
  }
  .info-card.plain .ic-h{color:var(--ink-2)}
  .ic-h i[data-lucide]{width:14px;height:14px}
  .ic-b{font-size:13px;line-height:1.55;color:#c9c7c1}
  .ic-b.muted{color:var(--ink-3);font-style:italic}
  .row-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
  .row-h b{font-size:15px;font-weight:800}
  .add-lnk{font-size:13px;font-weight:700;color:var(--gold);display:inline-flex;align-items:center;gap:4px}
  .avatars{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  .av{
    width:40px;height:40px;border-radius:50%;background:#232529;border:1.5px solid #2e3136;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;color:var(--ink-2);transition:all .14s;
  }
  .av.on{border-color:var(--gold);color:var(--gold);background:rgba(217,180,95,.12)}
  .gcard{background:#1a1b1e;border:1px solid #26282c;border-radius:12px;padding:13px}
  .gc-top{display:flex;align-items:center;gap:11px;margin-bottom:11px}
  .gc-av{
    width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    background:rgba(217,180,95,.14);border:1.5px solid var(--gold-line);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:var(--gold);
  }
  .gc-nm{font-size:17px;font-weight:800;color:var(--gold-soft);line-height:1.2}
  .gc-ph{font-size:12.5px;color:var(--ink-3);font-weight:600}
  .tag-purple{
    display:inline-flex;align-items:center;gap:6px;width:100%;
    background:#2c2260;border:1px solid #3d2f80;color:#cfc3ff;
    border-radius:8px;padding:8px 11px;font-size:12px;font-weight:700;margin-top:9px;
  }

  /* ── WHAT TO DO — a checklist, not a wall of cards ── */
  .todo{background:#1a1b1e;border:1px solid #26282c;border-radius:12px;overflow:hidden;margin-bottom:12px}
  .todo-h{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 13px;border-bottom:1px solid #232528;
  }
  .todo-h b{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#cfcdc6}
  .todo-prog{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .todo-row{
    width:100%;display:flex;align-items:flex-start;gap:11px;text-align:left;
    padding:12px 13px;border-bottom:1px solid #202225;position:relative;
    transition:background .14s;
  }
  .todo-row:last-child{border-bottom:none}
  .todo-row:hover{background:#1e2023}
  .todo-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
  .todo-row.red::before  {background:var(--red)}
  .todo-row.amber::before{background:#c98a3a}
  .todo-row.gold::before {background:var(--gold)}
  .tick{
    width:20px;height:20px;border-radius:50%;flex:0 0 auto;margin-top:1px;
    border:2px solid #43464c;display:inline-flex;align-items:center;justify-content:center;
    color:transparent;transition:all .16s;
  }
  .todo-row.red .tick{border-color:#8a4a44}
  .todo-row.amber .tick{border-color:#7d5c2c}
  .todo-row.gold .tick{border-color:var(--gold-line)}
  .todo-row:hover .tick{border-color:var(--gold);color:rgba(217,180,95,.4)}
  .tick i[data-lucide]{width:12px;height:12px}
  .todo-b{flex:1;min-width:0}
  .todo-a{display:block;font-size:14px;font-weight:800;color:#f2efe7;line-height:1.3}
  .todo-w{display:block;font-size:12px;color:#9c9a95;line-height:1.45;margin-top:3px}
  .todo-who{
    flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--gold-soft);background:rgba(217,180,95,.13);border:1px solid var(--gold-line);
    border-radius:5px;padding:3px 6px;margin-top:1px;
  }
  /* done — stays visible briefly as proof, then reads as history */
  .todo-row.is-done{background:#15231b}
  .todo-row.is-done::before{background:#2f7a51}
  .todo-row.is-done .tick{background:#3f9f6b;border-color:#3f9f6b;color:#0d1a12}
  .todo-row.is-done .todo-a{color:#84d6a8;font-weight:700}
  .todo-row.is-done .todo-w{display:none}
  .todo-more{
    width:100%;font-size:11.5px;font-weight:700;color:var(--ink-2);
    padding:10px;border-top:1px solid #202225;
  }
  .todo-more:hover{color:var(--gold)}
  .todo-clear{
    display:flex;align-items:center;gap:9px;padding:13px;
    font-size:12.5px;color:var(--ink-2);font-weight:600;
  }
  .todo-clear i[data-lucide]{width:15px;height:15px;color:#5fae82}

  /* guest bucket badge */
  .bkt{
    display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
    font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    border-radius:6px;padding:3px 7px;
    background:#232529;border:1px solid #2f3237;color:var(--ink-2);
  }
  .bkt.gold {background:rgba(217,180,95,.13);border-color:var(--gold-line);color:var(--gold-soft)}
  .bkt.amber{background:rgba(201,138,58,.14);border-color:#6d4f24;color:#dcae6e}
  .bkt.red  {background:rgba(216,72,63,.13);border-color:#6b332c;color:#e8a099}
  .bkt-hint{font-size:12px;color:#9c9a95;line-height:1.45;margin-top:7px}

  /* recommendations — a strip that scrolls sideways, so it costs one row not one column */
  .reco-strip{margin-top:16px;padding-top:14px;border-top:1px solid #202225}
  .rs-h{
    display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;
  }
  .rs-h i[data-lucide]{color:var(--gold)}
  .rs-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .rs-row::-webkit-scrollbar{display:none}
  .rs-card{
    flex:0 0 auto;width:170px;display:flex;gap:9px;align-items:center;
    background:#1a1b1e;border:1px solid #26282c;border-radius:10px;padding:9px;
  }
  .rs-img{
    width:38px;height:38px;border-radius:8px;flex:0 0 auto;position:relative;
    background:linear-gradient(135deg,#2a2c30,#1f2124);
    display:flex;align-items:center;justify-content:center;color:#4d5055;
  }
  .rs-best{
    position:absolute;left:-2px;bottom:-2px;background:var(--red);color:#fff;
    font-size:8px;font-weight:800;border-radius:4px;padding:1px 3px;
  }
  .rs-b{min-width:0}
  .rs-n{font-size:12px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rs-m{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:2px}
  body.light .rs-card{background:#faf8f3;border-color:var(--line-soft)}
  body.light .rs-img{background:linear-gradient(135deg,#eae6dd,#f4f1ea);color:#a9a49a}
  body.light .rs-n{color:#1b1917}

  /* reco column */
  .reco{
    display:flex;gap:12px;background:#1a1b1e;border:1px solid #26282c;
    border-radius:12px;padding:11px;margin-bottom:11px;
  }
  .reco-img{
    width:78px;height:78px;border-radius:9px;flex:0 0 auto;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#2a2c30,#1f2124);
    display:flex;align-items:center;justify-content:center;color:#4d5055;
  }
  .best-ribbon{
    position:absolute;left:0;bottom:0;right:0;background:var(--red);color:#fff;
    font-size:8px;font-weight:800;text-align:center;padding:3px 2px;line-height:1.15;
  }
  .reco-b{flex:1;min-width:0}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
  .bdg{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff}
  .bdg.reorder{background:var(--purple)}
  .reco-nm{font-size:13.5px;font-weight:700;line-height:1.35;margin-bottom:5px}
  .reco-pr{font-size:13px;font-weight:800;color:#dcd9d2}

  /* order column */
  .ord-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
  .ord-id{font-size:11.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:8px}
  .pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;background:#33261f;color:#e2a08f}
  .pill.paid{background:#1e3b2b;color:#8fe0b0}
  .ord-meta{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#c9c7c1;font-weight:600;
    padding:12px 0 14px;border-bottom:1px solid #202225;margin-bottom:14px}
  .ord-meta span{display:inline-flex;align-items:center;gap:6px}
  .ord-meta i[data-lucide]{color:var(--ink-3)}
  .oi-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #1e2023;font-size:13.5px}
  .oi-nm{flex:1;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
  .oi-q{color:var(--ink-2);font-weight:700}
  .oi-p{font-weight:800}
  .ord-empty{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;color:var(--ink-3);font-size:13px;text-align:center;padding:30px 10px;
  }
  .ord-empty i[data-lucide]{width:52px;height:52px;color:#3a3d42}
  .ord-btns{display:flex;gap:9px;justify-content:flex-end;padding-top:14px}
  .btn-ghost{
    height:42px;padding:0 15px;border-radius:10px;background:#1e2023;border:1px solid #2c2f33;
    font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:7px;
    transition:all .14s;
  }
  .btn-ghost:hover{background:#25282c;border-color:#3a3d42}

  /* detail footer */
  .dm-foot{
    flex:0 0 auto;border-top:1px solid #202225;padding:14px 20px;
    display:flex;align-items:center;justify-content:flex-end;gap:12px;
  }
  .rem-tot{margin-right:auto;text-align:center;flex:1}
  .rem-tot .l{font-size:12.5px;color:var(--ink-2);font-weight:600}
  .rem-tot .v{font-size:19px;font-weight:800;margin-top:1px}
  .btn-pay{
    height:48px;padding:0 34px;border-radius:11px;background:var(--gold-grad);
    color:var(--gold-ink);font-size:15px;font-weight:800;
    box-shadow:0 6px 18px -8px rgba(217,180,95,.55);
  }
  .btn-pay.close{background:#3f1f1c;color:#f0b3ab;border:1px solid #6b332c;box-shadow:none}

  /* payment summary */
  .pay-card{width:100%;max-width:400px;background:#191a1d;border:1px solid var(--line-soft);border-radius:16px;
    animation:sheetIn .22s cubic-bezier(.2,.7,.2,1) both;overflow:hidden}
  .pay-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px}
  .pay-h b{font-size:17px;font-weight:800}
  .pay-sub{font-size:13px;color:var(--ink-2);font-weight:600;padding:0 18px 12px}
  .pay-b{padding:0 18px 18px}
  .tickets{display:flex;gap:16px;background:#1e2023;border-radius:9px;padding:10px 13px;margin-bottom:14px;
    font-size:12.5px;font-weight:700;color:var(--ink-2)}
  .tickets span{display:inline-flex;align-items:center;gap:6px}
  .pl{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13.5px}
  .pl .k{color:var(--ink-2);font-weight:600}
  .pl .v{font-weight:700}
  .tips{display:flex;align-items:center;justify-content:space-between;background:#1c1a14;
    border:1px solid #322c1e;border-radius:9px;padding:11px 13px;margin:10px 0;font-size:13px;font-weight:700;color:var(--gold-soft)}
  .dash{border-top:1px dashed #34373b;margin:12px 0}
  .pl.big .k{color:var(--ink);font-weight:700;font-size:15px}
  .pl.big .v{font-size:16px}
  .pl.rem .k{font-size:17px;font-weight:800;color:var(--ink)}
  .pl.rem .v{font-size:18px;font-weight:800}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translateX(-50%) translateY(70px);
    background:#222427;border:1px solid #33363b;border-radius:11px;padding:12px 18px;
    font-size:13.5px;font-weight:600;z-index:200;opacity:0;
    transition:opacity .2s,transform .26s cubic-bezier(.3,1.3,.4,1);
    display:flex;align-items:center;gap:9px;box-shadow:0 14px 34px -12px rgba(0,0,0,.7);
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast i[data-lucide]{color:var(--gold)}

  /* search bar */
  .searchwrap{max-width:1420px;margin:0 auto 14px;display:none}
  .searchwrap.on{display:block}
  .searchbar{display:flex;align-items:center;gap:10px;background:#151618;border:1px solid var(--line-soft);
    border-radius:12px;padding:0 14px;height:48px}
  .searchbar input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:14.5px}
  .searchbar i[data-lucide]{color:var(--ink-3)}


  /* ═══════════════════════════════════════════════════════════
     LIGHT THEME — same layout, same hierarchy, inverted ground.
     Gold darkens so it still carries contrast on white.
     ═══════════════════════════════════════════════════════════ */
  body.light{
    --bg:#f3f1ec; --card:#ffffff; --card-2:#faf8f4;
    --line:#ddd7cb; --line-soft:#e6e1d6;
    --ink:#1b1917; --ink-2:#6a655c; --ink-3:#98938a;
    --gold:#9a7825; --gold-soft:#7d611c; --gold-line:#cbb98e; --gold-ink:#ffffff;
    --gold-grad:linear-gradient(180deg,#b8912f 0%,#96731f 100%);
    --bill-bg:#f1e8d5; --bill-ink:#6b5424;
    --green:#2c7d52; --green-line:#8fc4a8; --green-pill:#2f7a51; --green-ink:#ffffff;
    --red:#b8362e; --purple:#5b3fd6;
    background:var(--bg); color:var(--ink);
  }
  body.light .topbar,
  body.light .seg,
  body.light .top-btn,
  body.light .phase-chip,
  body.light .sec-btn{background:#fffdf9;border-color:var(--line-soft)}
  body.light .seg button.on{background:#2a2620;color:#fff}
  body.light .top-btn:hover,
  body.light .sec-btn:hover{background:#f6f3ec}
  body.light .sec-menu{background:#fff;border-color:var(--line);box-shadow:0 18px 40px -16px rgba(60,50,30,.25)}
  body.light .sec-item:hover{background:#f4f1ea}
  body.light .bnav{background:#fffdf9;border-top-color:var(--line-soft)}

  body.light .tcard{background:#fff;border-color:var(--line-soft);box-shadow:0 1px 2px rgba(60,50,30,.05)}
  body.light .tcard.vacant{background:#faf8f3;border-color:#e8e3d8}
  body.light .tcard.vacant .tc-vac{color:#3a3630}
  body.light .tcard.blocked{
    background:repeating-linear-gradient(-45deg,transparent 0 9px,rgba(0,0,0,.035) 9px 18px),#f0ede6;
    border-color:#e4dfd4}
  body.light .tcard.blocked .tc-vac{color:#b0aaa0}

/* ══════════════════════════════════════════════════════════════
   GUEST BUCKETS
   One label per guest that tells staff how to treat them. Derived —
   never typed by hand — so it cannot go stale.
   ══════════════════════════════════════════════════════════════ */
function daysSince(lastVisit) {
  if (!lastVisit) return null;
  const m = String(lastVisit).match(/(\d+)\s*(day|week|month)/i);
  if (!m) return null;
  const n = +m[1], u = m[2].toLowerCase();
  return u === 'day' ? n : u === 'week' ? n*7 : n*30;
}
const BUCKETS = {
  new:       { label:'New guest',  tone:'plain', hint:'First time here — make the first impression count.' },
  returning: { label:'Returning',  tone:'plain', hint:'Has been here before. Recognise them.' },
  regular:   { label:'Regular',    tone:'gold',  hint:'Comes often. Greet by name and lead with their usual.' },
  vip:       { label:'High value', tone:'gold',  hint:'Spends well above average. Worth a manager hello.' },
  lapsed:    { label:'Lapsed',     tone:'amber', hint:'Has not been in for a while. Make them feel remembered.' },
  risk:      { label:'At risk',    tone:'red',   hint:'Last experience fell short. Recover it tonight.' },
};
function bucketOf(g) {
  if (!g || !g.visits) return 'new';
  if (g.prevIssue) return 'risk';
  const gap = daysSince(g.lastVisit);
  if (gap !== null && gap >= 60) return 'lapsed';
  if ((g.avgSpend || 0) >= 65) return 'vip';
  if (g.visits >= 5) return 'regular';
  return 'returning';
}
function bucketOfTable(t) {
  const g = t && t.guest ? guests[t.guest] : null;
  return g ? bucketOf(g) : null;
}

const doneActions = {};                                   // "<table>:<signal>" -> true
const aKey = (tid,sid) => tid + ':' + sid;
const val = (v,c) => typeof v === 'function' ? v(c) : v;

function signalsFor(t) {
  if (!t || t.status === 'vacant' || t.status === 'blocked') return { open:[], done:[], top:null, lvl:null, all:[] };
  const g = t.guest ? guests[t.guest] : null;
  const c = { t, g, sw: t.sw || {}, mins: t.mins || 0, bucket: g ? bucketOf(g) : null, call: t.call || null };
  const all = SIGNALS.filter(s => s.phase <= state.phase)
    .filter(s => { try { return !!s.on(c); } catch(e){ return false; } })
    .map(s => ({ id:s.id, lvl:s.lvl, who:s.who, icon:s.icon, score:s.score, phase:s.phase,
                 why:val(s.why,c), act:val(s.act,c), done:val(s.done,c),
                 isDone: !!doneActions[aKey(t.id,s.id)] }));
  const rank = { red:0, amber:1, gold:2 };
  const open = all.filter(x => !x.isDone).sort((a,b) => rank[a.lvl]-rank[b.lvl] || b.score-a.score);
  return { open, done:all.filter(x => x.isDone), top:open[0] || null, lvl:open[0] ? open[0].lvl : null, all };
}
function markDone(tid, sid) {
  const t = T(tid);
  if (sid === 'call' && t && t.call) {
    // answering the call resolves it outright rather than leaving a tick behind
    const label = CALL_TYPES[t.call.type].done;
    t.call = null;
    renderDetail(); renderGrid();
    toast(label, 'check-circle');
    return;
  }
  doneActions[aKey(tid,sid)] = true;
  renderDetail(); renderGrid();
  const s = SIGNALS.find(x => x.id === sid);
  toast(s ? val(s.done, { t, g:t && t.guest ? guests[t.guest] : null, sw:(t&&t.sw)||{}, call:t&&t.call }) : 'Done', 'check-circle');
}

/* A guest raising a request from the QR. In the real product this arrives
   over the wire; here it can be triggered so the handoff is demonstrable. */
function raiseCall(tableId, type, note) {
  const t = T(tableId); if (!t) return;
  t.call = { type, note: note || '', min: 0 };
  if (state.phase < 3) { state.phase = 3; syncPhaseChip(); }
  renderGrid();
  if (state.detailId === tableId) renderDetail();
  toast(`Table ${t.id} — ${CALL_TYPES[type].label.toLowerCase()}`, 'bell-ring');
}
function anyCalls() { return tables.filter(t => t.call).length; }
function attentionCount() {
  return tables.filter(t => { const l = signalsFor(t).lvl; return l === 'red' || l === 'amber'; }).length;
}

const dur = m => { const h = Math.floor(m/60), mm = m%60; return h ? `${h}h ${mm}m` : `${mm}m`; };
const nameOf = t => t.guest ? guests[t.guest].name : 'Guest';

let toastTimer;
function toast(msg, icon) {
  const el = document.getElementById('toast');
  el.innerHTML = `${ic(icon || 'check-circle')}<span>${msg}</span>`;
  icons(); el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2400);
}
const open = id => document.getElementById(id).classList.add('on');
const shut = id => document.getElementById(id).classList.remove('on');

   TABLE GRID

function visibleTables() {
  let list = tables.slice();
  if (state.section !== 'all') list = list.filter(t => t.sec === state.section);
  if (state.filter === 'vacant')   list = list.filter(t => t.status === 'vacant');
  if (state.filter === 'allocate') list = list.filter(t => t.status === 'seated' || t.status === 'paid');
  if (state.filter === 'attention') {
    const rank = { red:0, amber:1 };
    list = list.filter(t => { const l = signalsFor(t).lvl; return l === 'red' || l === 'amber'; })
               .sort((a,b) => (b.call?1:0) - (a.call?1:0)
                           || rank[signalsFor(a).lvl] - rank[signalsFor(b).lvl]);
  }
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter(t =>
    ('table ' + t.id).includes(q) || t.id.replace(/^0/,'').includes(q) ||
    (t.guest && guests[t.guest].name.toLowerCase().includes(q)) ||
    (t.status !== 'vacant' && t.status !== 'blocked' && 'guest'.includes(q))
  );
  return list;
}

function cardHtml(t) {
  if (t.status === 'vacant')
    return `<div class="tcard vacant" data-id="${t.id}"><div class="tc-vac">Table ${t.id}</div></div>`;
  if (t.status === 'blocked')
    return `<div class="tcard blocked" data-id="${t.id}"><div class="tc-vac">Table ${t.id}</div></div>`;

  const cls = t.status === 'paid' ? 'paid' : (t.fresh ? 'fresh' : 'seated');
  const sig = signalsFor(t);
  const bkt = bucketOfTable(t);
  return `<div class="tcard ${cls}" data-id="${t.id}">
    <div class="tc-head">
      <span class="tc-id">Table ${t.id}</span>
      <span class="tc-doc">${ic('receipt-text','sm')}</span>
    </div>
    <div class="tc-name">${nameOf(t)}${t.others ? ' <span class="others">&amp; others</span>' : ''}</div>
    <div class="tc-meta">
      <span>${ic('user','xs')} ${t.pax}</span>
      <span>${ic('clock','xs')} ${dur(t.mins)}</span>
      ${state.phase >= 3 && bkt && BUCKETS[bkt].tone !== 'plain' ? `<span class="bkt ${BUCKETS[bkt].tone}" style="margin-left:auto">${BUCKETS[bkt].label}</span>` : ''}
    </div>
    ${t.call && state.phase >= 3
        ? `<div class="tc-call">${ic(CALL_TYPES[t.call.type].icon,'xs')} ${CALL_TYPES[t.call.type].label}${t.call.min?` · ${t.call.min}m`:''}</div>`
        : (sig.top ? `<div class="tc-act ${sig.top.lvl}">${ic(sig.top.icon,'xs')} ${sig.top.act}</div>` : '')}
    ${t.bill > 0 ? `<div class="tc-bill">${money(t.bill)}</div>` : ''}
  </div>`;
}

function openAllocate(id) {

  document.getElementById('a-name').value = '';

  document.getElementById('pax-grid').innerHTML =
    [1,2,3,4,5,6,7,8].map(n => `<button class="pax ${state.allocPax===n?'on':''}" data-pax="${n}">${n}</button>`).join('') +
    `<button class="pax wide" data-pax="custom">Custom pax</button>`;
}
function lookupGuest(v) {
  const s = v.replace(/\s/g,'').toLowerCase();
  if (s.length < 4) return null;
  return Object.values(guests).find(g =>
    g.phone.replace(/\s|X/gi,'').includes(s.replace(/\D/g,'').slice(0,4)) ||
    g.name.toLowerCase().startsWith(v.trim().toLowerCase())
  ) || null;
}
function onAllocLookup() {
  const phone = document.getElementById('a-phone').value;
  const nm    = document.getElementById('a-name').value;
  const hit = lookupGuest(nm || phone);
  const box = document.getElementById('a-match');
  if (hit && (nm || phone.length >= 4)) {
    if (!nm) document.getElementById('a-name').value = hit.name;
    box.innerHTML = `<div class="info-card" style="margin:0">
      <div class="ic-h">${ic('user-check')} Returning guest</div>
      <div class="ic-b">${hit.name} · ${hit.visits} visits · last ${hit.lastVisit || '—'}</div>
    </div>`;
  } else box.innerHTML = '';
  icons();
}
function confirmAllocate() {
  const t = T(state.allocId); if (!t) return;
  const nm = document.getElementById('a-name').value.trim();
  const hit = Object.values(guests).find(g => g.name.toLowerCase() === nm.toLowerCase());
  tables = tables.map(x => ({ ...x, fresh:false }));
  const tt = T(state.allocId);
  Object.assign(tt, {
    status:'seated', fresh:true, pax:state.allocPax, mins:0, bill:0,
    server:'Jason', ticket:0, dishes:0, others:state.allocPax > 1,
    guest: hit ? hit.id : null,
    walkInName: hit ? null : (nm || null),
  });
  shut('veil-alloc');
  renderGrid();
  toast(`Table ${tt.id} allocated · QR printed`, 'qr-code');
}

  const others = pool.filter(k => k !== lead).slice(0, Math.max(0, Math.min(3, (t.pax || 1) - 1)));

  const CAP = 3;
  const show = state.allActions ? sig.open : sig.open.slice(0, CAP);
  const hidden = sig.open.length - show.length;
  const total = sig.all.length, doneN = sig.done.length;

  const row = a => `<button class="todo-row ${a.lvl}" data-do="${a.id}">
      <span class="tick">${ic('check')}</span>
      <span class="todo-b">
        <span class="todo-a">${a.act}</span>
        <span class="todo-w">${a.why}</span>
      </span>
      ${a.who === 'manager' ? `<span class="todo-who">Manager</span>` : ''}
    </button>`;

  return `<div class="todo">
    <div class="todo-h"><b>What to do</b><span class="todo-prog">${doneN} of ${total} done</span></div>
    ${show.map(row).join('')}
    ${sig.done.map(a => `<div class="todo-row is-done">
        <span class="tick">${ic('check')}</span>
        <span class="todo-b"><span class="todo-a">${a.done}</span></span>
      </div>`).join('')}
    ${hidden ? `<button class="todo-more" id="act-more">+ ${hidden} more</button>` : ''}
    ${state.allActions && sig.open.length > CAP ? `<button class="todo-more" id="act-more">Show fewer</button>` : ''}
  </div>`;
}

function openDetail(id) {
  const t = T(id); if (!t || t.status === 'vacant' || t.status === 'blocked') return;
  state.detailId = id;
  state.allActions = false;
  const party = partyOf(t);
  if (!state.activeGuest || !party.includes(state.activeGuest)) state.activeGuest = party[0];
  renderDetail();
  open('veil-detail');
}

/* ══════════════════════════════════════════════════════════════
   EVENTS — one delegated listener
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-close]');
  if (el) { shut(el.dataset.close); return; }

  // filter segment
  const seg = e.target.closest('#seg button');
  if (seg) {
    state.filter = seg.dataset.f;
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b === seg));
    renderGrid(); return;
  }

  // bottom nav
  const nav = e.target.closest('#bnav button');
  if (nav) {
    state.view = nav.dataset.v;
    document.querySelectorAll('#bnav button').forEach(b => b.classList.toggle('on', b === nav));
    renderView(); return;
  }

  const th = e.target.closest('[data-theme]');
  if (th) {
    state.theme = th.dataset.theme;
    document.body.classList.toggle('light', state.theme === 'light');
    renderView(); toast(state.theme === 'light' ? 'Light theme on' : 'Dark theme on', state.theme === 'light' ? 'sun' : 'moon');
    return;
  }
  const rm = e.target.closest('[data-rm]');
  if (rm) { state.rmPhase = +rm.dataset.rm; renderView(); return; }
  const cb = e.target.closest('[data-call]');
  if (cb) {
    const tid = document.getElementById('cs-table').value;
    raiseCall(tid, cb.dataset.call);
    renderView();
    return;
  }
  const ph = e.target.closest('[data-phase]');
  if (ph) {
    state.phase = +ph.dataset.phase;
    syncPhaseChip(); renderView();
    toast(state.phase === 3 ? 'Phase 3 — live QR behaviour on' : 'Phase 2 — action layer only', 'zap');
    return;
  }
  if (e.target.closest('#btn-phase')) {
    state.phase = state.phase >= 4 ? 1 : state.phase + 1;
    syncPhaseChip(); renderView();
    toast(`Phase ${state.phase} — ${PHASE_META[state.phase].name}`, 'zap');
    return;
  }
  if (e.target.closest('#btn-sec')) { state.secOpen = !state.secOpen; renderSecMenu(); return; }
  const si = e.target.closest('[data-sec]');
  if (si) { state.section = si.dataset.sec; state.secOpen = false; renderSecMenu(); renderGrid(); return; }
  if (state.secOpen && !e.target.closest('#sec-menu')) { state.secOpen = false; renderSecMenu(); }
  if (e.target.closest('#btn-legend')) { state.legendOpen = !state.legendOpen; renderView(); return; }
  if (e.target.closest('#btn-search'))  { state.searchOpen = !state.searchOpen; renderView(); return; }
  if (e.target.closest('#btn-history')) { toast('Order history — coming from POS', 'history'); return; }
  if (e.target.closest('#fab-edit'))    { toast('Edit floor layout', 'pencil'); return; }
  if (e.target.closest('#q-clear'))     { state.q = ''; state.searchOpen = false; renderView(); return; }

  // table card
  const goto = e.target.closest('[data-goto]');
  if (goto) { openDetail(goto.dataset.goto); return; }
  const card = e.target.closest('.tcard');
  if (card) {
    const t = T(card.dataset.id);
    if (!t || t.status === 'blocked') return;
    if (t.status === 'vacant') openAllocate(t.id); else openDetail(t.id);
    return;
  }

  // allocate sheet
  const pax = e.target.closest('[data-pax]');
  if (pax) {
    if (pax.dataset.pax === 'custom') {
      const v = prompt('How many guests?');
      const n = parseInt(v);
      if (n > 0) state.allocPax = n;
    } else state.allocPax = +pax.dataset.pax;
    renderPax(); return;
  }
  if (e.target.closest('#a-confirm')) { confirmAllocate(); return; }
  const rc = e.target.closest('[data-rem]');
  if (rc) { state.remCat = rc.dataset.rem; renderRemCats(); return; }
  if (e.target.closest('#rem-save')) { saveRemember(); return; }

  // detail
  if (e.target.closest('#dm-close')) { shut('veil-detail'); return; }
  const av = e.target.closest('[data-g]');
  if (av) { state.activeGuest = av.dataset.g; renderDetail(); return; }
  const doBtn = e.target.closest('[data-do]');
  if (doBtn) { markDone(state.detailId, doBtn.dataset.do); return; }
  if (e.target.closest('#act-more')) { state.allActions = !state.allActions; renderDetail(); return; }
  if (e.target.closest('#remember')) { openRemember(); return; }
  if (e.target.closest('#btn-paybill'))   { openPay(); return; }
  if (e.target.closest('#btn-receipt'))   { toast('Receipt sent to printer', 'printer'); return; }
  if (e.target.closest('#add-order'))     { toast('Opening menu to add items', 'plus'); return; }
  if (e.target.closest('#void-item'))     { toast('Select items to reduce or void', 'minus'); return; }
  if (e.target.closest('#add-guest'))     { toast('Add another guest to this table', 'user-plus'); return; }
  if (e.target.closest('#refresh-order')) { toast('Order refreshed from POS', 'refresh-cw'); return; }
  if (e.target.closest('#btn-closetable')) {
    const t = T(state.detailId);
    Object.assign(t, { status:'vacant', guest:null, others:false, pax:0, mins:0, bill:0, ticket:0, dishes:0, fresh:false, walkInName:null });
    shut('veil-detail'); renderGrid(); toast(`Table ${t.id} closed`, 'check-circle'); return;
  }
  if (e.target.closest('#pay-confirm')) {
    const t = T(state.detailId);
    t.status = 'paid';
    shut('veil-pay'); renderDetail(); renderGrid(); toast(`Table ${t.id} paid`, 'check-circle'); return;
  }

  // click the veil backdrop to dismiss
  if (e.target.id === 'veil-alloc') shut('veil-alloc');
  if (e.target.id === 'veil-pay')   shut('veil-pay');
  if (e.target.id === 'veil-rem')   shut('veil-rem');
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.q = e.target.value; renderGrid(); }
  if (e.target.id === 'a-phone' || e.target.id === 'a-name') onAllocLookup();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  ['veil-pay','veil-detail','veil-alloc'].some(id => {
    const el = document.getElementById(id);
    if (el.classList.contains('on')) { el.classList.remove('on'); return true; }
  });
});

function syncPhaseChip() {
  const b = document.getElementById('btn-phase');
  b.classList.toggle('p3', state.phase >= 3);
  document.getElementById('pc-lbl').textContent = 'Phase ' + state.phase;
}

/* init */
syncPhaseChip(); renderSecMenu(); renderGrid(); icons();
</script>
</body>
</html>
