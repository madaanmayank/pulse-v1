    why:'A concern raised from their phone.',
    done:'You visited the table' },

  { id:'vip-welcome', phase:3, lvl:'gold', who:'manager', mgrRank:2, icon:'crown', score:77,
    on:c => c.bucket === 'vip',
    act:'Visit the table',
    why:c => `${c.g.name.split(' ')[0]} averages ${money(c.g.avgSpend)} a visit.`,
    done:'You visited the table' },
];



const doneActions = {};                                   // "<table>:<signal>" -> true
const aKey = (tid,sid) => tid + ':' + sid;
const val = (v,c) => typeof v === 'function' ? v(c) : v;

/* ── An action has a life, not just a state ───────────────────────────────
   Something Pulse raises mid-meal is easy to miss, and something nobody
   closes is worse than something nobody raised. So every action records the
   minute it appeared, and carries its own age:

     NEW         it appeared after the waiter had already seen this table
     (quiet)     it is being worked
     UNATTENDED  open STALE_MIN minutes and still nobody has closed it

   Two ways out, because "not applicable" is a real answer: complete it, or
   dismiss it. Both are reversible.                                        */
let clockMin = 0;                    // minutes of service, advanced by the tick
const STALE_MIN = 15;     // Pulse's own actions. Guest requests set their own
/* How long a thing may sit before Pulse says nobody has picked it up. */
function staleAfter(s, c) {
  if (s.id === 'call' && c.call) return callSla(c.call);
  return s.sla || STALE_MIN;
}
const MAX_SHOW  = 5;      // rows a waiter will actually read at a glance
const OPENING_MIN = 10;   // how long a table counts as newly seated
const NB_CAP    = 4;      // capsules before a group stops being scannable
const actionSeen = {};               // "table:signal" -> clockMin it appeared
const tableSeen  = {};               // "table"        -> clockMin it first showed
const dismissed  = {};               // "table:signal" -> true

function signalsFor(t) {
  if (!t || t.status === 'vacant' || t.status === 'blocked') return { open:[], now:[], soft:[], liveNow:[], done:[], top:null, lvl:null, all:[], stale:[] };
  const g = t.guest ? guests[t.guest] : null;
  const c = { t, g, sw: t.sw || {}, mins: t.mins || 0, bucket: g ? bucketOf(g) : null,
              call: t.call || null, hasSw: !!t.sw };
  if (tableSeen[t.id] === undefined) tableSeen[t.id] = clockMin;
  const all = SIGNALS.filter(s => s.phase <= state.phase)
    .filter(s => { try { return !!s.on(c); } catch(e){ return false; } })
    .map(s => {
      const k = aKey(t.id, s.id);
      const mgrRank = s.mgrRank;
      // first time Pulse can know this action exists is the moment it computes it
      if (actionSeen[k] === undefined) actionSeen[k] = clockMin;
      // A guest request is timed from the moment they pressed the button.
      // Everything else is timed from when Pulse first raised it.
      const openMin = (s.id === 'call' && c.call) ? c.call.min : clockMin - actionSeen[k];
      const isWork = s.lvl !== 'gold';     // gold is something to say, not a task
      const limit  = staleAfter(s, c);
      return { id:s.id, lvl:s.lvl, who:val(s.who,c), mgrRank, icon:s.icon, score:s.score, phase:s.phase,
               why:val(s.why,c), act:val(s.act,c), done:val(s.done,c),
               openMin, limit,
               isNew:   isWork && actionSeen[k] > tableSeen[t.id] && openMin < limit,
               isStale: isWork && openMin >= limit,
               isDone:  !!doneActions[k], isDropped: !!dismissed[k] };
    })
    .filter(x => !x.isDropped);
  const rank = { red:0, amber:1, gold:2 };
  const open = all.filter(x => !x.isDone)
    // an action nobody has closed outranks a fresher one of the same severity
    .sort((a,b) => (b.isStale - a.isStale) || rank[a.lvl]-rank[b.lvl] || b.score-a.score);
  const now  = open.filter(x => x.lvl !== 'gold');
  const soft = open.filter(x => x.lvl === 'gold');
  const live = x => !pending[aKey(t.id, x.id)];
  return { open, now, soft, done:all.filter(x => x.isDone),
           top:now[0] || soft[0] || null,
           lvl:open[0] ? open[0].lvl : null, all,
           liveNow:now.filter(live), stale:now.filter(x => x.isStale && live(x)) };
}

/* Tables in their opening minutes. The clock on a first impression runs
   whether or not anyone is watching it. */
function justSeated() {
  return tables.filter(t => t.status === 'seated' && !t.dishes && (t.mins||0) <= OPENING_MIN)
    .sort((a,b) => b.mins - a.mins);          // closest to losing the window first
}
/* Tables carrying an action nobody has closed. */
function unattended() {
  return tables.filter(t => signalsFor(t).stale.length)
    .sort((a,b) => signalsFor(b).stale[0].openMin - signalsFor(a).stale[0].openMin);
}
/* The waiter has looked at this table, so anything already showing is not new. */
function markTableSeen(tid) {
  tableSeen[tid] = clockMin;
  signalsFor(T(tid)).open.forEach(a => { actionSeen[aKey(tid,a.id)] = Math.min(actionSeen[aKey(tid,a.id)], clockMin); });
}
/* Closing a row is not instant. It strikes through, holds for three seconds
   with Undo where the waiter's thumb already is, then commits and collapses. */
const chased     = {};     // table -> clockMin the section was chased
const mgrVisited = {};     // table -> the manager has been over
const pending = {};        // "table:signal" -> { kind:'done'|'drop' }
const pendTimer = {};
const GRACE_MS = 3000;

function repaint() {
  renderDetail(); renderGrid();
  if (state.view === 'manager') renderManager();
}
function closeRow(tid, sid, kind) {
  const k = aKey(tid, sid);
  if (pending[k]) return;
  pending[k] = { kind };
  repaint();
  pendTimer[k] = setTimeout(() => commitRow(tid, sid), GRACE_MS);
}
function undoRow(tid, sid) {
  const k = aKey(tid, sid);
  clearTimeout(pendTimer[k]); delete pendTimer[k]; delete pending[k];
  repaint();
}
function commitRow(tid, sid) {
  const k = aKey(tid, sid), p = pending[k];
  if (!p) return;
  const el = document.querySelector(`.todo-row[data-k="${tid}:${sid}"]`);
  const finish = () => {
    delete pending[k]; delete pendTimer[k];
    if (p.kind === 'done') applyDone(tid, sid); else dismissed[k] = true;
    repaint();
  };
  // let it collapse out before the list reflows
  if (el) { el.classList.add('leaving'); setTimeout(finish, 260); } else finish();
}
function applyDone(tid, sid) {
  const t = T(tid);
  if (sid === 'call' && t && t.call) {
    // answering the call resolves it outright rather than leaving a tick behind
    t.call = null;
    return;
  }
  doneActions[aKey(tid,sid)] = true;
}

/* The manager card has no row to strike through, so it keeps the toast. */
function markDone(tid, sid) {
  const t = T(tid);
  const s = SIGNALS.find(x => x.id === sid);
  const label = (sid === 'call' && t && t.call) ? callDone(t.call)
    : (s ? val(s.done, { t, g:t && t.guest ? guests[t.guest] : null, sw:(t&&t.sw)||{}, call:t&&t.call }) : 'Done');
  const hadCall = sid === 'call' && t && t.call ? { ...t.call } : null;
  applyDone(tid, sid); repaint();
  toast(label, 'check-circle', () => {
    if (hadCall) t.call = hadCall; else delete doneActions[aKey(tid,sid)];
    repaint();
  });
}

/* A guest raising a request from the QR. In the real product this arrives
   over the wire; here it can be triggered so the handoff is demonstrable. */
/* Reset a table completely. Everything keyed to a table — its ticked-off
   actions, its approved gestures, its open request — has to go with the
   party, or the next guests inherit a service already performed. */
function turnTable(id) {
  const t = T(id); if (!t) return;
  Object.assign(t, { status:'vacant', guest:null, others:false, pax:0, mins:0,
    bill:0, ticket:0, dishes:0, fresh:false, walkInName:null, call:null, sw:null });
  const pre = id + ':';
  [doneActions, gestureDone, dismissed, actionSeen].forEach(m =>
    Object.keys(m).forEach(k => { if (k.startsWith(pre)) delete m[k]; }));
  delete tableSeen[id]; delete chased[id]; delete mgrVisited[id]; delete compsSent[id];
}

function raiseCall(tableId, type) {
  const t = T(tableId);
  if (!t || !CALL_TYPES[type] || t.status === 'vacant' || t.status === 'blocked') return;
  if (t.call) {
    // asked for something else while still waiting — keep the original wait,
    // because that is how long they have actually been sitting there
    if (!t.call.types.includes(type)) t.call.types.push(type);
  } else {
    t.call = { types: [type], min: 0, seq: ++callSeq };
  }
  renderGrid();
  if (state.view === 'manager') renderManager();
  if (state.detailId === tableId) renderDetail(); else renderElsewhere();
  toast(`Table ${t.id} — ${CALL_TYPES[type].label.toLowerCase()}`, 'bell-ring');
}
let callSeq = 3;   // the seeded requests already used 0-3
/* oldest first — a guest who has waited longest is served first */
function openCalls() {
  return tables.filter(t => t.call)
    .sort((a,b) => (b.call.min - a.call.min) || ((a.call.seq||0) - (b.call.seq||0)));
}
function anyCalls() { return openCalls().length; }
/* how urgent a wait has become — the one place the escalation rule lives */
function callHeat(c) { return c.min >= 5 ? 'hot' : c.min >= 3 ? 'warm' : ''; }
function resolveCall(tableId) {
  const t = T(tableId); if (!t || !t.call) return;
  const label = callDone(t.call);
  t.call = null;
  renderGrid(); if (state.view === 'manager') renderManager();
  if (state.detailId === tableId) renderDetail(); else renderElsewhere();
  toast(`Table ${tableId} — ${label.toLowerCase()}`, 'check-circle');
}
/* One shared way for time to pass, so a hand-pushed minute and a real one
   are indistinguishable to everything downstream. */
function advanceClock(mins = 1) {
  for (let i = 0; i < mins; i++) {
    clockMin += 1;
    tables.forEach(t => {
      if (t.status === 'seated' || t.status === 'paid') t.mins += 1;
      if (t.call) t.call.min += 1;
      if (t.lastOrderMin != null) t.lastOrderMin += 1;
      if (t.lastDrinkMin != null) t.lastDrinkMin += 1;
    });
  }
  renderView();
  if (state.detailId) renderDetail();
  if (mins > 1) toast(`${mins} minutes on — ${unattended().length} ${unattended().length===1?'table':'tables'} unattended`, 'timer');
}

/* requests age while the floor runs, so the queue reorders itself */
setInterval(() => {
  // the floor keeps running: a party's time at the table and a guest's wait
  // both advance, so "seated 38m" and "waiting 4m" stay honest together
  advanceClock(1);
}, 60000);
function attentionCount() {
  return tables.filter(t => { const l = signalsFor(t).lvl; return l === 'red' || l === 'amber'; }).length;
}

const state = { filter:'all', view:'table', q:'', searchOpen:false,
                allocId:null, allocPax:4, detailId:null, activeGuest:null, allActions:false,
                phase:2, legendOpen:false, rmPhase:1, section:'all', secOpen:false, closeId:null, clCat:null, compId:null, 
                theme:'dark' };

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
const ic = (n, c) => `<i data-lucide="${n}"${c?` class="${c}"`:''}></i>`;
const icons = () => { if (window.lucide) window.lucide.createIcons(); };
const money = n => 'SGD' + Number(n).toFixed(2);
const T = id => tables.find(t => t.id === id);
const dur = m => { const h = Math.floor(m/60), mm = m%60; return h ? `${h}h ${mm}m` : `${mm}m`; };
const nameOf = t => t.guest ? guests[t.guest].name : (t.walkInName || 'Guest');
const firstName = t => nameOf(t).split(' ')[0];

let toastTimer;
let undoFn = null;
function toast(msg, icon, undo) {
  const el = document.getElementById('toast');
  undoFn = undo || null;
  el.innerHTML = `${ic(icon || 'check-circle')}<span>${msg}</span>` +
    (undo ? `<button class="toast-undo" id="toast-undo">${ic('undo-2','xs')} Undo</button>` : '');
  icons(); el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('on'); undoFn = null; }, undo ? 5000 : 2400);
}
function hideToast() {
  document.getElementById('toast').classList.remove('on');
  clearTimeout(toastTimer); undoFn = null;
}
const open = id => document.getElementById(id).classList.add('on');
const shut = id => document.getElementById(id).classList.remove('on');

/* ══════════════════════════════════════════════════════════════
   TABLE GRID
   ══════════════════════════════════════════════════════════════ */
function visibleTables() {
  let list = tables.slice();
  if (state.section !== 'all') list = list.filter(t => t.sec === state.section);
  if (state.filter === 'vacant')   list = list.filter(t => t.status === 'vacant');
  if (state.filter === 'allocate') list = list.filter(t => t.status === 'seated' || t.status === 'paid');
  if (state.filter === 'attention') {
    const rank = { red:0, amber:1 };
    list = list.filter(t => { const l = signalsFor(t).lvl; return l === 'red' || l === 'amber'; })
               .sort((a,b) => (b.call?1:0) - (a.call?1:0)
                           || rank[signalsFor(a).lvl] - rank[signalsFor(b).lvl]);
  }
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter(t =>
    ('table ' + t.id).includes(q) || t.id.replace(/^0/,'').includes(q) ||
    (t.guest && guests[t.guest].name.toLowerCase().includes(q)) ||
    (t.status !== 'vacant' && t.status !== 'blocked' && 'guest'.includes(q))
  );
  return list;
}

function cardHtml(t) {
  if (t.status === 'vacant')
    return `<div class="tcard vacant" data-id="${t.id}"><div class="tc-vac">Table ${t.id}</div></div>`;
  if (t.status === 'blocked')
    return `<div class="tcard blocked" data-id="${t.id}"><div class="tc-vac">Table ${t.id}</div></div>`;

  const cls = t.status === 'paid' ? 'paid' : 'seated';
  const sig = signalsFor(t);
  const bkt = bucketOfTable(t);
  // the badge is the single indicator: how many things this table needs, and
  // how loudly. Nobody has closed one for a while -> it reads as late.
  const tone = sig.liveNow[0] ? sig.liveNow[0].lvl : '';
  const isLate = sig.stale.length > 0;
  const isNew = !isLate && sig.liveNow.some(a => a.isNew);
  return `<div class="tcard ${cls}" data-id="${t.id}">
    <div class="tc-head">
      <span class="tc-id">Table ${t.id}</span>
      <span class="tc-right">
        ${sig.liveNow.length ? `<span class="tc-count ${tone}${isLate?' late':''}${isNew?' fresh':''}"
            title="${sig.liveNow.length} to do${isLate?` · ${sig.stale[0].openMin} min unattended`:''}">${sig.liveNow.length}</span>` : ''}
        <span class="tc-doc">${ic('receipt-text','sm')}</span>
      </span>
    </div>
    <div class="tc-name${nameOf(t).length > 15 ? ' long' : ''}">${nameOf(t)}${t.others ? ' <span class="others">&amp; others</span>' : ''}</div>
    <div class="tc-meta">
      <span>${ic('user','xs')} ${t.pax}</span>
      <span>${ic('clock','xs')} ${dur(t.mins)}</span>
      ${state.phase >= 3 && bkt && BUCKETS[bkt].tone !== 'plain' ? `<span class="bkt ${BUCKETS[bkt].tone}" style="margin-left:auto">${BUCKETS[bkt].label}</span>` : ''}
    </div>
    ${t.call && state.phase >= 2
        ? `<div class="tc-call k-${callKind(t.call)}">
             ${callTypes(t.call).map(k => `<em class="ci ci-${k}">${ic(CALL_TYPES[k].icon,'xs')}</em>`).join('')}
             <span>${callTypes(t.call).map(k => CALL_TYPES[k].short).join(' · ')}</span>${
             callIsMgr(t.call)?`<b title="The manager handles this">${ic('crown','xs')}</b>`:''}${
             t.call.min?`<u>${t.call.min}m</u>`:''}</div>`
        : (sig.top ? `<div class="tc-act ${sig.top.isStale?'late':sig.top.lvl}">${ic(sig.top.icon,'xs')} <span>${sig.top.act}</span>${
             sig.top.isStale ? `<span class="tc-late">${sig.top.openMin}m</span>` : (sig.top.isNew ? `<span class="tc-new">New</span>` : '')
           }</div>` : '')}
    ${t.bill > 0 ? `<div class="tc-bill" style="margin-top:11px">${money(t.bill)}</div>` : ''}
  </div>`;
}

const SECTIONS = () => [...new Set(tables.map(t => t.sec))];
function renderSecMenu() {
  const m = document.getElementById('sec-menu');
  if (!m) return;
  const row = (v,label) => `<button class="sec-item ${state.section===v?'on':''}" data-sec="${v}">
      <span>${label}</span><span class="n">${v==='all'?tables.length:tables.filter(t=>t.sec===v).length}</span>
    </button>`;
  m.innerHTML = row('all','All sections') + SECTIONS().map(x => row(x,x)).join('');
  m.classList.toggle('on', state.secOpen);
  const b = document.getElementById('btn-sec');
  b.classList.toggle('filtered', state.section !== 'all');
  document.getElementById('sec-lbl').textContent = state.section === 'all' ? 'All sections' : state.section;
}

/* One capsule per table: what kind of request, which table, how long.
   Tap it to go there; tick it to clear it. There is no "on my way" —
   a waiter who is walking over does not stop to tell the tablet. */
function callCap(t) {
  const c = t.call, ks = callTypes(c), blind = callBlind(c);
  return `<span class="cap ${callKind(c)} ${callHeat(c)==='hot'?'hot':''}" title="${callLabel(c)}${blind?' — '+blind:''}">
    <button class="cap-go" data-goto="${t.id}">
      <span class="cap-ic">${ks.slice(0,3).map(k => `<em class="ci ci-${k}">${ic(CALL_TYPES[k].icon,'sm')}</em>`).join('')}${
        ks.length > 3 ? `<em class="ci more">+${ks.length-3}</em>` : ''}</span>
      <b>${t.id}</b><i>${c.min}m</i>${callIsMgr(c) ? `<span class="cap-mgr" title="The manager handles this">${ic('crown','sm')}</span>` : ''}
    </button>
    <button class="cap-x" data-resolve="${t.id}" title="Handled">${ic('check','sm')}</button>
  </span>`;
}

/* A table whose actions nobody has closed. No tick here — you have to open
   it and either do the thing or say it does not apply. */
function freshCap(t) {
  const left = OPENING_MIN - t.mins;
  return `<span class="cap opening" title="${nameOf(t)} — seated ${dur(t.mins)}">
    <button class="cap-go" data-goto="${t.id}">
      <span class="cap-ic"><em class="ci ci-opening">${ic('hand-platter','sm')}</em></span>
      <b>${t.id}</b><i>${t.mins}m</i>${left <= 3 ? `<em class="ci more">${left}m left</em>` : ''}
    </button>
  </span>`;
}

function lateCap(t) {
  const st = signalsFor(t).stale, a = st[0];
  return `<span class="cap late" title="${a.act} — open ${a.openMin} min">
    <button class="cap-go" data-goto="${t.id}">
      <b>${t.id}</b><i>${a.openMin}m</i>${st.length>1?`<em class="ci more">${st.length}</em>`:''}
    </button>
  </span>`;
}

function renderCallBar() {
  const bar = document.getElementById('callbar');
  if (!bar) return;
  const calling = state.phase >= 2 ? openCalls() : [];
  const late    = state.phase >= 2 ? unattended() : [];
  const fresh   = state.phase >= 2 ? justSeated() : [];
  if (!calling.length && !late.length && !fresh.length) { bar.classList.remove('on'); bar.innerHTML = ''; return; }
  bar.className = 'needbar on';
  bar.innerHTML =
    (calling.length ? `<div class="nb-grp guests">
        <span class="nb-lbl">${ic('bell-ring','sm')} ${calling.length===1?'Guest waiting':'Guests waiting'}</span>
        <span class="nb-caps">${calling.map(callCap).join('')}</span>
      </div>` : '') +
    (late.length ? `<div class="nb-grp late">
        <span class="nb-lbl">${ic('timer','sm')} Overdue</span>
        <span class="nb-caps">${late.slice(0, NB_CAP).map(lateCap).join('')}${
          late.length > NB_CAP ? `<button class="cap late more" data-v-late="1"
            title="Every overdue table is listed in the Manager tab">+${late.length - NB_CAP} more</button>` : ''}</span>
      </div>` : '') +
    (fresh.length ? `<div class="nb-grp opening">
        <span class="nb-lbl">${ic('hand-platter','sm')} Just seated</span>
        <span class="nb-caps">${fresh.slice(0, NB_CAP).map(freshCap).join('')}${
          fresh.length > NB_CAP ? `<span class="cap opening more">+${fresh.length - NB_CAP}</span>` : ''}</span>
      </div>` : '');
  icons();
}

function renderGrid() {
  renderCallBar();
  const g = document.getElementById('grid');
  if (!g) return;                       // not on the floor — nothing to draw
  const cnt = attentionCount();
  const badge = document.getElementById('attn-cnt');
  if (badge) { badge.textContent = cnt; badge.style.display = cnt ? '' : 'none'; }
  const list = visibleTables();
  g.innerHTML = list.length
    ? list.map(cardHtml).join('')
    : (state.filter === 'attention'
        ? `<div class="stub" style="grid-column:1/-1">${ic('check-circle')}<b>Nothing needs you</b><span>Every table on the floor is running fine.</span></div>`
        : `<div class="stub" style="grid-column:1/-1">${ic('search-x')}<b>No tables match</b><span>Try a different table number or name.</span></div>`);
  icons();
}

function openAllocate(id) {
  state.allocId = id; state.allocPax = 4;
  document.getElementById('alloc-title').textContent = 'Table ' + id;
  document.getElementById('a-phone').value = '';
  document.getElementById('a-name').value = '';
  document.getElementById('a-match').innerHTML = '';
  renderPax();
  open('veil-alloc');
  icons();
}
function renderPax() {
  const pg = document.getElementById('pax-grid'); if (!pg) return;
  pg.innerHTML =
    [1,2,3,4,5,6,7,8].map(n => `<button class="pax ${state.allocPax===n?'on':''}" data-pax="${n}">${n}</button>`).join('') +
    `<button class="pax wide" data-pax="custom">Custom pax</button>`;
}
function lookupGuest(v) {
  const s = v.replace(/\s/g,'').toLowerCase();
  if (s.length < 4) return null;
  return Object.values(guests).find(g =>
    g.phone.replace(/\s|X/gi,'').includes(s.replace(/\D/g,'').slice(0,4)) ||
    g.name.toLowerCase().startsWith(v.trim().toLowerCase())
  ) || null;
}
function onAllocLookup() {
  const phone = document.getElementById('a-phone').value;
  const nm    = document.getElementById('a-name').value;
  const hit = lookupGuest(nm || phone);
  const box = document.getElementById('a-match');
  if (hit && (nm || phone.length >= 4)) {
    if (!nm) document.getElementById('a-name').value = hit.name;
    box.innerHTML = `<div class="info-card" style="margin:0">
      <div class="ic-h">${ic('user-check')} Returning guest</div>
      <div class="ic-b">${hit.name} · ${hit.visits} visits · last ${hit.lastVisit || '—'}</div>
    </div>`;
  } else box.innerHTML = '';
  icons();
}
function confirmAllocate() {
  const t = T(state.allocId); if (!t) return;
  const nm = document.getElementById('a-name').value.trim();
  const hit = Object.values(guests).find(g => g.name.toLowerCase() === nm.toLowerCase());
  tables = tables.map(x => ({ ...x, fresh:false }));
  const tt = T(state.allocId);
  Object.assign(tt, {
    status:'seated', fresh:true, pax:state.allocPax, mins:0, bill:0,
    server:'Jason', ticket:0, dishes:0, others:state.allocPax > 1,
    guest: hit ? hit.id : null,
    walkInName: hit ? null : (nm || null),
  });
  shut('veil-alloc');
  renderGrid();
  toast(`Table ${tt.id} allocated · QR printed`, 'qr-code');
}

/* ══════════════════════════════════════════════════════════════

function partyOf(t) {
  const pool = ['ana','vik','irf'];
  const lead = t.guest || 'irf';
  if (!t.others) return [lead];
  const others = pool.filter(k => k !== lead).slice(0, Math.max(0, Math.min(3, (t.pax || 1) - 1)));
  return [lead, ...others];
}

function orderItems(t) {
  if (!t.dishes) return [];
  const pool = [
    { name:'FILLET MIGNON', qty:1, price:18.90 },
    { name:'GRILLED CHICKEN', qty:2, price:25.00 },
    { name:'CITRUS SALAD', qty:1, price:8.00 },
    { name:'LAVA CAKE', qty:2, price:16.00 },
  ];
  return pool.slice(0, Math.min(t.dishes, pool.length));
}

function recoHtml(r) {
  return `<div class="reco">
    <div class="reco-img">${ic(r.icon,'lg')}${r.best ? `<div class="best-ribbon">#1 All Time<br>Best-Seller</div>` : ''}</div>
    <div class="reco-b">
      <div class="badges">
        ${r.reorder ? `<span class="bdg reorder">${r.reorder}x Reorder</span>` : ''}
      </div>
      <div class="reco-nm">${r.name}</div>
      <div class="reco-pr">${money(r.price)}</div>
    </div>
  </div>`;
}

/* The checklist. Three rows at most before it folds — beyond that the
   waiter is reading rather than acting. */
function actionsHtml(t) {
  // Phase 1 shows who is at the table and nothing more — no checklist to
  // render, and no pretending the table is fine when nobody has looked.
  if (state.phase < 2) return '';
  const sig = signalsFor(t);
  const settling = sig.open.some(a => pending[aKey(t.id, a.id)]);
  if (!sig.open.length && !settling) {
    const nDone = sig.done.length;
    return `<div class="todo all-good"><div class="todo-clear">${ic('check-circle','sm')}
      <span>All good here</span>
      ${nDone ? `<i>${nDone} handled</i>` : ''}</div></div>`;
  }
  // Five rows, total. Work takes the slots first; whatever is left goes to
  // talking points. Past that a waiter is reading, not glancing — so the rest
  // sits behind one tap rather than making the list longer.
  const nowRows  = state.allActions ? sig.now  : sig.now.slice(0, MAX_SHOW);
  const slots    = Math.max(0, MAX_SHOW - nowRows.length);
  const soft     = state.allActions ? sig.soft : sig.soft.slice(0, slots);
  const hidden   = (sig.now.length - nowRows.length) + (sig.soft.length - soft.length);
  const total = sig.all.length, doneN = sig.done.length;

  /* Two ways out of every row, because "not applicable" is a real answer.
     Dismiss sits left, done sits right, and either one strikes the row through
     and holds it for three seconds with Undo in place — no hunting for a
     toast at the other end of the screen. */
  const row = a => {
    const p = pending[aKey(t.id, a.id)];
    return `<div class="todo-row ${a.isStale?'late':a.lvl} ${a.isNew?'is-new':''} ${p?'settling '+p.kind:''}"
                 data-k="${t.id}:${a.id}">
      <button class="todo-x" data-drop="${a.id}" title="Not applicable — dismiss" ${p?'disabled':''}>${ic('x','sm')}</button>
      <div class="todo-b">
        <span class="todo-a">${a.act}
          ${p ? '' : a.isStale ? `<span class="todo-age">${ic('timer','xs')} ${a.openMin}m</span>`
                   : (a.isNew ? `<span class="todo-flag">New</span>` : '')}</span>
        <span class="todo-w">${p ? (p.kind==='done' ? val(a.done,null) || 'Done' : 'Dismissed — will not be raised again') : a.why}</span>
      </div>
      ${p ? `<button class="todo-undo" data-undo="${a.id}">${ic('undo-2','xs')} Undo</button>`
          : `${a.who === 'manager' ? `<span class="todo-who">Manager</span>` : ''}
             <button class="tick-hit" data-do="${a.id}" title="Mark done"><span class="tick">${ic('check')}</span></button>`}
    </div>`;
  };

  const staleN = sig.stale.length;
  return `<div class="todo${staleN?' has-late':''}">
    <div class="todo-h"><b>${sig.now.length ? 'Do now' : 'What to do'}</b>
      ${staleN ? `<span class="todo-warn">${ic('timer','xs')} ${staleN} overdue</span>` : ''}
      <span class="todo-prog">${doneN} of ${total} done</span></div>
    ${nowRows.map(row).join('')}
    ${nowRows.length && soft.length ? `<div class="todo-sub">${ic('message-square','xs')} Worth mentioning while you are there</div>` : ''}
    ${soft.map(row).join('')}

    ${hidden ? `<button class="todo-more" id="act-more">+ ${hidden} more</button>` : ''}
    ${state.allActions && sig.open.length > MAX_SHOW ? `<button class="todo-more" id="act-more">Show fewer</button>` : ''}
  </div>`;
}

function openDetail(id) {
  const t = T(id); if (!t || t.status === 'vacant' || t.status === 'blocked') return;
  state.detailId = id;
  state.allActions = false;
  markTableSeen(id);
  const party = partyOf(t);
  if (!state.activeGuest || !party.includes(state.activeGuest)) state.activeGuest = party[0];
  renderDetail();
  open('veil-detail');
}

/* ══════════════════════════════════════════════════════════════
   MANAGER
   A manager cannot walk every table. This view answers one question —
   where is my presence worth more than a waiter's?
   ══════════════════════════════════════════════════════════════ */
const gestureDone = {};
/* A gesture is something only a manager can authorise. Each is tied to a
   reason, so nothing is comped without one. */
function gesturesFor(t) {
  const g = t.guest ? guests[t.guest] : null;
  if (!g) return [];
  const out = [];
  if (g.prevIssue) out.push({ id:'comp-recovery', icon:'wine',
    label:'Comp a round of drinks', why:`Last visit went wrong — ${g.prevIssue.toLowerCase()}.` });
  // the voucher offer itself is Phase 3, so authorising one is too
  if (g.voucher && state.phase >= 3) out.push({ id:'comp-voucher', icon:'ticket',
    label:`Authorise ${g.voucher.label}`, why:g.voucher.why + '.' });
  if (g.occasion && state.phase >= 3) out.push({ id:'comp-occasion', icon:'cake',
    label:'Send a complimentary dessert', why:`${g.name.split(' ')[0]} is here for a ${g.occasion.toLowerCase()}.` });
  return out.filter(x => !gestureDone[t.id + ':' + x.id]);
}
function doGesture(tid, gid, label) {
  gestureDone[tid + ':' + gid] = true;
  renderManager(); renderGrid();
  toast(`${label} — sent to Table ${tid}`, 'check-circle',
    () => { delete gestureDone[tid + ':' + gid]; renderManager(); renderGrid(); });
}

/* What a manager can put on a table, at their own discretion. Pulse suggests
   some of these; this list is the manual override, always available. */
const COMPS = [
  { id:'dessert',   icon:'cake-slice',      label:'Dessert' },
  { id:'drinks',    icon:'wine',            label:'Round of drinks' },
  { id:'champagne', icon:'martini',         label:'Glass of champagne' },
  { id:'starter',   icon:'soup',            label:'Starter' },
  { id:'coffee',    icon:'coffee',          label:'Coffee and petits fours' },
  { id:'voucher',   icon:'ticket',          label:'Voucher for the next visit' },
];
const compsSent = {};      // table -> [label]

function openComp(id) {
  state.compId = id;
  const t = T(id), g = t && t.guest ? guests[t.guest] : null;

function sendComp(cid) {

/* A manager scans this screen standing up, between tables. So it is a list of
   rows, not a wall of cards — the table, who is there, why it is on the list,
   and the decisions, all on one line where the words allow. */
function mgrRow(t, o) {
  const g = t.guest ? guests[t.guest] : null;
  const bkt = bucketOfTable(t);
  return `<div class="mg-row ${o.tone||''}">
    <button class="mg-t" data-goto="${t.id}">
      <span class="mg-num">${t.id}</span><span class="mg-sec">${t.sec||''}</span>
    </button>
    <div class="mg-b">
      <div class="mg-top">
        <span class="mg-name">${nameOf(t)}</span>
        ${bkt && BUCKETS[bkt].tone !== 'plain' ? `<span class="bkt ${BUCKETS[bkt].tone}">${BUCKETS[bkt].label}</span>` : ''}
        ${g && g.score ? `<span class="bkt gold">${g.score.label}</span>` : ''}
        <span class="mg-when">${o.meta||''}</span>
      </div>
      <div class="mg-why">${o.whys.map(w => `<span>${ic(w.icon,'xs')}${w.text}</span>`).join('')}</div>
    </div>
    <div class="mg-act">
      ${o.actions.join('')}
      <button class="mg-house ${gesturesFor(t).length?'nudge':''}" data-comp="${t.id}"
        title="${gesturesFor(t).length ? 'Pulse suggests something here' : 'Send something on the house'}">
        ${ic('hand-heart','xs')} On the house${gesturesFor(t).length?`<b>${gesturesFor(t).length}</b>`:''}</button>
      ${(compsSent[t.id]||[]).length ? `<span class="mg-sent" title="${(compsSent[t.id]||[]).join(', ')}">${ic('check','xs')} sent</span>` : ''}
    </div>
  </div>`;
}

/* Three things a manager is for. A guest who is unhappy now and a guest who
   was let down last time are the same job — putting it right — so they share
   a section. Comps ride on whichever row they belong to rather than sitting
   in a queue of their own. */
const MG_SECTIONS = [
  { rank:0, icon:'circle-alert', title:'Put it right', urgent:true,
    rule:'A concern raised from their phone in the last few minutes, or a guest whose last visit went badly. Either way it is yours to fix.',
    empty:'Nobody is unhappy.' },
  { rank:1, icon:'crown', title:'Meet and greet',
    rule:'Top spenders, regulars, and guests who have not been in for a while. A hello from the manager lands differently.',
    empty:'No guest needs you personally right now.' },
  { rank:2, icon:'timer', title:'Nobody has picked these up',
    rule:'Past its limit with no one closing it. Push it to the section, or take it on yourself.',
    empty:'The floor is keeping up.' },
];

function managerQueue() {
  const occupied = tables.filter(t => t.status === 'seated' || t.status === 'paid');
  const rows = [];
  let nFix = 0, nGreet = 0, nLate = 0, nGest = 0;

  occupied.forEach(t => {
    const whys = [], actions = [];
    let rank = 99, tone = '', meta = `${t.pax} pax · ${dur(t.mins)}`;

    // errands stay on the floor; only an unhappy guest reaches a manager
    if (t.call && callIsMgr(t.call)) {
      nFix++; rank = 0; tone = 'red';
      whys.push({ icon:'circle-alert', text:`Raised a concern ${t.call.min}m ago — they could not say why.` });
      actions.push({ r:0, html:`<button class="mg-btn" data-resolve="${t.id}">Handled</button>` });
    }

    const mgrSig = signalsFor(t).open.filter(a => a.who === 'manager' && a.id !== 'call');
    mgrSig.forEach(a => {
      const r = a.mgrRank != null ? a.mgrRank : 1;
      if (r === 0) nFix++; else nGreet++;
      rank = Math.min(rank, r); if (a.lvl === 'red') tone = tone || 'red';
      whys.push({ icon:a.icon, text:a.why });
      actions.push({ r, html:`<button class="mg-btn" data-do-mgr="${t.id}|${a.id}">${a.act}</button>` });
    });

    const b = bucketOfTable(t), g = guests[t.guest];
    if (g && (b === 'risk' || b === 'lapsed')) {
      const r = b === 'risk' ? 0 : 1;          // let down last time is putting it right
      if (r === 0) nFix++; else nGreet++;
      rank = Math.min(rank, r); tone = tone || (b === 'risk' ? 'red' : '');
      const line = b === 'risk' ? `Last visit went wrong — ${g.prevIssue.toLowerCase()}.`
                                : `Not been in since ${g.lastVisit}.`;
      if (!whys.some(w => w.text === line)) whys.push({ icon:'heart-crack', text:line });
      if (!mgrSig.some(a => (a.mgrRank != null ? a.mgrRank : 1) === r) && !mgrVisited[t.id])
        actions.push({ r, html:`<button class="mg-btn" data-mgr-visit="${t.id}">Visit the table</button>` });
    }

    const st = signalsFor(t).stale;
    if (st.length) {
      nLate++; rank = Math.min(rank, 2); tone = tone || 'amber';
      whys.push({ icon:'timer', text:`${st[0].act} — open ${st[0].openMin}m, nobody has closed it.` });
      const since = chased[t.id] != null ? clockMin - chased[t.id] : null;
      actions.push({ r:2, html: since != null
        ? `<button class="mg-btn ghost" data-chase="${t.id}">${ic('check','xs')} ${t.server} chased ${since}m</button>`
        : `<button class="mg-btn" data-chase="${t.id}">${ic('megaphone','xs')} Chase ${t.server}</button>` });
      actions.push({ r:2, html:`<button class="mg-btn ghost" data-take="${t.id}|${st[0].id}">I'll take it</button>` });
    }

    nGest += gesturesFor(t).length;   // offered inside the On the house sheet

    // only the decisions for why this row is here — two at most, so the row
    // stays one line and the whole list can be read standing up
    const keep = actions.filter(a => a.r === rank).slice(0, 2).map(a => a.html);
    if (rank === 99 || !keep.length) return;
    rows.push({ t, rank, tone, whys: whys.slice(0, 2), actions: keep, meta });
  });

  rows.sort((a,b) => a.rank - b.rank || (b.t.call?.min||0) - (a.t.call?.min||0));
  return { rows, occupied, counts:{ fix:nFix, greet:nGreet, late:nLate, gest:nGest } };
}

function renderManager() {
  const c = document.getElementById('manager-content');
  if (!c) return;
  const { rows, occupied, counts } = managerQueue();
  const covers = occupied.reduce((a,t) => a + (t.pax||0), 0);
  const quiet = occupied.filter(t => !rows.some(r => r.t.id === t.id));

  const sec = s => {
    const mine = rows.filter(r => r.rank === s.rank);
    const CAP = 5, shown = mine.slice(0, CAP), rest = mine.length - shown.length;
    return `<div class="mg-sh ${s.urgent && mine.length ? 'urgent':''}">${ic(s.icon,'xs')} ${s.title}
        ${mine.length ? `<b>${mine.length}</b>` : ''}</div>
      <div class="mg-rule">${s.rule}</div>
      ${mine.length ? shown.map(r => mgrRow(r.t, r)).join('') +
          (rest ? `<div class="mg-rest">${ic('timer','xs')} and ${rest} more like this — the floor is behind, not one table</div>` : '')
        : `<div class="mg-empty">${ic('check-circle','sm')} ${s.empty}</div>`}`;
  };

  c.innerHTML = `
    <div class="mg-head">
      <div>
        <div class="mg-h1">Where you are needed</div>
        <div class="mg-sub">${occupied.length} tables · ${covers} covers on the floor</div>
      </div>
      <div class="mg-stats">
        <div class="mg-stat ${counts.fix?'red':''}"><b>${counts.fix}</b><span>Put it right</span></div>
        <div class="mg-stat"><b>${counts.greet}</b><span>Meet and greet</span></div>
        <div class="mg-stat"><b>${counts.late}</b><span>Dropped</span></div>
      </div>
    </div>
    ${MG_SECTIONS.map(sec).join('')}
    <div class="mg-sh">${ic('users','xs')} Rest of the floor ${quiet.length ? `<b>${quiet.length}</b>` : ''}</div>
    <div class="mg-rule">Running fine. Nothing here needs you.</div>
    ${quiet.length
      ? `<div class="mg-quiet">${quiet.map(t => `<button class="mg-q" data-goto="${t.id}">
           <span>${t.id}</span><em>${firstName(t)}</em><i>${dur(t.mins)}</i></button>`).join('')}</div>`
      : `<div class="mg-empty">${ic('check-circle','sm')} Every table needs something.</div>`}`;
  icons();
}

/* ══════════════════════════════════════════════════════════════
   CLOSING A TABLE
   The only moment staff reliably know something Pulse does not. Ask
   once, keep it to one line, and never make it a gate.
   ══════════════════════════════════════════════════════════════ */
function closeTable(id) {
  const t = T(id); if (!t) return;
  turnTable(id);
  shut('veil-close'); shut('veil-detail'); state.detailId = null;
  renderGrid(); if (state.view === 'manager') renderManager();
  toast(`Table ${id} closed`, 'check-circle');
}
function openClose(id) {
  state.closeId = id; state.clCat = null;
  const t = T(id), g = t && t.guest ? guests[t.guest] : null;
  document.getElementById('cl-title').textContent = `Close Table ${id}`;
  document.getElementById('cl-sub').textContent = g
    ? `Anything worth remembering about ${g.name.split(' ')[0]} for next time? Optional.`
    : 'Anything worth remembering about this table? Optional.';
  document.getElementById('cl-text').value = '';
  renderClCats(); open('veil-close'); icons();
}
function renderClCats() {
  const el = document.getElementById('cl-cats'); if (!el) return;
  el.innerHTML = REM_CATS.map(c =>
    `<button class="pax ${state.clCat===c?'on':''}" data-cl="${c}" style="font-size:12.5px">${c}</button>`).join('');
}
function saveCloseNote() {
  const txt = document.getElementById('cl-text').value.trim();
  const id = state.closeId, t = T(id);
  if (!txt) { closeTable(id); return; }                 // never gate on the note
  const g = t && t.guest ? guests[t.guest] : null;
  const line = `${state.clCat ? state.clCat + ': ' : ''}${txt}`;
  if (g) (g.notes = g.notes || []).push(line);
  closeTable(id);
  toast(g ? `Saved to ${g.name.split(' ')[0]}` : 'Note saved to this table', 'bookmark-check');
}

   REMEMBER THIS

      <ol class="gd-notes">
        <li><b>Table number</b> — always top left, always the same place.</li>
        <li><b>Count badge</b> — how many things to <em>do</em>, toned by the most urgent. Talking points are not counted; nine of those is not a briefing.</li>
        <li><b>Guest name</b> — two lines if it needs them, a size smaller if it is long. Never cut. A table with no profile is <em>Guest</em>.</li>
        <li><b>Covers and time</b> — party size and how long they have been sitting.</li>
        <li><b>Bucket label</b> — derived, never typed: new, returning, regular, VIP, lapsed, at risk.</li>
        <li><b>Top action</b> — the single most urgent line, with an age chip once nobody has closed it.</li>
        <li><b>Bill</b> — green once settled, so a turnable table reads at a glance.</li>
      </ol>
    </div>

    <div class="set-h" style="margin-top:30px">6 · Table states</div>
    <div class="gd-states">
      ${[['vacant','Vacant','Tap to seat a guest'],['seated','Seated','Service running'],
         ['paid','Settled','Bill paid — free to clear'],['blocked','Blocked','Not in service tonight']]
        .map(([c,t,d]) => `<div class="gd-state"><span class="lg-sw ${c==='seated'?'':c}"></span><b>${t}</b><i>${d}</i></div>`).join('')}
    </div>

    <div class="set-h" style="margin-top:30px">7 · The screens</div>
    <div class="gd-screens">
      ${GUIDE_SCREENS.map(sc => `<div class="gd-screen">
        <div class="gd-sh">${ic(sc.icon,'sm')}<b>${sc.name}</b></div>
        <div class="gd-who">${sc.who}</div>
        <p>${sc.what}</p>
        <ul>${sc.has.map(h => `<li>${h}</li>`).join('')}</ul>
      </div>`).join('')}
    </div>

    <div class="set-h" style="margin-top:30px">8 · The three phases</div>
    <div class="set-sub">Not how much data we hold — what Pulse does with it. Switch between them in Settings.</div>
    <div class="gd-rows">
      ${[1,2,3].map(pn => `<div class="gd-row">
        <span class="gd-a"><span class="bkt ${state.phase>=pn?'gold':''}">${pn}</span></span>
        <span class="gd-b"><b>${PHASE_META[pn].verb} — ${PHASE_META[pn].name}</b><i>${PHASE_META[pn].blurb}</i></span>
        <span class="gd-c">${SIGNALS.filter(x=>x.phase===pn).length} actions · ${FEATURES.filter(f=>f.p===pn&&f.built).length} of ${FEATURES.filter(f=>f.p===pn).length} features built</span>
      </div>`).join('')}
    </div>

    <div class="set-h" style="margin-top:30px">9 · Colour</div>
    <div class="set-sub">One accent. Red is rationed. Everything else is ink on a warm near-black.</div>
    <div class="gd-sws">
      ${sw('#d9b45f','Gold — the single accent')}
      ${sw('#d8483f','Red — intervention only')}
      ${sw('#d69a45','Amber — a task, or overdue')}
      ${sw('#22b8a6','Teal — something to carry')}
      ${sw('#3f9f6b','Green — settled')}
      ${sw('#0b0b0c','Canvas')}
      ${sw('#17181a','Card')}
      ${sw('#f4f2ee','Ink')}
    </div>

    <div class="set-h" style="margin-top:30px">10 · Rules we hold to</div>
    <div class="set-sub">The reasons things were taken out, not only put in.</div>
    <div class="gd-rules">
      ${GUIDE_RULES.map(([t,d],i) => `<div class="gd-rule"><span>${i+1}</span><div><b>${t}</b><p>${d}</p></div></div>`).join('')}
    </div>
  </div>`;
}

const STUBS = {
  order: ['shopping-bag','Orders','Live order tickets across the floor.'],
  menu:  ['utensils-crossed','Menu','Categories, dishes and availability.'],
};
function settingsHtml() {
  const counts = p => SIGNALS.filter(s => s.phase === p).length;
  const cell = (p, title, body) => {
    const live = state.phase >= p;
    return `<button class="ph-card ${live?'on':''}" data-phase="${p}">
      <span class="ph-top">
        <b>${title}</b>
        <span class="bkt ${live?'gold':''}">${live?'Live':'Off'}</span>
      </span>
      <span class="ph-body">${body}</span>
      <span class="ph-n">${p===1?'':'+ '}${counts(p)} actions${p===3&&live?` · ${SIGNALS.length} in total`:''}</span>
    </button>`;
  };
  return `<div class="setwrap">
    <div class="set-h">Service intelligence</div>
    <div class="set-sub">Which layer of intelligence Pulse is running tonight. Each phase only adds actions we can genuinely ground in data.</div>
    <div class="ph-grid">
      ${[1,2,3].map(pn => cell(pn, `Phase ${pn} · ${PHASE_META[pn].verb}`, PHASE_META[pn].blurb)).join('')}
    </div>
    ${state.phase >= 2 ? `<div class="set-h" style="margin-top:26px">Guest requests</div>
    <div class="set-sub">Requests arrive from the guest's QR — five buttons on their phone, no free text. Trigger one to see the handoff to the floor.</div>
    <div class="call-sim">
      <div class="cs-row">
        <span class="fld-lbl" style="margin:0">Table</span>
        <select class="inp" id="cs-table" style="height:42px;max-width:150px">
          ${tables.filter(t => t.status === 'seated' || t.status === 'paid').map(t => `<option value="${t.id}">Table ${t.id}</option>`).join('')}
        </select>
      </div>
      <div class="cs-btns">
        ${Object.keys(CALL_TYPES).map(k => `<button class="pax" data-call="${k}" style="font-size:12.5px;padding:0 12px">${CALL_TYPES[k].label}</button>`).join('')}
      </div>
      ${anyCalls() ? `<div class="cs-live">${ic('bell-ring','sm')} ${anyCalls()} open ${anyCalls()===1?'request':'requests'} on the floor</div>` : ''}
    </div>

    <div class="set-h" style="margin-top:26px">Service clock</div>
    <div class="set-sub">Pulse advances a minute at a time on its own. Push it forward to watch an action nobody has closed cross the ${STALE_MIN}-minute line and escalate.</div>
    <div class="call-sim">
      <div class="cs-btns">
        <button class="pax" data-ff="5"  style="font-size:12.5px;padding:0 12px">+ 5 minutes</button>
        <button class="pax" data-ff="15" style="font-size:12.5px;padding:0 12px">+ 15 minutes</button>
      </div>
      <div class="cs-live">${ic('timer','sm')} ${clockMin} min into service · ${unattended().length} ${unattended().length===1?'table':'tables'} unattended</div>
    </div>` : ''}

    <div class="set-h" style="margin-top:30px">Look</div>
    <div class="set-sub">Pulse ships dark for evening service. Light suits daytime rooms and bright terraces.</div>
    <div class="theme-row">
      <button class="theme-opt ${state.theme==='dark'?'on':''}" data-theme="dark">${ic('moon','sm')} Dark</button>
      <button class="theme-opt ${state.theme==='light'?'on':''}" data-theme="light">${ic('sun','sm')} Light</button>
    </div>

    <div class="set-h" style="margin-top:30px">Roadmap</div>
    <div class="set-sub">Every feature on the plan, with the phase it lands in and who owns it. ${FEATURES.filter(f=>f.built).length} of ${FEATURES.length} are live in this prototype.</div>
    <div class="rm-tabs" id="rm-tabs">
      ${[1,2,3].map(pn => `<button class="rm-tab ${state.rmPhase===pn?'on':''}" data-rm="${pn}">Phase ${pn} · ${PHASE_META[pn].verb}<span class="rm-n">${FEATURES.filter(f=>f.p===pn).length}</span></button>`).join('')}
    </div>
    <div class="rm-list">
      ${FEATURES.filter(f => f.p === state.rmPhase).map(f => `<div class="rm-row ${f.built?'built':''}">
          <span class="rm-tick">${ic(f.built?'check':'circle-dashed','xs')}</span>
          <span class="rm-b">
            <span class="rm-n2">${f.n}${f.hero?' <span class="rm-pill hero">Hero</span>':''}${f.foundation?' <span class="rm-pill">Foundation</span>':''}</span>
            ${f.ui ? `<span class="rm-ui">${ic('layout-template','xs')} ${f.ui}</span>` : ''}
            ${f.note ? `<span class="rm-note">${f.note}</span>` : ''}
          </span>
          <span class="rm-meta">
            <span class="rm-own">${f.own}${f.sup?` + ${f.sup}`:''}</span>
          </span>
        </div>`).join('')}
    </div>

    <div class="set-h" style="margin-top:30px">Guest buckets</div>
    <div class="set-sub">Every guest resolves to one bucket. It is derived from history, never typed, so it cannot go stale.</div>
    <div class="bkt-list">
      ${Object.keys(BUCKETS).map(k => `<div class="bkt-row">
          <span class="bkt ${BUCKETS[k].tone}">${BUCKETS[k].label}</span>
          <span>${BUCKETS[k].hint}</span>
        </div>`).join('')}
    </div>
  </div>`;
}
function legendHtml() {
  const item = (cls,label) => `<span class="lg-item"><span class="lg-sw ${cls}"></span>${label}</span>`;
  return `<div class="lg-h">Table states</div>
    <div class="lg-grid">
      ${item('', 'Vacant — tap to allocate')}
      ${item('seated','Occupied')}
      ${item('fresh','Just allocated')}
      ${item('paid','Bill paid — ready to turn')}
      ${item('blocked','Not in service')}
      ${item('bill','Running bill')}
    </div>`;
}

function renderView() {
  const onTable = state.view === 'table';
  document.getElementById('seg').style.display = onTable ? '' : 'none';
  document.getElementById('btn-sec').style.display = onTable ? '' : 'none';
  if (!onTable) document.getElementById('callbar').classList.remove('on');
  if (!onTable) { state.secOpen = false; document.getElementById('sec-menu').classList.remove('on'); }
  else renderSecMenu();
  document.querySelector('.top-actions').style.display = onTable ? '' : 'none';
  document.getElementById('fab-edit').style.display = onTable ? '' : 'none';
  const vt = document.getElementById('view-title');
  vt.style.display = onTable ? 'none' : 'block';
  vt.textContent = onTable ? '' : ({order:'Orders', menu:'Menu', settings:'Settings', manager:'Manager', guide:'Design guide'})[state.view] || '';
  const dot = document.getElementById('nav-mgr-dot');
  if (dot) {
    const need = state.view === 'manager' ? 0 : managerQueue().rows.length;
    dot.textContent = need; dot.classList.toggle('on', need > 0);
  }
  const c = document.getElementById('content');
  if (state.view === 'table') {
    c.innerHTML = `<div class="legend ${state.legendOpen?'on':''}" id="legend"></div>
      <div class="searchwrap ${state.searchOpen?'on':''}" id="searchwrap">
        <div class="searchbar">${ic('search')}
          <input id="q" placeholder="Search table number or guest name" value="${state.q}" />
          <button class="x-btn" id="q-clear">${ic('x','sm')}</button>
        </div>
      </div><div class="grid" id="grid"></div>`;
    const lg = document.getElementById('legend');
    lg.innerHTML = legendHtml();
    lg.classList.toggle('on', state.legendOpen);
    renderGrid();
    if (state.searchOpen) document.getElementById('q').focus();
  } else if (state.view === 'manager') {
    c.innerHTML = `<div id="manager-content"></div>`;
    renderManager();
  } else if (state.view === 'settings') {
    c.innerHTML = settingsHtml();
  } else if (state.view === 'guide') {
    c.innerHTML = guideHtml();
  } else {
    const [i,t,s] = STUBS[state.view];
    c.innerHTML = `<div class="stub">${ic(i)}<b>${t}</b><span>${s}</span></div>`;
  }
  icons();
}

/* ══════════════════════════════════════════════════════════════
   EVENTS — one delegated listener
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-close]');
  if (el) { shut(el.dataset.close); return; }

  // filter segment
  const seg = e.target.closest('#seg button');
  if (seg) {
    state.filter = seg.dataset.f;
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b === seg));
    renderGrid(); return;
  }

  // bottom nav
  const cmp = e.target.closest('[data-comp]');
  if (cmp) { openComp(cmp.dataset.comp); return; }
  const cpk = e.target.closest('[data-comp-pick]');
  if (cpk) { sendComp(cpk.dataset.compPick); return; }
  const ch = e.target.closest('[data-chase]');
  if (ch) {
    const t = T(ch.dataset.chase);
    chased[t.id] = clockMin; renderManager();
    toast(`Asked ${t.server} to pick up Table ${t.id}`, 'megaphone',
      () => { delete chased[t.id]; renderManager(); });
    return;
  }
  const tk = e.target.closest('[data-take]');
  if (tk) {
    const [tid, sid] = tk.dataset.take.split('|');
    applyDone(tid, sid); repaint();
    toast(`Table ${tid} — you took it on`, 'check-circle',
      () => { delete doneActions[aKey(tid,sid)]; repaint(); });
    return;
  }
  const mv = e.target.closest('[data-mgr-visit]');
  if (mv) {
    const id = mv.dataset.mgrVisit; mgrVisited[id] = true; renderManager();
    toast(`Table ${id} — you visited`, 'user-check',
      () => { delete mgrVisited[id]; renderManager(); });
    return;
  }
  const dg = e.target.closest('[data-gesture]');
  if (dg) { const [tid,gid,lbl] = dg.dataset.gesture.split('|'); shut('veil-comp'); doGesture(tid,gid,lbl); return; }
  const dm = e.target.closest('[data-do-mgr]');
  if (dm) { const [tid,sid] = dm.dataset.doMgr.split('|'); markDone(tid,sid); return; }
  const nav = e.target.closest('#bnav button');
  if (nav) {
    state.view = nav.dataset.v;
    document.querySelectorAll('#bnav button').forEach(b => b.classList.toggle('on', b === nav));
    renderView(); return;
  }

  const th = e.target.closest('[data-theme]');
  if (th) {
    state.theme = th.dataset.theme;
    document.body.classList.toggle('light', state.theme === 'light');
    renderView(); toast(state.theme === 'light' ? 'Light theme on' : 'Dark theme on', state.theme === 'light' ? 'sun' : 'moon');
    return;
  }
  if (e.target.closest('[data-v-late]')) {
    state.view = 'manager';
    document.querySelectorAll('#bnav button').forEach(b => b.classList.toggle('on', b.dataset.v === 'manager'));
    renderView(); return;
  }
  const ff = e.target.closest('[data-ff]');
  if (ff) { advanceClock(+ff.dataset.ff); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm) { state.rmPhase = +rm.dataset.rm; renderView(); return; }
  const cb = e.target.closest('[data-call]');
  if (cb) {
    const tid = document.getElementById('cs-table').value;
    raiseCall(tid, cb.dataset.call);
    renderView();
    return;
  }
  const ph = e.target.closest('[data-phase]');
  if (ph) {
    state.phase = +ph.dataset.phase;
    syncPhaseChip(); renderView();
    toast(`Phase ${state.phase} — ${PHASE_META[state.phase].name}`, 'zap');
    return;
  }
  if (e.target.closest('#btn-phase')) {
    state.phase = state.phase >= 3 ? 1 : state.phase + 1;
    syncPhaseChip(); renderView();
    toast(`Phase ${state.phase} — ${PHASE_META[state.phase].name}`, 'zap');
    return;
  }
  if (e.target.closest('#btn-sec')) { state.secOpen = !state.secOpen; renderSecMenu(); return; }
  const si = e.target.closest('[data-sec]');
  if (si) { state.section = si.dataset.sec; state.secOpen = false; renderSecMenu(); renderGrid(); return; }
  if (state.secOpen && !e.target.closest('#sec-menu')) { state.secOpen = false; renderSecMenu(); }
  if (e.target.closest('#btn-legend')) { state.legendOpen = !state.legendOpen; renderView(); return; }
  if (e.target.closest('#btn-search'))  { state.searchOpen = !state.searchOpen; renderView(); return; }
  if (e.target.closest('#btn-history')) { toast('Order history — coming from POS', 'history'); return; }
  if (e.target.closest('#fab-edit'))    { toast('Edit floor layout', 'pencil'); return; }
  if (e.target.closest('#q-clear'))     { state.q = ''; state.searchOpen = false; renderView(); return; }

  // table card
  const resB = e.target.closest('[data-resolve]');
  if (resB) { resolveCall(resB.dataset.resolve); return; }
  if (e.target.closest('#toast-undo')) { const f = undoFn; hideToast(); if (f) f(); return; }
  if (e.target.closest('#dm-el-back')) {
    // out to the floor rather than swapping this table for another one
    shut('veil-detail'); state.detailId = null;
    if (state.view !== 'table') { state.view = 'table';
      document.querySelectorAll('#bnav button').forEach(b => b.classList.toggle('on', b.dataset.v === 'table')); }
    renderView(); return;
  }
  const goto = e.target.closest('[data-goto]');
  if (goto) { openDetail(goto.dataset.goto); return; }
  const card = e.target.closest('.tcard');
  if (card) {
    const t = T(card.dataset.id);
    if (!t || t.status === 'blocked') return;
    if (t.status === 'vacant') openAllocate(t.id); else openDetail(t.id);
    return;
  }

  // allocate sheet
  const pax = e.target.closest('[data-pax]');
  if (pax) {
    if (pax.dataset.pax === 'custom') {
      const v = prompt('How many guests?');
      const n = parseInt(v);
      if (n > 0) state.allocPax = n;
    } else state.allocPax = +pax.dataset.pax;
    renderPax(); return;
  }
  if (e.target.closest('#a-confirm')) { confirmAllocate(); return; }
  const rc = e.target.closest('[data-rem]');
  if (rc) { state.remCat = rc.dataset.rem; renderRemCats(); return; }
  if (e.target.closest('#rem-save')) { saveRemember(); return; }

  // detail
  if (e.target.closest('#dm-close')) { shut('veil-detail'); return; }
  const av = e.target.closest('[data-g]');
  if (av) { state.activeGuest = av.dataset.g; renderDetail(); return; }
  const doBtn = e.target.closest('[data-do]');
  if (doBtn) { closeRow(state.detailId, doBtn.dataset.do, 'done'); return; }
  const dropBtn = e.target.closest('[data-drop]');
  if (dropBtn) { closeRow(state.detailId, dropBtn.dataset.drop, 'drop'); return; }
  const undoBtn = e.target.closest('[data-undo]');
  if (undoBtn) { undoRow(state.detailId, undoBtn.dataset.undo); return; }
  if (e.target.closest('#act-more')) { state.allActions = !state.allActions; renderDetail(); return; }
  if (e.target.closest('#remember')) { openRemember(); return; }
  if (e.target.closest('#btn-paybill'))   { openPay(); return; }
  if (e.target.closest('#btn-receipt'))   { toast('Receipt sent to printer', 'printer'); return; }
  if (e.target.closest('#add-order'))     { toast('Opening menu to add items', 'plus'); return; }
  if (e.target.closest('#void-item'))     { toast('Select items to reduce or void', 'minus'); return; }
  if (e.target.closest('#add-guest'))     { toast('Add another guest to this table', 'user-plus'); return; }
  if (e.target.closest('#refresh-order')) { toast('Order refreshed from POS', 'refresh-cw'); return; }
  if (e.target.closest('#btn-closetable')) {
    const t = T(state.detailId);
    // Phase 3 asks for a note first — the moment staff know something we do not
    if (state.phase >= 3) { openClose(t.id); return; }
    closeTable(t.id); return;
  }
  if (e.target.closest('#cl-skip')) { shut('veil-close'); closeTable(state.closeId); return; }
  if (e.target.closest('#cl-save')) { saveCloseNote(); return; }
  const cc = e.target.closest('[data-cl]');
  if (cc) { state.clCat = state.clCat === cc.dataset.cl ? null : cc.dataset.cl; renderClCats(); return; }
  if (e.target.closest('#pay-confirm')) {
    const t = T(state.detailId);
    t.status = 'paid';
    shut('veil-pay'); renderDetail(); renderGrid(); toast(`Table ${t.id} paid`, 'check-circle'); return;
  }

  // click the veil backdrop to dismiss
  if (e.target.id === 'veil-alloc') shut('veil-alloc');
  if (e.target.id === 'veil-pay')   shut('veil-pay');
  if (e.target.id === 'veil-rem')   shut('veil-rem');
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.q = e.target.value; renderGrid(); }
  if (e.target.id === 'a-phone' || e.target.id === 'a-name') onAllocLookup();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  ['veil-pay','veil-detail','veil-alloc'].some(id => {
    const el = document.getElementById(id);
    if (el.classList.contains('on')) { el.classList.remove('on'); return true; }
  });
});

function syncPhaseChip() {
  const b = document.getElementById('btn-phase');
  b.classList.toggle('p3', state.phase >= 3);
  document.getElementById('pc-lbl').textContent = 'Phase ' + state.phase;
}

/* init */
/* The shift did not start when this page loaded. Back-date the actions that
   are already on screen, spread deterministically, so they do not all cross
   the unattended line in the same minute — a floor where every table is late
   tells a waiter nothing. One table is seeded past the line already, so the
   escalated state is visible on arrival. */
(function seedActionAges() {
  const keep = state.phase;
  state.phase = 3;                                  // age every phase's actions
  tables.filter(t => t.status === 'seated' || t.status === 'paid').forEach(t => {
    signalsFor(t).open.forEach((a, j) => {
      actionSeen[aKey(t.id, a.id)] = -((+t.id * 7 + j * 5) % 15);
    });
    tableSeen[t.id] = 0;
  });
  state.phase = keep;
})();
actionSeen['12:recovery'] = -18;
syncPhaseChip(); renderSecMenu(); renderGrid(); icons();
</script>
