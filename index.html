<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pulse — Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --bg:#0b0b0c;
    --card:#17181a;
    --card-2:#1d1e21;
    --line:#2a2c30;
    --line-soft:#232529;
    --ink:#f4f2ee;
    --ink-2:#a9aab0;
    --ink-3:#6e7076;

    /* gold — the product's primary accent */
    --gold:#d9b45f;
    --gold-soft:#e8cf94;
    --gold-line:#8d7434;
    --gold-ink:#221a08;
    --gold-grad:linear-gradient(180deg,#e0be6c 0%,#c39a3d 100%);

    /* bill pill (unpaid) */
    --bill-bg:#3a3125;
    --bill-ink:#e6d6b0;

    /* paid */
    --green:#3f9f6b;
    --green-line:#2f7a51;
    --green-bg:#16241c;
    --green-pill:#2f6f4c;
    --green-ink:#dff3e6;

    --teal:#22b8a6;
    --purple:#7d5cf6;
    --red:#d8483f;

    --r-card:14px;
    --r-btn:12px;
    --nav-h:74px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  /* Lucide replaces <i data-lucide> with <svg class="lucide … xs">, so every
     size rule has to target the svg — targeting the <i> silently does nothing
     and leaves every icon at Lucide's 24px default. */
  i[data-lucide],svg.lucide{width:16px;height:16px;display:inline-flex;flex-shrink:0;vertical-align:middle}
  i.xs[data-lucide],svg.lucide.xs{width:13px;height:13px}
  i.sm[data-lucide],svg.lucide.sm{width:14px;height:14px}
  i.lg[data-lucide],svg.lucide.lg{width:20px;height:20px}
  i.xl[data-lucide],svg.lucide.xl{width:24px;height:24px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2e3034;border-radius:4px}

  /* ─────────── shell ─────────── */
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:14px 18px;position:relative;
  }
  .tb-side{flex:1 1 0;min-width:0;display:flex;align-items:center}
  .tb-side.right{flex:0 0 auto;justify-content:flex-end}
  .seg{
    flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;
    display:inline-flex;align-items:center;gap:2px;
    background:#151618;border:1px solid var(--line-soft);
    border-radius:999px;padding:5px;
  }
  .seg button{
    padding:0 24px;min-height:40px;display:inline-flex;align-items:center;gap:7px;
    border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);
    transition:background .16s,color .16s;
  }
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:0 0 auto;white-space:nowrap}
  .seg button.on{background:#efece3;color:#1a1a1a;font-weight:700}
  .view-title{font-size:17px;font-weight:800;display:none;white-space:nowrap}
  .sec-btn{
    display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;
    border-radius:999px;background:#151618;border:1px solid var(--line-soft);
    font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;transition:all .16s;
  }
  .sec-btn:hover{color:var(--ink);border-color:#3a3d42}
  .sec-btn.filtered{color:var(--gold-soft);border-color:var(--gold-line);background:rgba(217,180,95,.1)}
  .sec-menu{
    display:none;position:absolute;top:60px;left:18px;z-index:40;min-width:184px;
    background:#1b1c1f;border:1px solid var(--line);border-radius:12px;padding:6px;
    box-shadow:0 18px 44px -14px rgba(0,0,0,.75);
  }
  .sec-menu.on{display:block}
  .sec-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);
  }
  .sec-item:hover{background:#232529;color:var(--ink)}
  .sec-item.on{color:var(--gold-soft)}
  .sec-item .n{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .top-actions{display:flex;gap:10px;flex:0 0 auto}
  .top-btn{
    width:44px;height:44px;border-radius:50%;
    background:#151618;border:1px solid var(--line-soft);
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
    transition:border-color .16s,background .16s;
  }
  .top-btn:hover{border-color:var(--line);background:#1b1c1f}
  .phase-chip{
    display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 15px;
    border-radius:999px;background:#151618;border:1px solid var(--line-soft);
    font-size:13px;font-weight:700;color:var(--ink-2);transition:all .16s;
  }
  .phase-chip:hover{border-color:var(--gold-line);color:var(--ink)}
  .phase-chip .pc-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
  .phase-chip.p3{border-color:var(--gold-line);color:var(--gold-soft);background:rgba(217,180,95,.1)}
  .phase-chip.p3 .pc-dot{background:var(--gold);box-shadow:0 0 8px rgba(217,180,95,.6)}

  /* ─────────── table legend ─────────── */
  .legend{
    display:none;max-width:1420px;margin:0 auto 16px;
    background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px;
  }
  .legend.on{display:block}
  .lg-h{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:11px}
  .lg-grid{display:flex;flex-wrap:wrap;gap:10px 22px}
  .lg-item{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#b4b2ac;font-weight:600}
  .lg-sw{width:26px;height:20px;border-radius:5px;border:1.5px solid var(--line-soft);background:#131416;flex:0 0 auto}
  .lg-sw.seated{border-color:#e6e2d6}
  .lg-sw.fresh{border-color:var(--gold)}
  .lg-sw.paid{border-color:var(--green-line);background:repeating-linear-gradient(-45deg,transparent 0 5px,rgba(63,159,107,.14) 5px 10px),#14201a}
  .lg-sw.blocked{border-color:#1e2023;background:repeating-linear-gradient(-45deg,transparent 0 5px,rgba(255,255,255,.03) 5px 10px),#121316}
  .lg-sw.bill{background:var(--bill-bg);border-color:transparent}

  .content{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 18px 22px}

  /* ─────────── who needs you, in one row ───────────
     Everything waiting on staff lives here as a capsule: the table number,
     how long it has waited, and what kind of thing it is. One row, never a
     vertical list to scroll past, because a request that scrolls out of
     sight is a request nobody answers. */
  .needbar{
    flex:0 0 auto;display:none;flex-wrap:wrap;align-items:stretch;gap:8px;
    margin:0 18px 12px;
    animation:barIn .28s cubic-bezier(.2,.7,.2,1) both;
  }
  .needbar.on{display:flex}
  @keyframes barIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .nb-grp{
    display:flex;align-items:center;gap:11px;padding:10px 14px;flex:0 1 auto;min-width:0;
    background:#141517;border:1px solid var(--line-soft);border-radius:14px;
  }
  .nb-grp .nb-caps{overflow-x:auto;overflow-y:hidden;min-width:0}
  .nb-lbl{
    display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;white-space:nowrap;
    font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  }
  .nb-grp.guests .nb-lbl{color:#e8a099}
  .nb-grp.late   .nb-lbl{color:#d69a45}
  .nb-grp.opening .nb-lbl{color:#8fd6c9}
  .nb-caps{display:flex;align-items:center;gap:8px;flex:0 1 auto}

  /* a capsule: tap the body to go to the table, tick to clear it */
  .cap{
    display:inline-flex;align-items:center;gap:0;flex:0 0 auto;
    border-radius:999px;border:1px solid var(--line);background:#1b1c1f;overflow:hidden;
  }
  .cap-go{
    display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 12px;
    font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap;
  }
  .cap-go b{font-variant-numeric:tabular-nums;font-weight:800}
  .cap-go i{font-style:normal;font-weight:700;font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
  .cap-ic{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto}
  .cap-x{
    flex:0 0 auto;width:40px;min-height:40px;display:grid;place-items:center;
    border-left:1px solid var(--line);color:var(--ink-2);
  }
  .cap-x:hover{background:rgba(255,255,255,.07);color:var(--ink)}
  .cap-go:hover{background:rgba(255,255,255,.05)}

  /* three kinds of request, three weights — red only where a guest is unhappy */
  /* the capsule takes its weight from the most urgent request on it; each
     icon inside keeps the colour of its own kind */
  .cap.grave{border-color:#7a352d;background:rgba(216,72,63,.16)}
  .cap.grave .cap-go{color:#ffb3a8}
  .cap.grave .cap-x{border-left-color:#7a352d;color:#e8a099}
  .cap.ask{border-color:#4c3f8a;background:rgba(125,92,246,.15)}
  .cap.ask .cap-go{color:#c4b6ff}
  .cap.ask .cap-x{border-left-color:#4c3f8a;color:#b3a2ff}
  .cap.attend{border-color:var(--gold-line);background:rgba(217,180,95,.13)}
  .cap.attend .cap-go{color:var(--gold-soft)}
  .cap.attend .cap-x{border-left-color:var(--gold-line);color:var(--gold-soft)}
  .cap.fetch{border-color:#1f5c56;background:rgba(34,184,166,.12)}
  .cap.fetch .cap-go{color:#7fe0d5}
  .cap.fetch .cap-x{border-left-color:#1f5c56;color:#5fd0c4}
  .ci{display:inline-flex;font-style:normal}
  .ci-concern{color:#ff9a8e}
  .ci-query  {color:#b3a2ff}
  .ci-waiter {color:var(--gold)}
  .ci-water  {color:#4fd3c4}
  .ci-cutlery{color:#dcc39a}
  .ci.more{font-size:11px;font-weight:800;color:var(--ink-2);align-self:center}
  /* a table that has just sat down is an opportunity, not an alarm — calm,
     but present, because the window closes on its own */
  .cap.opening{border-color:#2f5a54;background:rgba(34,184,166,.08)}
  .cap.opening .cap-go{color:#a8e0d8}
  .ci-opening{color:#5fd0c4}
  .cap.opening.more{min-height:40px;padding:0 13px;font-size:12px;font-weight:800;color:#8fd6c9;display:inline-flex;align-items:center}
  .cap.late{border-color:#6d4f24;background:rgba(214,154,69,.13)}
  .cap.late .cap-go,.cap.late .cap-ic{color:#e8bd7d}
  .cap.late.more{min-height:40px;padding:0 13px;font-size:12px;font-weight:800;color:#e8bd7d}
  .cap.late.more:hover{background:rgba(214,154,69,.22)}
  /* waited long enough that it should catch the eye from across the room */
  .cap.hot{animation:capThrob 1.6s ease-in-out infinite}
  @keyframes capThrob{0%,100%{box-shadow:0 0 0 0 rgba(216,72,63,.5)}50%{box-shadow:0 0 0 5px rgba(216,72,63,0)}}
  .cap-blind{font-style:normal;font-weight:700;font-size:11.5px;opacity:.8}
  /* a concern is the manager's call — the floor is told, not tasked */
  .cap-mgr{display:inline-flex;align-items:center;margin-left:5px;color:var(--gold)}

  body.light .nb-grp{background:#fffdf8;border-color:var(--line-soft)}
  body.light .cap{background:#fff}
  body.light .cap.grave{background:rgba(184,54,46,.09);border-color:#e0b3ae}
  body.light .cap.grave .cap-go,body.light .cap.grave .cap-ic{color:#9c3a2f}
  body.light .cap.attend{background:rgba(217,180,95,.14)}
  body.light .cap.late{background:rgba(214,154,69,.14)}
  body.light .cap.opening{background:rgba(34,184,166,.1);border-color:#9dd6cf}
  body.light .cap.opening .cap-go{color:#12655c}

  /* ─────────── table grid ─────────── */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));
    gap:22px;max-width:1420px;margin:0 auto;
  }
  .tcard{
    position:relative;overflow:hidden;
    background:var(--card);
    border:1.5px solid var(--line-soft);
    border-radius:var(--r-card);
    padding:14px 15px 15px;
    min-height:152px;
    display:flex;flex-direction:column;
    cursor:pointer;
    transition:transform .16s,border-color .16s,box-shadow .16s;
  }
  .tcard:active{transform:scale(.985)}

  /* vacant — just the table number, centred */
  .tcard.vacant{
    align-items:center;justify-content:center;
    background:#131416;border-color:#212327;
  }
  .tcard.vacant .tc-vac{font-size:25px;font-weight:700;color:#e9e7e1}
  .tcard.vacant:hover{border-color:var(--gold-line)}

  /* blocked / unavailable */
  .tcard.blocked{
    align-items:center;justify-content:center;
    background:
      repeating-linear-gradient(-45deg,transparent 0 9px,rgba(255,255,255,.022) 9px 18px),
      #121316;
    border-color:#1e2023;cursor:not-allowed;
  }
  .tcard.blocked .tc-vac{font-size:25px;font-weight:700;color:#4a4c51}

  /* occupied */
  .tcard.seated{border-color:#e6e2d6}
  .tcard.paid{
    border-color:var(--green-line);
    background:
      repeating-linear-gradient(-45deg,transparent 0 9px,rgba(63,159,107,.10) 9px 18px),
      #14201a;
  }

  .tc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .tc-id{font-size:13px;font-weight:600;color:var(--ink-2)}
  .tc-doc{color:var(--gold);opacity:.9;display:inline-flex}
  .tc-doc svg{width:19px;height:19px}
  .tcard.paid .tc-doc{color:var(--green)}
  /* the guest's name is their identity — let a long one take two lines
     rather than cutting it off mid-word */
  .tc-name{
    font-size:23px;font-weight:800;letter-spacing:-.01em;line-height:1.12;
    color:#f2efe7;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  /* a long name steps down a size instead of losing its last word */
  .tc-name.long{font-size:18px;line-height:1.18}
  .tc-name .others{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0}
  .tc-meta{display:flex;align-items:center;gap:14px;margin-top:7px;font-size:13px;color:#cfcdc6;font-weight:500}
  .tc-meta svg{width:15px;height:15px}
  .tc-meta span{display:inline-flex;align-items:center;gap:5px}
  .tc-meta svg{color:var(--ink-2)}
  /* one indicator, one line — the card must still be readable in a glance */
  .tc-right{display:inline-flex;align-items:center;gap:7px}
  .tc-count{
    min-width:20px;height:20px;padding:0 6px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
    background:var(--gold);color:var(--gold-ink);
  }
  .tc-count.red{background:var(--red);color:#fff}
  .tc-count.amber{background:#d69a45;color:#241d0c}
  /* nobody has closed anything here for a while — a ring around whatever
     severity the table already had, never a repaint of it */
  .tc-count.late{box-shadow:0 0 0 3px rgba(214,154,69,.45)}
  .tc-count.late:not(.red):not(.amber){background:#d69a45;color:#241d0c}
  /* something appeared since the waiter last looked at this table */
  .tc-count.fresh{outline:2px solid var(--gold-soft);outline-offset:2px}
  .tc-act.late{color:#e8bd7d}
  .tc-late,.tc-new{
    flex:0 0 auto;margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.04em;
    border-radius:5px;padding:2px 6px;text-transform:uppercase;
  }
  .tc-late{background:rgba(214,154,69,.2);color:#e8bd7d}
  .tc-new{background:rgba(217,180,95,.18);color:var(--gold-soft)}
  .tc-act{
    display:flex;align-items:flex-start;gap:6px;margin-top:9px;
    font-size:11.5px;font-weight:700;min-width:0;
  }
  .tc-act > svg{margin-top:2px}
  .tc-act > span:first-of-type{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;line-height:1.32;
  }
  .tc-call span{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;line-height:1.32;
  }
  .tc-act svg{width:13px;height:13px}
  .tc-act.red{color:#e8a099}
  .tc-act.amber{color:#dcae6e}
  .tc-act.gold{color:var(--ink-2)}

  /* a guest calling is the one thing that must be unmistakable */
  /* the request chip on a card wears the colour of the kind of request it is,
     and only a concern is urgent enough to pulse */
  .tc-call{
    display:flex;align-items:flex-start;gap:6px;margin-top:8px;
    border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:800;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink-2);
  }
  .tc-call.k-grave{background:rgba(216,72,63,.16);border-color:#6b332c;color:#f0b3ab;
    animation:callPulse 1.8s ease-in-out infinite}
  .tc-call.k-ask{background:rgba(125,92,246,.14);border-color:#4c3f8a;color:#c4b6ff}
  .tc-call.k-attend{background:rgba(217,180,95,.13);border-color:var(--gold-line);color:var(--gold-soft)}
  .tc-call.k-fetch{background:rgba(34,184,166,.12);border-color:#1f5c56;color:#7fe0d5}
  .tc-call svg{width:13px;height:13px;margin-top:1px;flex:0 0 auto}
  .tc-call b{flex:0 0 auto;display:inline-flex;color:var(--gold);margin-left:1px}
  .tc-call u{text-decoration:none;font-weight:800;opacity:.65;flex:0 0 auto;margin-left:auto;font-variant-numeric:tabular-nums}
  .tc-call .ci{flex:0 0 auto}
  @keyframes callPulse{0%,100%{box-shadow:0 0 0 0 rgba(216,72,63,.45)}50%{box-shadow:0 0 0 6px rgba(216,72,63,0)}}
  .seg button .cnt{
    display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
    padding:0 5px;border-radius:10px;background:var(--red);color:#fff;
    font-size:10.5px;font-weight:800;margin-left:7px;vertical-align:middle;
  }
  .seg button.on .cnt{background:#1f1f1f;color:#efece3}

  .tc-bill{
    margin-top:auto;background:var(--bill-bg);color:var(--bill-ink);
    border-radius:9px;padding:10px 13px;font-size:14px;font-weight:700;
  }
  .tcard.paid .tc-bill{background:var(--green-pill);color:var(--green-ink)}
  .tc-bill.solo{justify-content:center}

  /* floating edit affordance, as in the app */
  .fab-edit{
    position:fixed;right:6px;top:50%;transform:translateY(-50%);
    width:26px;height:52px;border-radius:9px 0 0 9px;
    background:#1b1c1f;border:1px solid var(--line-soft);border-right:none;
    display:flex;align-items:center;justify-content:center;color:var(--ink-2);z-index:20;
  }

  /* ─────────── bottom nav ─────────── */
  .bnav{
    flex:0 0 auto;height:var(--nav-h);
    background:#0e0f10;border-top:1px solid #1c1d20;
    display:flex;align-items:stretch;
  }
  .bnav button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    color:var(--ink-3);font-size:12px;font-weight:600;position:relative;
  }
  .bnav button svg{width:21px;height:21px}
  .bnav button.on{color:var(--gold)}
  .nav-dot{
    position:absolute;top:12px;left:50%;margin-left:11px;
    min-width:17px;height:17px;padding:0 5px;border-radius:999px;
    background:var(--red);color:#fff;font-size:10.5px;font-weight:800;
    display:none;align-items:center;justify-content:center;
  }
  .nav-dot.on{display:inline-flex}
  .bnav button.on::before{
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:52px;height:2px;background:var(--gold);border-radius:0 0 2px 2px;
  }

  /* placeholder views for the other tabs */
  .stub{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;color:var(--ink-3);padding:60px 20px;text-align:center;
  }
  .stub svg{width:34px;height:34px}
  .stub b{color:var(--ink-2);font-size:15px;font-weight:700}

  /* ─────────── manager ─────────── */
  .mg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
  .mg-h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
  .mg-sub{font-size:13px;color:var(--ink-2);margin-top:3px}
  .mg-stats{display:flex;gap:10px}
  .mg-stat{
    min-width:88px;background:var(--card);border:1px solid var(--line-soft);border-radius:12px;
    padding:10px 14px;text-align:center;
  }
  .mg-stat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .mg-stat span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .mg-stat.red b{color:var(--red)}
  /* a note, not an alarm — it tells the waiter the floor is still moving
     without competing with the table they are actually working */
  .dm-elsewhere{
    display:none;position:absolute;top:13px;left:50%;transform:translateX(-50%);z-index:3;
    max-width:min(92vw,520px);
  }
  .dm-elsewhere.on{display:block}
  .dm-el{
    display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px 0 14px;
    border-radius:999px;background:rgba(20,21,23,.92);border:1px solid #4a2b27;
    backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.4);
    color:#c9a29c;font-size:12.5px;font-weight:700;white-space:nowrap;
  }
  .dm-el:hover{border-color:#7a352d;color:#f0b3ab;background:rgba(38,22,20,.95)}
  .dm-el-l{font-weight:800}
  .dm-el-n{display:inline-flex;align-items:center;gap:6px}
  .dm-el-n em{
    font-style:normal;display:inline-flex;align-items:baseline;gap:3px;
    padding:2px 7px;border-radius:99px;background:rgba(240,179,171,.12);
    color:#e8a099;font-weight:800;font-variant-numeric:tabular-nums;
  }
  .dm-el-n em i{font-style:normal;font-size:10.5px;opacity:.7}
  .dm-el-n em.hot{background:rgba(216,72,63,.28);color:#ffb3a8}
  .dm-el-n em.more{background:none;color:var(--ink-3)}
  body.light .dm-el{background:rgba(255,252,250,.96);border-color:#e0b3ae;color:#a1665f}
  body.light .dm-el:hover{color:#9c3a2f}
  body.light .dm-el-n em{background:rgba(184,54,46,.1);color:#9c3a2f}

  /* ─────────── manager ───────────
     A list, not a wall of cards. A manager reads this standing between
     tables, so each table is one dense row: who, why, and the decisions. */
  .mg-sh{
    display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;
    letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 6px;
  }
  .mg-sh:first-child{margin-top:0}
  .mg-sh.urgent{color:var(--red)}
  .mg-sh b{margin-left:auto;font-size:10.5px;color:var(--ink-2);background:var(--line-soft);
    border-radius:99px;padding:2px 8px;font-weight:800;letter-spacing:0}
  .mg-rule{font-size:12px;color:var(--ink-3);line-height:1.5;margin:0 0 10px;max-width:78ch}

  .mg-row{
    display:grid;grid-template-columns:66px minmax(0,1fr) max-content;align-items:center;
    gap:14px;padding:9px 12px 9px 0;margin-bottom:7px;min-height:62px;
    background:var(--card);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;
  }
  .mg-row.red{border-color:#6b332c;background:linear-gradient(90deg,rgba(216,72,63,.09),transparent 40%),var(--card)}
  .mg-row.amber{border-color:#5c4520}
  .mg-t{
    align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    background:rgba(255,255,255,.03);border-right:1px solid var(--line-soft);
  }
  .mg-num{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .mg-sec{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
  .mg-row.red .mg-num{color:#f0b3ab}
  .mg-b{min-width:0}
  .mg-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .mg-name{font-size:14.5px;font-weight:800}
  .mg-when{margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .mg-why{display:flex;flex-direction:column;gap:2px;margin-top:3px}
  .mg-why span{
    display:flex;align-items:center;gap:6px;font-size:12.5px;color:#b4b2ac;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .mg-why svg{color:var(--ink-3);flex:0 0 auto}

  /* decisions run across, not down — the row was mostly empty when they stacked */
  .mg-act{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;justify-content:flex-end}
  .mg-btn{
    min-height:36px;padding:0 13px;border-radius:9px;background:var(--gold-grad);color:var(--gold-ink);
    font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .mg-btn svg{flex:0 0 auto}
  .mg-btn:hover{filter:brightness(1.06)}
  .mg-btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .mg-btn.ghost:hover{background:rgba(255,255,255,.05)}
  /* the manual lever: an icon, always there, never competing for the words */
  .mg-house{
    min-height:36px;padding:0 12px;border-radius:9px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:1px dashed var(--gold-line);color:var(--gold-soft);
    font-size:12px;font-weight:800;
  }
  .mg-house:hover{background:rgba(217,180,95,.12);border-style:solid}
  .mg-house.nudge{border-style:solid;background:rgba(217,180,95,.08)}
  .mg-house b{display:grid;place-items:center;min-width:16px;height:16px;border-radius:99px;
    background:var(--gold);color:var(--gold-ink);font-size:10px;font-weight:800}
  .mg-sent{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#8fe0b0}

  .mg-rest{
    display:flex;align-items:center;gap:7px;padding:10px 14px;margin-bottom:7px;
    font-size:12.5px;font-weight:700;color:#e8bd7d;
    background:rgba(214,154,69,.09);border:1px dashed #6d4f24;border-radius:12px;
  }
  .mg-empty{
    display:flex;align-items:center;gap:9px;padding:13px 15px;font-size:12.5px;color:var(--ink-3);
    background:var(--card);border:1px dashed var(--line-soft);border-radius:12px;
  }
  .mg-empty svg{color:#5fae82}

  .mg-quiet{display:flex;flex-wrap:wrap;gap:8px}
  .mg-q{display:flex;align-items:center;gap:9px;min-height:40px;padding:0 12px 0 7px;text-align:left;
    background:var(--card);border:1px solid var(--line-soft);border-radius:11px;color:var(--ink-2);
    font-size:12.5px;transition:border-color .16s,color .16s}
  .mg-q>span{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;
    background:var(--line-soft);color:var(--ink);font-weight:800;font-size:11.5px;font-variant-numeric:tabular-nums}
  .mg-q>em{min-width:0;font-style:normal;font-weight:700;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mg-q>i{flex:0 0 auto;font-style:normal;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .mg-q:hover{border-color:var(--gold-line);color:var(--ink)}

  .cp-sug{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin-bottom:7px;
    padding:11px 13px;border-radius:11px;background:rgba(217,180,95,.09);
    border:1px solid var(--gold-line);color:var(--ink);
  }
  .cp-sug:hover{background:rgba(217,180,95,.18)}
  .cp-sug > svg:first-child{color:var(--gold);flex:0 0 auto}
  .cp-sug > svg:last-child{margin-left:auto;color:var(--gold-soft);flex:0 0 auto}
  .cp-sug span{min-width:0;display:flex;flex-direction:column;gap:2px}
  .cp-sug b{font-size:13px;font-weight:800}
  .cp-sug i{font-style:normal;font-size:11.5px;color:var(--ink-3);line-height:1.4}
  .cp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
  .cp-opt{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    min-height:88px;padding:12px 8px;border-radius:12px;text-align:center;
    background:var(--card);border:1px solid var(--line-soft);color:var(--ink);
    font-size:12px;font-weight:700;line-height:1.3;
  }
  .cp-opt svg{color:var(--gold)}
  .cp-opt:hover{border-color:var(--gold-line);background:rgba(217,180,95,.08)}
  @media (max-width:520px){ .cp-grid{grid-template-columns:repeat(2,1fr)} }

  body.light .mg-row,body.light .mg-stat,body.light .mg-empty,
  body.light .mg-q,body.light .cp-opt{background:#fff}
  body.light .mg-t{background:rgba(0,0,0,.02)}
  body.light .mg-why span{color:#4f4b44}
  body.light .mg-btn.ghost:hover{background:rgba(0,0,0,.04)}
  @media (max-width:900px){
    .mg-row{grid-template-columns:66px minmax(0,1fr);row-gap:8px;padding-bottom:11px}
    .mg-act{grid-column:2;justify-content:flex-start;flex-wrap:wrap}
  }

  /* ─────────── design guide ───────────
     Its own screen, because a prototype that explains itself is worth more
     than one that has to be explained. */
  .gd{max-width:1120px}
  .gd-lede{margin:2px 0 26px}
  .gd-lede h2{font-size:27px;font-weight:800;letter-spacing:-.015em;margin-bottom:8px}
  .gd-lede p{font-size:14px;color:var(--ink-2);line-height:1.6;max-width:70ch}

  .gd-rows{display:flex;flex-direction:column;gap:9px}
  .gd-row{
    display:grid;grid-template-columns:180px minmax(0,1.15fr) minmax(0,1fr);
    gap:18px;align-items:center;
    background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:13px 16px;
  }
  .gd-a{display:flex;align-items:center;gap:8px;min-width:0}
  .gd-b{min-width:0;display:flex;flex-direction:column;gap:3px}
  .gd-b b{font-size:14px;font-weight:800}
  .gd-b i{font-style:normal;font-size:12.5px;color:var(--ink-2);line-height:1.45}
  .gd-b em{font-style:normal;font-size:12px;color:var(--ink-3);line-height:1.45}
  .gd-c{font-size:12px;color:var(--ink-3);line-height:1.5;min-width:0}
  .gd-sla{display:flex;align-items:center;gap:5px;margin-top:5px;font-style:normal;
    font-size:11px;font-weight:800;color:#e8bd7d}
  .gd-tick{
    width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    border:2px solid var(--line);color:var(--ink-3);
  }
  .gd-tick.done{background:var(--green);border-color:var(--green);color:#0d1a12}
  .gd-tick.drop{border-style:dashed}

  .gd-anat{display:grid;grid-template-columns:236px minmax(0,1fr);gap:26px;align-items:start}
  .gd-demo{pointer-events:none}
  .gd-demo .tcard{cursor:default}
  .gd-notes{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:9px}
  .gd-notes li{font-size:13px;color:var(--ink-2);line-height:1.55}
  .gd-notes b{color:var(--ink);font-weight:800}
  .gd-notes em{font-style:italic;color:var(--ink)}

  .gd-states{display:flex;flex-wrap:wrap;gap:10px}
  .gd-state{
    display:flex;align-items:center;gap:10px;flex:1 1 190px;
    background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;
  }
  .gd-state b{font-size:13.5px;font-weight:800}
  .gd-state i{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:auto;text-align:right}

  .gd-screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:12px}
  .gd-screen{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:15px 16px}
  .gd-sh{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800}
  .gd-sh svg{color:var(--gold)}
  .gd-who{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--gold-soft);margin:7px 0 8px}
  .gd-screen p{font-size:12.5px;color:var(--ink-2);line-height:1.55}
  .gd-screen ul{margin:10px 0 0;padding-left:17px;display:flex;flex-direction:column;gap:5px}
  .gd-screen li{font-size:12px;color:var(--ink-3);line-height:1.5}

  .gd-sws{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:10px}
  .gd-sw{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border:1px solid var(--line-soft);border-radius:11px;padding:10px 13px;
  }
  .gd-chip{width:30px;height:30px;border-radius:8px;flex:0 0 auto;border:1px solid rgba(255,255,255,.14)}
  .gd-sw b{font-size:12.5px;font-weight:800;min-width:0}
  .gd-sw i{font-style:normal;margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  .gd-ph{margin-bottom:14px;background:var(--card);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
  .gd-phh{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
  .gd-phh svg{color:var(--gold)}
  .gd-phh b{font-size:14.5px;font-weight:800}
  .gd-phh span{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:700}
  .gd-tbl{width:100%;border-collapse:collapse}
  .gd-tbl th{
    text-align:left;padding:9px 16px;font-size:10.5px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line-soft);
  }
  .gd-tbl td{padding:10px 16px;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line-soft);vertical-align:top}
  .gd-tbl tr:last-child td{border-bottom:none}
  .gd-tbl td b{color:var(--ink);font-weight:700}
  .gd-lv{
    display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    border-radius:5px;padding:2px 7px;white-space:nowrap;
  }
  .lv-red   .gd-lv{background:rgba(216,72,63,.18);color:#f0b3ab}
  .lv-amber .gd-lv{background:rgba(214,154,69,.18);color:#e8bd7d}
  .lv-gold  .gd-lv{background:rgba(217,180,95,.14);color:var(--gold-soft)}
  .gd-slac{white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums;color:#e8bd7d}
  .lv-gold .gd-slac{color:var(--ink-3);font-weight:700}
  body.light .gd-ph{background:#fff}
  @media (max-width:900px){ .gd-tbl th:nth-child(3),.gd-tbl td:nth-child(3){display:none} }

  .gd-rules{display:flex;flex-direction:column;gap:9px}
  .gd-rule{
    display:flex;gap:14px;align-items:flex-start;
    background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px;
  }
  .gd-rule > span{
    flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:rgba(217,180,95,.14);border:1px solid var(--gold-line);color:var(--gold-soft);
    font-size:12.5px;font-weight:800;
  }
  .gd-rule b{display:block;font-size:14px;font-weight:800;margin-bottom:4px}
  .gd-rule p{font-size:12.5px;color:var(--ink-2);line-height:1.6}

  body.light .gd-row,body.light .gd-state,body.light .gd-screen,
  body.light .gd-sw,body.light .gd-rule{background:#fff}

  @media (max-width:1000px){
    .gd-row{grid-template-columns:150px minmax(0,1fr)}
    .gd-c{grid-column:1 / -1;padding-top:2px}
    .gd-anat{grid-template-columns:1fr}
  }

  /* ─────────── settings ─────────── */
  .setwrap{max-width:820px;margin:0 auto;padding:10px 0 30px}
  .set-h{font-size:17px;font-weight:800;margin-bottom:5px}
  .set-sub{font-size:13px;color:var(--ink-2);line-height:1.55;margin-bottom:14px;max-width:620px}
  .ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:1180px){ .ph-grid{grid-template-columns:1fr 1fr} }
  @media (max-width:640px){ .ph-grid{grid-template-columns:1fr} }
  .ph-card{
    display:flex;flex-direction:column;gap:8px;text-align:left;
    background:var(--card);border:1.5px solid var(--line-soft);border-radius:var(--r-card);
    padding:16px;transition:border-color .16s,background .16s;
  }
  .ph-card:hover{border-color:#3a3d42}
  .ph-card.on{border-color:var(--gold);background:#1b1913}
  .ph-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ph-top b{font-size:15px;font-weight:800}
  .ph-body{font-size:13px;color:#b4b2ac;line-height:1.55}
  .ph-n{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .ph-card.on .ph-n{color:var(--gold-soft)}
  .theme-row{display:flex;gap:10px}
  .theme-opt{
    display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;
    background:var(--card);border:1.5px solid var(--line-soft);border-radius:11px;
    padding:12px 20px;color:var(--ink-2);transition:all .15s;
  }
  .theme-opt:hover{color:var(--ink);border-color:#3a3d42}
  .theme-opt.on{border-color:var(--gold);color:var(--gold-soft);background:rgba(217,180,95,.1)}
  body.light .theme-opt{background:#fff}
  body.light .theme-opt.on{background:#fdf6e6}
  .rm-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .rm-tab{
    display:inline-flex;align-items:center;gap:7px;min-height:40px;font-size:12.5px;font-weight:700;
    background:var(--card);border:1px solid var(--line-soft);border-radius:999px;
    padding:0 15px;color:var(--ink-2);transition:all .14s;
  }
  .rm-tab:hover{color:var(--ink);border-color:#3a3d42}
  .rm-tab.on{background:#efece3;color:#1a1a1a;border-color:#efece3}
  .rm-tab .rm-n{
    font-size:10.5px;font-weight:800;background:#2a2c30;color:var(--ink-2);
    border-radius:8px;padding:1px 6px;
  }
  .rm-tab.on .rm-n{background:rgba(0,0,0,.14);color:#1a1a1a}
  .rm-list{display:flex;flex-direction:column;gap:7px}
  .rm-row{
    display:flex;align-items:flex-start;gap:11px;
    background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;
  }
  .rm-row.built{border-color:#25402f;background:#151d18}
  .rm-tick{flex:0 0 auto;margin-top:2px;color:var(--ink-3)}
  .rm-row.built .rm-tick{color:#5fae82}
  .rm-b{flex:1;min-width:0}
  .rm-n2{display:block;font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.35}
  .rm-note{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;font-style:italic}
  .rm-ui{display:flex;align-items:flex-start;gap:5px;font-size:11.5px;color:var(--gold-soft);margin-top:4px;line-height:1.4}
  .rm-ui svg{margin-top:2px;flex:0 0 auto}
  .rm-pill{
    font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    border-radius:4px;padding:2px 5px;vertical-align:middle;margin-left:4px;
    background:#2a2c30;color:var(--ink-2);
  }
  .rm-pill.hero{background:var(--gold);color:var(--gold-ink)}
  body.light .rm-pill{background:#efece4;color:#6a655c}
  .rm-meta{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .rm-own{font-size:11px;font-weight:700;color:var(--ink-3);white-space:nowrap}
  .rm-tag{
    font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:var(--gold-soft);background:rgba(217,180,95,.11);border:1px solid var(--gold-line);
    border-radius:5px;padding:2px 6px;white-space:nowrap;
  }
  @media (max-width:640px){
    .rm-row{flex-wrap:wrap}
    .rm-meta{flex-direction:row;align-items:center;width:100%;margin-top:4px}
  }
  .call-sim{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:15px}
  .cs-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .cs-btns{display:flex;flex-wrap:wrap;gap:9px}
  .cs-btns .pax{height:40px;width:auto;flex:0 0 auto}
  .cs-live{
    display:flex;align-items:center;gap:8px;margin-top:13px;font-size:12.5px;font-weight:700;
    color:#f0b3ab;background:rgba(216,72,63,.13);border:1px solid #6b332c;border-radius:9px;padding:9px 12px;
  }
  .bkt-list{display:flex;flex-direction:column;gap:9px}
  .bkt-row{
    display:flex;align-items:center;gap:12px;font-size:13px;color:#b4b2ac;
    background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;
  }
  .bkt-row .bkt{flex:0 0 92px;justify-content:center}
  @media (max-width:760px){ .ph-grid{grid-template-columns:1fr} }

  /* ─────────── sheets & modals ─────────── */
  .veil{
    position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);
    z-index:60;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .veil.on{display:flex}
  .veil.bottom{align-items:flex-end;justify-content:center;padding:0}

  .sheet{
    width:100%;max-width:420px;background:#191a1d;
    border:1px solid var(--line-soft);border-radius:20px;
    max-height:92vh;overflow:auto;
    animation:sheetIn .24s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .grabber{width:40px;height:4px;border-radius:3px;background:#3a3c41;margin:12px auto 4px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px}
  .sheet-title{font-size:19px;font-weight:800;color:var(--gold)}
  .x-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .x-btn:hover{background:#222427;color:var(--ink)}
  .sheet-body{padding:12px 20px 20px}

  .sec-lbl{font-size:16px;font-weight:800;margin:14px 0 10px}
  .fld-lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .pax-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .pax{
    height:44px;border-radius:10px;background:#202226;border:1.5px solid #2b2d32;
    font-size:15px;font-weight:700;color:var(--ink);transition:all .14s;
  }
  .pax:hover{border-color:#3d4046}
  .pax.on{border-color:var(--gold);background:rgba(217,180,95,.13);color:var(--gold-soft)}
  .pax.wide{grid-column:1/-1;height:44px;font-size:14px;font-weight:600;color:var(--ink-2)}
  .inp{
    width:100%;height:46px;border-radius:10px;background:#202226;border:1.5px solid #2b2d32;
    color:var(--ink);font-size:15px;padding:0 14px;outline:none;transition:border-color .14s;
  }
  .inp:focus{border-color:var(--gold)}
  .inp::placeholder{color:#5c5e64}
  .phone-row{display:flex;gap:10px}
  .cc{
    display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 12px;
    border-radius:10px;background:#202226;border:1.5px solid #2b2d32;
    font-size:14px;font-weight:600;flex:0 0 auto;
  }
  .btn-gold{
    width:100%;height:52px;border-radius:12px;background:var(--gold-grad);
    color:var(--gold-ink);font-size:15.5px;font-weight:800;letter-spacing:-.005em;
    box-shadow:0 6px 18px -8px rgba(217,180,95,.6);transition:filter .15s,transform .12s;
  }
  .btn-gold:hover{filter:brightness(1.05)}
  .btn-gold:active{transform:scale(.99)}
  .btn-gold:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed;box-shadow:none}
  .sheet-foot{padding:6px 20px 20px}

  /* ─────────── table detail ─────────── */
  .dm-veil{
    position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;
    display:none;padding:26px 26px 26px 70px;
  }
  .dm-veil.on{display:block}
  .dm-close{
    position:absolute;left:16px;top:26px;width:42px;height:42px;border-radius:50%;
    background:#1b1c1f;border:1px solid var(--line-soft);
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink);z-index:2;
  }
  .dm{
    height:100%;background:#141517;border:1px solid var(--line-soft);border-radius:16px;
    display:flex;flex-direction:column;overflow:hidden;
    animation:sheetIn .24s cubic-bezier(.2,.7,.2,1) both;
  }
  .dm-cols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.25fr 1fr}
  .dm-col{min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:20px}
  .dm-col + .dm-col{border-left:1px solid #202225}
  .dm-h{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .dm-h.tab{
    align-self:flex-start;color:var(--gold);padding-bottom:9px;
    border-bottom:2px solid var(--gold);
  }
  .dm-h.tab svg{color:var(--gold)}
  .dm-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:4px}

  /* guest column */
  .gstats{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .gstats::-webkit-scrollbar{display:none}
  .gstat{
    display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-2);
    background:#1c1e21;border:1px solid #262a2e;border-radius:8px;padding:5px 8px;
    white-space:nowrap;flex:0 0 auto;
  }
  .gstat svg{width:12px;height:12px;color:var(--ink-3)}
  .occ-chip{
    display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
    background:#1f1c15;border:1px solid #3a3223;color:var(--gold-soft);
    border-radius:8px;padding:7px 11px;margin-bottom:10px;
  }
  .score-chip{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px;
  }
  .score-chip .sc-b{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
    color:var(--gold-ink);background:var(--gold-grad);border-radius:8px;padding:6px 10px;
  }
  .score-chip .sc-n{font-size:11.5px;font-weight:700;color:var(--gold-soft)}
  .lv-rate{
    margin-left:auto;font-size:10.5px;font-weight:800;border-radius:5px;padding:2px 6px;
  }
  .lv-rate.ok{background:#1e3b2b;color:#8fe0b0}
  .lv-rate.bad{background:#3a2320;color:#e8a099}
  .lv-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12.5px;color:#b4b2ac}
  .lv-grid b{color:var(--ink);font-weight:700}
  .lv-quote{
    font-size:12px;color:#9c9a95;line-height:1.5;margin-top:9px;padding-top:9px;
    border-top:1px solid #26282c;font-style:italic;
  }
  .promo-row{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:#c9c7c1;padding:3px 0;line-height:1.45}
  .promo-row svg{width:12px;height:12px;color:var(--gold);margin-top:3px;flex:0 0 auto}
  .promo-note{font-size:11px;color:var(--ink-3);margin-top:8px;font-style:italic}
  .info-card{
    background:#1c1a14;border:1px solid #322c1e;border-radius:11px;
    padding:12px 13px;margin-bottom:10px;
  }
  .info-card.plain{background:#1a1b1e;border-color:#26282c}
  .ic-h{
    display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;
    color:var(--gold-soft);margin-bottom:6px;
  }
  .info-card.plain .ic-h{color:var(--ink-2)}
  .ic-h svg{width:14px;height:14px}
  .ic-b{font-size:13px;line-height:1.55;color:#c9c7c1}
  .ic-b.muted{color:var(--ink-3);font-style:italic}
  .row-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
  .row-h b{font-size:15px;font-weight:800}
  .add-lnk{
    font-size:13px;font-weight:700;color:var(--gold);
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    min-height:40px;min-width:40px;padding:0 11px;margin:-9px -11px;border-radius:8px;
  }
  .add-lnk:hover{background:rgba(217,180,95,.1)}
  .avatars{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  .av{
    width:40px;height:40px;border-radius:50%;background:#232529;border:1.5px solid #2e3136;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;color:var(--ink-2);transition:all .14s;
  }
  .av.on{border-color:var(--gold);color:var(--gold);background:rgba(217,180,95,.12)}
  .gcard{background:#1a1b1e;border:1px solid #26282c;border-radius:12px;padding:13px}
  .gc-top{display:flex;align-items:center;gap:11px;margin-bottom:11px}
  .gc-av{
    width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    background:rgba(217,180,95,.14);border:1.5px solid var(--gold-line);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:var(--gold);
  }
  .gc-nm{font-size:17px;font-weight:800;color:var(--gold-soft);line-height:1.2}
  .gc-ph{font-size:12.5px;color:var(--ink-3);font-weight:600}
  .tag-purple{
    display:inline-flex;align-items:center;gap:6px;width:100%;
    background:#2c2260;border:1px solid #3d2f80;color:#cfc3ff;
    border-radius:8px;padding:8px 11px;font-size:12px;font-weight:700;margin-top:9px;
  }

  /* ── WHAT TO DO — a checklist, not a wall of cards ── */
  .todo{background:#1a1b1e;border:1px solid #26282c;border-radius:12px;overflow:hidden;margin-bottom:12px}
  .todo-h{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 13px;border-bottom:1px solid #232528;
  }
  .todo-h b{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#cfcdc6}
  .todo-prog{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .todo-row{
    width:100%;display:flex;align-items:flex-start;gap:11px;text-align:left;
    padding:12px 13px;border-bottom:1px solid #202225;position:relative;
    transition:background .14s;
  }
  .todo-row:last-child{border-bottom:none}
  .todo-row:hover{background:#1e2023}
  .todo-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
  .todo-row.red::before  {background:var(--red)}
  .todo-row.amber::before{background:#c98a3a}
  .todo-row.gold::before {background:var(--gold)}
  /* the ring stays 20px; the button around it is finger-sized */
  .tick-hit{flex:0 0 auto;width:40px;min-height:40px;display:grid;place-items:center;align-self:flex-start}
  .tick{
    width:20px;height:20px;border-radius:50%;flex:0 0 auto;
    border:2px solid #43464c;display:inline-flex;align-items:center;justify-content:center;
    color:transparent;transition:all .16s;
  }
  .todo-row.red .tick{border-color:#8a4a44}
  .todo-row.amber .tick{border-color:#7d5c2c}
  .todo-row.gold .tick{border-color:var(--gold-line)}
  .todo-row:hover .tick{border-color:var(--gold);color:rgba(217,180,95,.4)}
  .tick svg{width:12px;height:12px}
  .todo-b{flex:1;min-width:0;min-height:40px;display:flex;flex-direction:column;justify-content:center;text-align:left;padding:2px 0}
  .tick-hit{order:9}
  .todo-a{display:block;font-size:14px;font-weight:800;color:#f2efe7;line-height:1.3}
  .todo-w{display:block;font-size:12px;color:#9c9a95;line-height:1.45;margin-top:3px}
  /* an action nobody has closed, and one that has only just appeared */
  .todo-age,.todo-flag{
    display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-left:7px;
    font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    border-radius:5px;padding:2px 6px;
  }
  .todo-age{background:rgba(214,154,69,.2);color:#e8bd7d;border:1px solid #6d4f24}
  .todo-flag{background:rgba(217,180,95,.18);color:var(--gold-soft);border:1px solid var(--gold-line)}
  .todo-row.late{border-color:#6d4f24;background:linear-gradient(180deg,rgba(214,154,69,.09),transparent 65%)}
  .todo-row.late .tick{border-color:#6d4f24;color:#e8bd7d}
  .todo-row.is-new{box-shadow:inset 3px 0 0 var(--gold)}
  /* dismiss on the left, done on the right — two deliberate targets, and the
     row body between them is not a button, so nothing closes by accident */
  .todo-x{
    flex:0 0 auto;width:40px;min-height:40px;display:grid;place-items:center;
    color:var(--ink-3);border-radius:9px;align-self:flex-start;
  }
  .todo-x:hover{background:rgba(255,255,255,.06);color:var(--ink-2)}
  .todo-x:disabled{opacity:.3}

  /* a closed row strikes through, holds for three seconds with Undo, then
     collapses out of the list */
  .todo-row{overflow:hidden;transition:opacity .24s ease,max-height .24s ease,margin .24s ease}
  .todo-row.settling .todo-a{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}
  .todo-row.settling .todo-w{color:var(--ink-3);font-style:italic}
  .todo-row.settling{background:rgba(255,255,255,.02)}
  .todo-row.settling.done .tick,.todo-row.settling.done{border-color:var(--green-line)}
  .todo-row.leaving{opacity:0;max-height:0!important;margin-top:0;margin-bottom:0}
  .todo-undo{
    flex:0 0 auto;align-self:center;min-height:40px;padding:0 13px;border-radius:9px;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    background:rgba(217,180,95,.16);border:1px solid var(--gold-line);color:var(--gold-soft);
    font-size:12.5px;font-weight:800;
  }
  .todo-undo:hover{background:rgba(217,180,95,.28)}
  .todo-sub{
    display:flex;align-items:center;gap:6px;margin:14px 0 8px;
    font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  }
  /* the quiet close: one line, no border, no colour asking for attention */
  .todo.all-good{background:transparent;border-color:var(--line-soft)}
  .todo.all-good .todo-clear{
    display:flex;align-items:center;gap:9px;padding:14px 16px;
    font-size:13px;font-weight:700;color:var(--ink-2);
  }
  .todo.all-good .todo-clear svg{color:#5fae82}
  .todo.all-good .todo-clear i{
    font-style:normal;margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-3);
  }
  .todo-warn{
    display:inline-flex;align-items:center;gap:5px;margin-left:10px;
    font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    color:#e8bd7d;background:rgba(214,154,69,.16);border:1px solid #6d4f24;
    border-radius:6px;padding:3px 7px;
  }
  body.light .todo-x:hover{background:rgba(0,0,0,.05)}
  .todo-who{
    flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--gold-soft);background:rgba(217,180,95,.13);border:1px solid var(--gold-line);
    border-radius:5px;padding:3px 6px;margin-top:1px;
  }
  /* done — stays visible briefly as proof, then reads as history */
  .todo-row.is-done{background:#15231b}
  .todo-row.is-done::before{background:#2f7a51}
  .todo-row.is-done .tick{background:#3f9f6b;border-color:#3f9f6b;color:#0d1a12}
  .todo-row.is-done .todo-a{color:#84d6a8;font-weight:700}
  .todo-row.is-done .todo-w{display:none}
  .todo-more{
    width:100%;min-height:42px;font-size:12px;font-weight:700;color:var(--ink-2);
    padding:10px;border-top:1px solid #202225;
  }
  .todo-more:hover{color:var(--gold)}
  .todo-clear{
    display:flex;align-items:center;gap:9px;padding:13px;
    font-size:12.5px;color:var(--ink-2);font-weight:600;
  }
  .todo-clear svg{width:15px;height:15px;color:#5fae82}

  /* guest bucket badge */
  .bkt{
    display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
    font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    border-radius:6px;padding:3px 7px;
    background:#232529;border:1px solid #2f3237;color:var(--ink-2);
  }
  .bkt.gold {background:rgba(217,180,95,.13);border-color:var(--gold-line);color:var(--gold-soft)}
  .bkt.amber{background:rgba(201,138,58,.14);border-color:#6d4f24;color:#dcae6e}
  .bkt.red  {background:rgba(216,72,63,.13);border-color:#6b332c;color:#e8a099}
  .bkt-hint{font-size:12px;color:#9c9a95;line-height:1.45;margin-top:7px}

  /* recommendations — a strip that scrolls sideways, so it costs one row not one column */
  .reco-strip{margin-top:16px;padding-top:14px;border-top:1px solid #202225}
  .rs-h{
    display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;
  }
  .rs-h svg{color:var(--gold)}
  .rs-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .rs-row::-webkit-scrollbar{display:none}
  .rs-card{
    flex:0 0 auto;width:212px;display:flex;gap:10px;align-items:center;
    background:#1a1b1e;border:1px solid #26282c;border-radius:10px;padding:10px;
  }
  .rs-img{
    width:38px;height:38px;border-radius:8px;flex:0 0 auto;position:relative;
    background:linear-gradient(135deg,#2a2c30,#1f2124);
    display:flex;align-items:center;justify-content:center;color:#4d5055;
  }
  .rs-best{
    position:absolute;left:-2px;bottom:-2px;background:var(--red);color:#fff;
    font-size:10px;font-weight:800;border-radius:4px;padding:1px 4px;
  }
  .rs-b{min-width:0}
  .rs-n{
    font-size:12px;font-weight:700;line-height:1.32;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .rs-m{font-size:11px;color:var(--ink-3);font-weight:600;margin-top:2px}
  body.light .rs-card{background:#faf8f3;border-color:var(--line-soft)}
  body.light .rs-img{background:linear-gradient(135deg,#eae6dd,#f4f1ea);color:#a9a49a}
  body.light .rs-n{color:#1b1917}

  /* reco column */
  .reco{
    display:flex;gap:12px;background:#1a1b1e;border:1px solid #26282c;
    border-radius:12px;padding:11px;margin-bottom:11px;
  }
  .reco-img{
    width:78px;height:78px;border-radius:9px;flex:0 0 auto;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#2a2c30,#1f2124);
    display:flex;align-items:center;justify-content:center;color:#4d5055;
  }
  .best-ribbon{
    position:absolute;left:0;bottom:0;right:0;background:var(--red);color:#fff;
    font-size:10px;font-weight:800;text-align:center;padding:3px 2px;line-height:1.15;
  }
  .reco-b{flex:1;min-width:0}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
  .bdg{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff}
  .bdg.reorder{background:var(--purple)}
  .reco-nm{font-size:13.5px;font-weight:700;line-height:1.35;margin-bottom:5px}
  .reco-pr{font-size:13px;font-weight:800;color:#dcd9d2}

  /* order column */
  .ord-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
  .ord-id{font-size:11.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:8px}
  .pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;background:#33261f;color:#e2a08f}
  .pill.paid{background:#1e3b2b;color:#8fe0b0}
  .ord-meta{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#c9c7c1;font-weight:600;
    padding:12px 0 14px;border-bottom:1px solid #202225;margin-bottom:14px}
  .ord-meta span{display:inline-flex;align-items:center;gap:6px}
  .ord-meta svg{color:var(--ink-3)}
  .oi-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #1e2023;font-size:13.5px}
  .oi-nm{flex:1;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
  .oi-q{color:var(--ink-2);font-weight:700}
  .oi-p{font-weight:800}
  .ord-empty{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;color:var(--ink-3);font-size:13px;text-align:center;padding:30px 10px;
  }

    min-height:42px;padding:0 15px;border-radius:10px;background:#1e2023;border:1px solid #2c2f33;
    font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:8px;
    transition:all .14s;

  /* detail footer */
  .dm-foot{

  .btn-pay{
    height:48px;padding:0 34px;border-radius:11px;background:var(--gold-grad);

  /* payment summary */
  .pay-card{width:100%;max-width:400px;background:#191a1d;border:1px solid var(--line-soft);border-radius:16px;
    animation:sheetIn .22s cubic-bezier(.2,.7,.2,1) both;overflow:hidden}
  .pay-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px}
  .pay-h b{font-size:17px;font-weight:800}
  .pay-sub{font-size:13px;color:var(--ink-2);font-weight:600;padding:0 18px 12px}
  .pay-b{padding:0 18px 18px}
  .tickets{display:flex;gap:16px;background:#1e2023;border-radius:9px;padding:10px 13px;margin-bottom:14px;
    font-size:12.5px;font-weight:700;color:var(--ink-2)}
  .tickets span{display:inline-flex;align-items:center;gap:6px}
  .pl{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13.5px}
  .pl .k{color:var(--ink-2);font-weight:600}
  .pl .v{font-weight:700}
  .tips{display:flex;align-items:center;justify-content:space-between;background:#1c1a14;
    border:1px solid #322c1e;border-radius:9px;padding:11px 13px;margin:10px 0;font-size:13px;font-weight:700;color:var(--gold-soft)}
  .dash{border-top:1px dashed #34373b;margin:12px 0}
  .pl.big .k{color:var(--ink);font-weight:700;font-size:15px}
  .pl.big .v{font-size:16px}
  .pl.rem .k{font-size:17px;font-weight:800;color:var(--ink)}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translateX(-50%) translateY(70px);

    font-size:13.5px;font-weight:600;z-index:200;opacity:0;
    transition:opacity .2s,transform .26s cubic-bezier(.3,1.3,.4,1);
    display:flex;align-items:center;gap:9px;box-shadow:0 14px 34px -12px rgba(0,0,0,.7);

  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* search bar */

  /* ─────────── responsive ─────────── */
  @media (max-width:1080px){
    .dm-veil{padding:16px 16px 16px 62px}
    .dm-cols{grid-template-columns:1fr}
    .dm-col + .dm-col{border-left:none;border-top:1px solid #202225}
  }
  /* landscape tablet — the device this actually runs on */
  @media (min-width:1024px) and (orientation:landscape){
    .grid{grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:20px}
    .content{padding:6px 22px 26px}
    .callbar{margin:0 22px 12px}
  }
  @media (max-width:1120px){
    .seg button{padding:0 17px}
  }
  /* only a phone loses the phase label — on a tablet it has to stay findable */
  @media (max-width:700px){
    .phase-chip span:not(.pc-dot){display:none}
    .phase-chip{padding:0 14px}
  }
  @media (max-width:900px){
    .seg button{padding:0 13px;font-size:13px}
  }
  @media (max-width:760px){
    .topbar{padding:12px 14px;gap:8px}
    .tb-side{flex:0 0 auto}
    .seg{overflow-x:auto;scrollbar-width:none}
    .seg::-webkit-scrollbar{display:none}
    .seg button{padding:8px 13px;font-size:12.5px;white-space:nowrap}
    .top-btn{width:40px;height:40px}
    .phase-chip{height:40px}
    .content{padding:6px 14px 20px}
    .grid{grid-template-columns:1fr 1fr;gap:14px}
    .dm-veil{padding:12px 12px 12px 12px}
    .dm-close{left:auto;right:18px;top:20px}
    .dm-cols{grid-template-columns:1fr}
    .dm-col + .dm-col{border-left:none;border-top:1px solid #202225}
    .dm-foot{flex-wrap:wrap}
    .fab-edit{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="tb-side">
      <div class="view-title" id="view-title"></div>
      <button class="sec-btn" id="btn-sec"><span id="sec-lbl">All sections</span><i data-lucide="chevron-down" class="xs"></i></button>
      <div class="sec-menu" id="sec-menu"></div>
    </div>
    <div class="seg" id="seg">
      <button class="on" data-f="all">All</button>
      <button data-f="allocate">Allocate</button>
      <button data-f="vacant">Vacant</button>
      <button data-f="attention">Attention <span class="cnt" id="attn-cnt">0</span></button>
    </div>
    <div class="tb-side right"><div class="top-actions">
      <button class="phase-chip" id="btn-phase" title="Switch intelligence phase">
        <span class="pc-dot"></span><span id="pc-lbl">Phase 2</span>
      </button>
      <button class="top-btn" id="btn-legend" title="Table legend"><i data-lucide="info" class="lg"></i></button>
      <button class="top-btn" id="btn-search" title="Search"><i data-lucide="search" class="lg"></i></button>
      <button class="top-btn" id="btn-history" title="History"><i data-lucide="history" class="lg"></i></button>
    </div></div>
  </header>

  <div class="needbar" id="callbar"></div>
  <div class="content" id="content">
    <div class="legend" id="legend"></div>
    <div class="searchwrap" id="searchwrap">
      <div class="searchbar">
        <i data-lucide="search"></i>
        <input id="q" placeholder="Search table number or guest name" />
        <button class="x-btn" id="q-clear"><i data-lucide="x" class="sm"></i></button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <nav class="bnav" id="bnav">
    <button class="on" data-v="table"><i data-lucide="lamp-desk"></i><span>Table</span></button>
    <button data-v="manager"><i data-lucide="crown"></i><span>Manager</span><span class="nav-dot" id="nav-mgr-dot"></span></button>
    <button data-v="order"><i data-lucide="shopping-bag"></i><span>Order</span></button>
    <button data-v="menu"><i data-lucide="utensils-crossed"></i><span>Menu</span></button>
    <button data-v="settings"><i data-lucide="settings"></i><span>Settings</span></button>
    <button data-v="guide"><i data-lucide="book-open-text"></i><span>Guide</span></button>
  </nav>
</div>

<button class="fab-edit" id="fab-edit" title="Edit layout"><i data-lucide="pencil" class="sm"></i></button>

<!-- Allocate a table -->
<div class="veil bottom" id="veil-alloc">
  <div class="sheet" id="alloc-sheet">
    <div class="grabber"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="alloc-title">Table 03</div>
      <button class="x-btn" data-close="veil-alloc"><i data-lucide="x" class="lg"></i></button>
    </div>
    <div class="sheet-body">
      <div class="sec-lbl">Select pax</div>
      <div class="pax-grid" id="pax-grid"></div>
      <div class="sec-lbl">Guest info</div>
      <div class="fld-lbl">Phone number</div>
      <div class="phone-row" style="margin-bottom:14px">
        <div class="cc">🇸🇬 +65 <i data-lucide="chevron-down" class="xs"></i></div>
        <input class="inp" id="a-phone" inputmode="tel" placeholder="80897878" />
      </div>
      <div class="fld-lbl">Guest Name</div>
      <input class="inp" id="a-name" placeholder="Guest name" />
      <div id="a-match" style="margin-top:10px"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn-gold" id="a-confirm">Confirm and Print QR</button>
    </div>
  </div>
</div>

<!-- Table detail -->
<div class="dm-veil" id="veil-detail">
  <button class="dm-close" id="dm-close"><i data-lucide="x" class="lg"></i></button>
  <div class="dm-elsewhere" id="dm-elsewhere"></div>
  <div class="dm" id="dm"></div>
</div>

<!-- A manager's own lever: put something on a table because they judged it
     was the right thing, not because Pulse suggested it. -->
<div class="veil" id="veil-comp" style="z-index:80">
  <div class="sheet" style="max-width:460px">
    <div class="sheet-head" style="padding-top:18px">
      <div class="sheet-title" id="cp-title">On the house</div>
      <button class="x-btn" data-close="veil-comp"><i data-lucide="x" class="lg"></i></button>
    </div>
    <div class="sheet-body">
      <div class="fld-lbl" id="cp-sub"></div>
      <div id="cp-sug"></div>
      <div class="fld-lbl" style="margin:14px 0 0">Or choose anything</div>
      <div class="cp-grid" id="cp-grid"></div>
      <div id="cp-sent" style="margin-top:14px"></div>
    </div>
  </div>
</div>

<!-- Closing a table is the one moment staff know something Pulse does not.
     Asking then costs nothing and is always skippable. -->
<div class="veil" id="veil-close" style="z-index:80">
  <div class="sheet" style="max-width:400px">
    <div class="sheet-head" style="padding-top:18px">
      <div class="sheet-title" id="cl-title">Close table</div>
      <button class="x-btn" data-close="veil-close"><i data-lucide="x" class="lg"></i></button>
    </div>
    <div class="sheet-body">
      <div class="fld-lbl" id="cl-sub">Anything worth remembering for next time? Optional.</div>
      <div class="pax-grid" id="cl-cats" style="grid-template-columns:repeat(3,1fr);margin:12px 0 14px"></div>
      <input class="inp" id="cl-text" placeholder="One line, in your own words" />
    </div>
    <div class="sheet-foot" style="display:flex;gap:10px">
      <button class="btn-ghost" id="cl-skip" style="flex:0 0 auto">Close without a note</button>
      <button class="btn-gold" id="cl-save" style="flex:1">Save and close</button>
    </div>
  </div>
</div>

<!-- Remember this — staff teach the system what it did not know -->
<div class="veil" id="veil-rem" style="z-index:80">
  <div class="sheet" style="max-width:380px">
    <div class="sheet-head" style="padding-top:18px">
      <div class="sheet-title" id="rem-title">Remember this</div>
      <button class="x-btn" data-close="veil-rem"><i data-lucide="x" class="lg"></i></button>
    </div>
    <div class="sheet-body">
      <div class="fld-lbl" id="rem-sub">Saved to the guest for next time</div>
      <div class="pax-grid" id="rem-cats" style="grid-template-columns:repeat(2,1fr);margin:12px 0 14px"></div>
      <input class="inp" id="rem-text" placeholder="Keep it to one line" />
    </div>
    <div class="sheet-foot"><button class="btn-gold" id="rem-save">Save</button></div>
  </div>
</div>

<!-- Payment summary — sits above the table detail -->
<div class="veil" id="veil-pay" style="z-index:80">
  <div class="pay-card" id="pay-card"></div>
</div>

<div class="toast" id="toast"></div>

<script>

/* The guest taps a button on their phone — there is no free-text field, so
   Pulse never invents a description. Three groups, because they need three
   different things: someone to listen, someone to come, something carried. */
const CALL_TYPES = {

             icon:'circle-alert', kind:'grave', mgr:true,

};
/* Most urgent first. A table can have several outstanding at once — one trip
   handles them all, so they collect on one entry instead of replacing each
   other. */
const CALL_ORDER = ['concern','query','waiter','water','cutlery'];
const callTypes = c => CALL_ORDER.filter(k => c.types.includes(k));
const callMain  = c => CALL_TYPES[callTypes(c)[0]];
const callKind  = c => callMain(c).kind;
const callLabel = c => callTypes(c).map(k => CALL_TYPES[k].label).join(' · ');
/* What the waiter does: the most urgent thing, carrying anything asked for. */
function callAct(c) {
  const ks = callTypes(c), lead = CALL_TYPES[ks[0]];
  const carry = ks.map(k => CALL_TYPES[k].carry).filter(Boolean);
  if (lead.carry) return `Take ${carry.join(' and ')} over`;
  return carry.length ? `${lead.act}, and take ${carry.join(' and ')} over` : lead.act;
}
const callBlind = c => callTypes(c).map(k => CALL_TYPES[k].blind).filter(Boolean).join(' ');
const callDone  = c => callTypes(c).length > 1 ? 'Table attended' : CALL_TYPES[callTypes(c)[0]].done;
const callIsMgr = c => callTypes(c).some(k => CALL_TYPES[k].mgr);
/* Several requests on one table inherit the tightest limit of the set — a
   concern does not become patient because they also wanted water. */
const callSla   = c => Math.min(...callTypes(c).map(k => CALL_TYPES[k].sla));

function dishForTaste(tastes) {
  for (const t of tastes || []) {
    const hit = DISH_TASTE.find(d => d.taste === t);
    if (hit) return hit;

}

/* ══════════════════════════════════════════════════════════════
   GUEST BUCKETS
   One label per guest that tells staff how to treat them. Derived —
   never typed by hand — so it cannot go stale.
   ══════════════════════════════════════════════════════════════ */
function daysSince(lastVisit) {
  if (!lastVisit) return null;
  const m = String(lastVisit).match(/(\d+)\s*(day|week|month)/i);
  if (!m) return null;
  const n = +m[1], u = m[2].toLowerCase();
  return u === 'day' ? n : u === 'week' ? n*7 : n*30;
}
const BUCKETS = {
  new:       { label:'New guest',  tone:'plain', hint:'First time here — make the first impression count.' },
  returning: { label:'Returning',  tone:'plain', hint:'Has been here before. Recognise them.' },
  regular:   { label:'Regular',    tone:'gold',  hint:'Comes often. Greet by name and lead with their usual.' },
  vip:       { label:'High value', tone:'gold',  hint:'Spends well above average. Worth a manager hello.' },
  lapsed:    { label:'Lapsed',     tone:'amber', hint:'Has not been in for a while. Make them feel remembered.' },
  risk:      { label:'At risk',    tone:'red',   hint:'Last experience fell short. Recover it tonight.' },
};
function bucketOf(g) {
  if (!g || !g.visits) return 'new';
  if (g.prevIssue) return 'risk';
  const gap = daysSince(g.lastVisit);
  if (gap !== null && gap >= 60) return 'lapsed';
  if ((g.avgSpend || 0) >= 65) return 'vip';
  if (g.visits >= 5) return 'regular';
  return 'returning';
}
function bucketOfTable(t) {
  const g = t && t.guest ? guests[t.guest] : null;
  return g ? bucketOf(g) : null;
}

    who:c => c.call && callIsMgr(c.call) ? 'manager' : 'waiter',

    act:c => callIsMgr(c.call) ? 'Get the manager to this table' : callAct(c.call),

    done:c => callDone(c.call) },

  /* ───────── PHASE 3 · the guest's phone, the clock, and the manager's calls ─────────
     Every line below names what was observed. A waiter should never have to

  // they have a cart and never sent it. This is an order the kitchen has not seen.
  { id:'cart-unsent', phase:3, lvl:'red', who:'waiter', icon:'shopping-cart', score:93,
    on:c => c.sw.cartItems >= 1 && c.sw.cartMin >= 3,
    act:'Ask them to send their order',
    why:c => `${c.sw.cartItems} items in their cart, never sent — ${c.sw.cartMin} min.`,
    done:'Order sent' },

  // sitting there without even opening the menu
  { id:'idle-table', phase:3, lvl:'amber', who:'waiter', icon:'armchair', score:89,
    on:c => c.t.status === 'seated' && !c.t.dishes && c.hasSw && !c.sw.menuOpenMin && c.mins >= 8,
    act:'Take their order in person',
    why:c => `Sitting ${dur(c.mins)}, menu never opened.`,
    done:'Order taken in person' },

  // long in the menu, nothing added
  { id:'menu-stall', phase:3, lvl:'amber', who:'waiter', icon:'book-open', score:87,
    on:c => c.sw.menuOpenMin >= 6 && !c.sw.cartItems && !c.t.dishes,
    act:'Talk them through the menu',
    why:c => `${c.sw.menuOpenMin} min in the menu, nothing added.`,
    done:'Menu talked through' },

  { id:'course-gap', phase:3, lvl:'amber', who:'waiter', icon:'timer', score:85,
    on:c => (c.t.lastOrderMin||0) >= 25 && c.t.status === 'seated',
    act:'Offer the next course',
    why:c => `Last ordered ${c.t.lastOrderMin} min ago.`,
    done:'Next course offered' },

  // a long gap since the last drink was ordered
  { id:'drink-refill', phase:3, lvl:'amber', who:'waiter', icon:'wine', score:83,
    on:c => (c.t.lastDrinkMin||0) >= 20 && c.t.status === 'seated',
    act:'Offer another round',
    why:c => `Last drink ${c.t.lastDrinkMin} min ago.`,

  // one dish, opened again and again
  { id:'repeat-item', phase:3, lvl:'amber', who:'waiter', icon:'eye', score:80,
    on:c => c.sw.repeatItem && c.sw.repeatViews >= 3,

    why:c => `Opened it ${c.sw.repeatViews} times, never added it.`,

  // lingering in one part of the menu
  { id:'browsing', phase:3, lvl:'amber', who:'waiter', icon:'wine', score:78,
    on:c => c.sw.cat && c.sw.catMin >= 3,
    act:c => `Offer to choose ${c.sw.cat === 'wine list' ? 'a wine' : 'something'} with them`,
    why:c => `${c.sw.catMin} min in the ${c.sw.cat}, nothing ordered.`,
    done:'Choice made together' },

  { id:'occasion', phase:3, lvl:'gold', who:'waiter', icon:'party-popper', score:86,
    on:c => c.g && c.g.occasion,
    act:c => `Mention the ${c.g.occasion.toLowerCase()}`,
    why:c => `${c.g.name.split(' ')[0]} is here for a ${c.g.occasion.toLowerCase()}.`,

    on:c => c.g && c.g.voucher && c.t.status !== 'paid',

    why:c => c.g.voucher.why + '.',
    done:'Voucher offered' },

    on:c => c.g && (c.g.promos||[]).length && !c.t.dishes,
    act:c => `Mention: ${c.g.promos[0]}`,
    why:'They qualify and have not ordered yet.',
    done:'Promotion mentioned' },

  /* Manager's own calls. Judgement, not errands — so Phase 3, and the action

  { id:'mgr-recovery', phase:3, lvl:'red', who:'manager', mgrRank:1, icon:'user-check', score:94,
    on:c => c.g && c.g.prevIssue && c.bucket === 'risk' && (c.g.avgSpend||0) >= 60,
    act:'Visit the table',

    done:'You visited the table' },

    on:c => !!c.call && callIsMgr(c.call),
