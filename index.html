<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pulse — Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --bg:#0b0b0c;
    --card:#17181a;
    --card-2:#1d1e21;
    --line:#2a2c30;
    --line-soft:#232529;
    --ink:#f4f2ee;
    --ink-2:#a9aab0;
    --ink-3:#6e7076;

    /* gold — the product's primary accent */
    --gold:#d9b45f;
    --gold-soft:#e8cf94;
    --gold-line:#8d7434;
    --gold-ink:#221a08;
    --gold-grad:linear-gradient(180deg,#e0be6c 0%,#c39a3d 100%);

    /* bill pill (unpaid) */
    --bill-bg:#3a3125;
    --bill-ink:#e6d6b0;

    /* paid */
    --green:#3f9f6b;
    --green-line:#2f7a51;
    --green-bg:#16241c;
    --green-pill:#2f6f4c;
    --green-ink:#dff3e6;

    --teal:#22b8a6;
    --purple:#7d5cf6;
    --red:#d8483f;

    --r-card:14px;
    --r-btn:12px;
    --nav-h:74px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  i[data-lucide]{width:16px;height:16px;display:inline-flex;flex-shrink:0}
  i.xs[data-lucide]{width:13px;height:13px}
  i.sm[data-lucide]{width:14px;height:14px}
  i.lg[data-lucide]{width:20px;height:20px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2e3034;border-radius:4px}

  /* ─────────── shell ─────────── */
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    padding:14px 18px;position:relative;
  }
  .seg{
    display:inline-flex;align-items:center;gap:2px;
    background:#151618;border:1px solid var(--line-soft);
    border-radius:999px;padding:5px;
  }
  .seg button{
    padding:9px 26px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2);
    transition:background .16s,color .16s;
  }
  .seg button.on{background:#efece3;color:#1a1a1a;font-weight:700}
  .view-title{
    position:absolute;left:22px;top:50%;transform:translateY(-50%);
    font-size:17px;font-weight:800;display:none;
  }
  .top-actions{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;gap:10px}
  .top-btn{
    width:44px;height:44px;border-radius:50%;
    background:#151618;border:1px solid var(--line-soft);
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
    transition:border-color .16s,background .16s;
  }
  .top-btn:hover{border-color:var(--line);background:#1b1c1f}

  .content{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 18px 22px}

  /* ─────────── table grid ─────────── */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));
    gap:22px;max-width:1420px;margin:0 auto;
  }
  .tcard{
    position:relative;overflow:hidden;
    background:var(--card);
    border:1.5px solid var(--line-soft);
    border-radius:var(--r-card);
    padding:14px 15px 15px;
    min-height:152px;
    display:flex;flex-direction:column;
    cursor:pointer;
    transition:transform .16s,border-color .16s,box-shadow .16s;
  }
  .tcard:active{transform:scale(.985)}

  /* vacant — just the table number, centred */
  .tcard.vacant{
    align-items:center;justify-content:center;
    background:#131416;border-color:#212327;
  }
  .tcard.vacant .tc-vac{font-size:25px;font-weight:700;color:#e9e7e1}
  .tcard.vacant:hover{border-color:var(--gold-line)}

  /* blocked / unavailable */
  .tcard.blocked{
    align-items:center;justify-content:center;
    background:
      repeating-linear-gradient(-45deg,transparent 0 9px,rgba(255,255,255,.022) 9px 18px),
      #121316;
    border-color:#1e2023;cursor:not-allowed;
  }
  .tcard.blocked .tc-vac{font-size:25px;font-weight:700;color:#4a4c51}

  /* occupied */
  .tcard.seated{border-color:#e6e2d6}
  .tcard.fresh{border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,180,95,.18)}
  .tcard.paid{
    border-color:var(--green-line);
    background:
      repeating-linear-gradient(-45deg,transparent 0 9px,rgba(63,159,107,.10) 9px 18px),
      #14201a;
  }

  .tc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .tc-id{font-size:13px;font-weight:600;color:var(--ink-2)}
  .tc-doc{color:var(--gold);opacity:.9;display:inline-flex}
  .tcard.paid .tc-doc{color:var(--green)}
  .tc-name{
    font-size:23px;font-weight:800;letter-spacing:-.01em;line-height:1.1;
    color:#f2efe7;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tcard.fresh .tc-name{color:var(--gold-soft)}
  .tc-name .others{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0}
  .tc-meta{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:13px;color:#cfcdc6;font-weight:500}
  .tc-meta span{display:inline-flex;align-items:center;gap:5px}
  .tc-meta i[data-lucide]{color:var(--ink-2)}
  /* one indicator, one line — the card must still be readable in a glance */
  .tc-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .tc-dot.red{background:var(--red);box-shadow:0 0 8px rgba(216,72,63,.65)}
  .tc-dot.amber{background:#d69a45;box-shadow:0 0 8px rgba(214,154,69,.5)}
  .tc-dot.gold{background:var(--gold);box-shadow:0 0 8px rgba(217,180,95,.45)}
  .tc-act{
    display:flex;align-items:center;gap:5px;margin-top:8px;
    font-size:11.5px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tc-act i[data-lucide]{width:12px;height:12px}
  .tc-act.red{color:#e8a099}
  .tc-act.amber{color:#dcae6e}
  .tc-act.gold{color:var(--gold-soft)}
  .seg button .cnt{
    display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
    padding:0 5px;border-radius:10px;background:var(--red);color:#fff;
    font-size:10.5px;font-weight:800;margin-left:7px;vertical-align:middle;
  }
  .seg button.on .cnt{background:#1f1f1f;color:#efece3}

  .tc-bill{
    margin-top:auto;background:var(--bill-bg);color:var(--bill-ink);
    border-radius:9px;padding:10px 13px;font-size:13.5px;font-weight:700;
  }
  .tcard.paid .tc-bill{background:var(--green-pill);color:var(--green-ink)}
  .tc-bill.solo{justify-content:center}

  /* floating edit affordance, as in the app */
  .fab-edit{
    position:fixed;right:6px;top:50%;transform:translateY(-50%);
    width:26px;height:52px;border-radius:9px 0 0 9px;
    background:#1b1c1f;border:1px solid var(--line-soft);border-right:none;
    display:flex;align-items:center;justify-content:center;color:var(--ink-2);z-index:20;
  }

  /* ─────────── bottom nav ─────────── */
  .bnav{
    flex:0 0 auto;height:var(--nav-h);
    background:#0e0f10;border-top:1px solid #1c1d20;
    display:flex;align-items:stretch;
  }
  .bnav button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    color:var(--ink-3);font-size:12px;font-weight:600;position:relative;
  }
  .bnav button i[data-lucide]{width:21px;height:21px}
  .bnav button.on{color:var(--gold)}
  .bnav button.on::before{
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:52px;height:2px;background:var(--gold);border-radius:0 0 2px 2px;
  }

  /* placeholder views for the other tabs */
  .stub{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;color:var(--ink-3);padding:60px 20px;text-align:center;
  }
  .stub i[data-lucide]{width:34px;height:34px}
  .stub b{color:var(--ink-2);font-size:15px;font-weight:700}

  /* ─────────── settings ─────────── */
  .setwrap{max-width:820px;margin:0 auto;padding:10px 0 30px}
  .set-h{font-size:17px;font-weight:800;margin-bottom:5px}
  .set-sub{font-size:13px;color:var(--ink-2);line-height:1.55;margin-bottom:14px;max-width:620px}
  .ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .ph-card{
    display:flex;flex-direction:column;gap:8px;text-align:left;
    background:var(--card);border:1.5px solid var(--line-soft);border-radius:var(--r-card);
    padding:16px;transition:border-color .16s,background .16s;
  }
  .ph-card:hover{border-color:#3a3d42}
  .ph-card.on{border-color:var(--gold);background:#1b1913}
  .ph-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ph-top b{font-size:15px;font-weight:800}
  .ph-body{font-size:13px;color:#b4b2ac;line-height:1.55}
  .ph-n{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .ph-card.on .ph-n{color:var(--gold-soft)}
  .bkt-list{display:flex;flex-direction:column;gap:9px}
  .bkt-row{
    display:flex;align-items:center;gap:12px;font-size:13px;color:#b4b2ac;
    background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;
  }
  .bkt-row .bkt{flex:0 0 92px;justify-content:center}
  @media (max-width:760px){ .ph-grid{grid-template-columns:1fr} }

  /* ─────────── sheets & modals ─────────── */
  .veil{
    position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);
    z-index:60;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .veil.on{display:flex}
  .veil.bottom{align-items:flex-end;justify-content:center;padding:0}

  .sheet{
    width:100%;max-width:420px;background:#191a1d;
    border:1px solid var(--line-soft);border-radius:20px;
    max-height:92vh;overflow:auto;
    animation:sheetIn .24s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .grabber{width:40px;height:4px;border-radius:3px;background:#3a3c41;margin:12px auto 4px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px}
  .sheet-title{font-size:19px;font-weight:800;color:var(--gold)}
  .x-btn{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .x-btn:hover{background:#222427;color:var(--ink)}
  .sheet-body{padding:12px 20px 20px}

  .sec-lbl{font-size:16px;font-weight:800;margin:14px 0 10px}
  .fld-lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .pax-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .pax{
    height:44px;border-radius:10px;background:#202226;border:1.5px solid #2b2d32;
    font-size:15px;font-weight:700;color:var(--ink);transition:all .14s;
  }
  .pax:hover{border-color:#3d4046}
  .pax.on{border-color:var(--gold);background:rgba(217,180,95,.13);color:var(--gold-soft)}
  .pax.wide{grid-column:1/-1;height:44px;font-size:14px;font-weight:600;color:var(--ink-2)}
  .inp{
    width:100%;height:46px;border-radius:10px;background:#202226;border:1.5px solid #2b2d32;
    color:var(--ink);font-size:15px;padding:0 14px;outline:none;transition:border-color .14s;
  }
  .inp:focus{border-color:var(--gold)}
  .inp::placeholder{color:#5c5e64}
  .phone-row{display:flex;gap:10px}
  .cc{
    display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 12px;
    border-radius:10px;background:#202226;border:1.5px solid #2b2d32;
    font-size:14px;font-weight:600;flex:0 0 auto;
  }
  .btn-gold{
    width:100%;height:52px;border-radius:12px;background:var(--gold-grad);
    color:var(--gold-ink);font-size:15.5px;font-weight:800;letter-spacing:-.005em;
    box-shadow:0 6px 18px -8px rgba(217,180,95,.6);transition:filter .15s,transform .12s;
  }
  .btn-gold:hover{filter:brightness(1.05)}
  .btn-gold:active{transform:scale(.99)}
  .btn-gold:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed;box-shadow:none}
  .sheet-foot{padding:6px 20px 20px}

  /* ─────────── table detail ─────────── */
  .dm-veil{
    position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;
    display:none;padding:26px 26px 26px 70px;
  }
  .dm-veil.on{display:block}
  .dm-close{
    position:absolute;left:16px;top:26px;width:42px;height:42px;border-radius:50%;
    background:#1b1c1f;border:1px solid var(--line-soft);
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink);z-index:2;
  }
  .dm{
    height:100%;background:#141517;border:1px solid var(--line-soft);border-radius:16px;
    display:flex;flex-direction:column;overflow:hidden;
    animation:sheetIn .24s cubic-bezier(.2,.7,.2,1) both;
  }
  .dm-cols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr}
  .dm-col{min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:20px}
  .dm-col + .dm-col{border-left:1px solid #202225}
  .dm-h{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .dm-h.tab{
    align-self:flex-start;color:var(--gold);padding-bottom:9px;
    border-bottom:2px solid var(--gold);
  }
  .dm-h.tab i[data-lucide]{color:var(--gold)}
  .dm-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:4px}

  /* guest column */
  .gstats{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .gstats::-webkit-scrollbar{display:none}
  .gstat{
    display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-2);
    background:#1c1e21;border:1px solid #262a2e;border-radius:8px;padding:5px 8px;
    white-space:nowrap;flex:0 0 auto;
  }
  .gstat i[data-lucide]{width:12px;height:12px;color:var(--ink-3)}
  .occ-chip{
    display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
    background:#1f1c15;border:1px solid #3a3223;color:var(--gold-soft);
    border-radius:8px;padding:7px 11px;margin-bottom:10px;
  }
  .info-card{
    background:#1c1a14;border:1px solid #322c1e;border-radius:11px;
    padding:12px 13px;margin-bottom:10px;
  }
  .info-card.plain{background:#1a1b1e;border-color:#26282c}
  .ic-h{
    display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;
    color:var(--gold-soft);margin-bottom:6px;
  }
  .info-card.plain .ic-h{color:var(--ink-2)}
  .ic-h i[data-lucide]{width:14px;height:14px}
  .ic-b{font-size:13px;line-height:1.55;color:#c9c7c1}
  .ic-b.muted{color:var(--ink-3);font-style:italic}
  .row-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
  .row-h b{font-size:15px;font-weight:800}
  .add-lnk{font-size:13px;font-weight:700;color:var(--gold);display:inline-flex;align-items:center;gap:4px}
  .avatars{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  .av{
    width:40px;height:40px;border-radius:50%;background:#232529;border:1.5px solid #2e3136;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;color:var(--ink-2);transition:all .14s;
  }
  .av.on{border-color:var(--gold);color:var(--gold);background:rgba(217,180,95,.12)}
  .gcard{background:#1a1b1e;border:1px solid #26282c;border-radius:12px;padding:13px}
  .gc-top{display:flex;align-items:center;gap:11px;margin-bottom:11px}
  .gc-av{
    width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    background:rgba(217,180,95,.14);border:1.5px solid var(--gold-line);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:var(--gold);
  }
  .gc-nm{font-size:17px;font-weight:800;color:var(--gold-soft);line-height:1.2}
  .gc-ph{font-size:12.5px;color:var(--ink-3);font-weight:600}
  .tag-purple{
    display:inline-flex;align-items:center;gap:6px;width:100%;
    background:#2c2260;border:1px solid #3d2f80;color:#cfc3ff;
    border-radius:8px;padding:8px 11px;font-size:12px;font-weight:700;margin-top:9px;
  }

  /* ── WHAT TO DO — a checklist, not a wall of cards ── */
  .todo{background:#1a1b1e;border:1px solid #26282c;border-radius:12px;overflow:hidden;margin-bottom:12px}
  .todo-h{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 13px;border-bottom:1px solid #232528;
  }
  .todo-h b{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#cfcdc6}
  .todo-prog{font-size:11.5px;font-weight:700;color:var(--ink-3)}
  .todo-row{
    width:100%;display:flex;align-items:flex-start;gap:11px;text-align:left;
    padding:12px 13px;border-bottom:1px solid #202225;position:relative;
    transition:background .14s;
  }
  .todo-row:last-child{border-bottom:none}
  .todo-row:hover{background:#1e2023}
  .todo-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
  .todo-row.red::before  {background:var(--red)}
  .todo-row.amber::before{background:#c98a3a}
  .todo-row.gold::before {background:var(--gold)}
  .tick{
    width:20px;height:20px;border-radius:50%;flex:0 0 auto;margin-top:1px;
    border:2px solid #43464c;display:inline-flex;align-items:center;justify-content:center;
    color:transparent;transition:all .16s;
  }
  .todo-row.red .tick{border-color:#8a4a44}
  .todo-row.amber .tick{border-color:#7d5c2c}
  .todo-row.gold .tick{border-color:var(--gold-line)}
  .todo-row:hover .tick{border-color:var(--gold);color:rgba(217,180,95,.4)}
  .tick i[data-lucide]{width:12px;height:12px}
  .todo-b{flex:1;min-width:0}
  .todo-a{display:block;font-size:14px;font-weight:800;color:#f2efe7;line-height:1.3}
  .todo-w{display:block;font-size:12px;color:#9c9a95;line-height:1.45;margin-top:3px}
  .todo-who{
    flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--gold-soft);background:rgba(217,180,95,.13);border:1px solid var(--gold-line);
    border-radius:5px;padding:3px 6px;margin-top:1px;
  }
  /* done — stays visible briefly as proof, then reads as history */
  .todo-row.is-done{background:#15231b}
  .todo-row.is-done::before{background:#2f7a51}
  .todo-row.is-done .tick{background:#3f9f6b;border-color:#3f9f6b;color:#0d1a12}
  .todo-row.is-done .todo-a{color:#84d6a8;font-weight:700}
  .todo-row.is-done .todo-w{display:none}
  .todo-more{
    width:100%;font-size:11.5px;font-weight:700;color:var(--ink-2);
    padding:10px;border-top:1px solid #202225;
  }
  .todo-more:hover{color:var(--gold)}
  .todo-clear{
    display:flex;align-items:center;gap:9px;padding:13px;
    font-size:12.5px;color:var(--ink-2);font-weight:600;
  }
  .todo-clear i[data-lucide]{width:15px;height:15px;color:#5fae82}

  /* guest bucket badge */
  .bkt{

<body>

<!-- Allocate a table -->

</div>

<!-- Table detail -->

</div>

<!-- Remember this — staff teach the system what it did not know -->
<div class="veil" id="veil-rem" style="z-index:80">
  <div class="sheet" style="max-width:380px">
    <div class="sheet-head" style="padding-top:18px">
      <div class="sheet-title" id="rem-title">Remember this</div>

      <div class="fld-lbl" id="rem-sub">Saved to the guest for next time</div>

</div>

<!-- Payment summary — sits above the table detail -->
<div class="veil" id="veil-pay" style="z-index:80">
  <div class="pay-card" id="pay-card"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   DATA — mirrors the seeded state in the live app
   ══════════════════════════════════════════════════════════════ */
const guests = {
  max: { id:'max', name:'Maximiliano', phone:'+65 8900 XXXX', initials:'M',
    rating:4.6, lastVisit:'12 days ago', visits:4, avgSpend:50,
    occasion:'Celebration',
    summary:'Maximiliano usually spends more than SGD50 at Chinese restaurants.',
    winback:'Winback SMS • June 10th' },
  ana: { id:'ana', name:'Ana', phone:'+65 8811 XXXX', initials:'A', rating:4.2, lastVisit:'2 months ago', visits:2, avgSpend:38,
    summary:'Prefers lighter dishes and sparkling water.' },
  vik: { id:'vik', name:'vivek', phone:'+65 9134 XXXX', initials:'V', rating:4.4, lastVisit:'5 days ago', visits:6, avgSpend:64,
    summary:'Regular for weekday lunch. Usually orders chicken.' },
  jes: { id:'jes', name:'Jessica', phone:'+65 8720 XXXX', initials:'J', rating:4.8, lastVisit:'3 weeks ago', visits:3, avgSpend:42,
    summary:'Always finishes with dessert. Sits alone, likes it quiet.' },
  jho: { id:'jho', name:'Jhonson', phone:'+65 9450 XXXX', initials:'J', rating:4.1, lastVisit:'9 days ago', visits:5, avgSpend:71,
    summary:'Comes with colleagues. Orders for the table.',
    // something specific went wrong last time — recovery is never inferred
    prevIssue:'Waited 25 minutes between starters and mains' },
  irf: { id:'irf', name:'Muhammad Irfan Anwar', phone:'+65 9077 XXXX', initials:'M', rating:0, lastVisit:'', visits:0, avgSpend:0,
    summary:'' },
};

const RECOS = [
  { name:'Savory Grilled Chicken with Garlic Herb Sauce', price:12.50, reorder:4, best:true, icon:'drumstick' },
  { name:'Salad with crisp ice and a touch of citrus',    price:8.00,  reorder:2, icon:'salad' },
  { name:'Chocolate lava cake',                            price:8.00,  reorder:0, icon:'cake-slice' },
];

/* status: vacant | seated | paid | blocked   ·   fresh = just allocated */
let tables = [
  { id:'01', status:'vacant' },
  { id:'02', status:'vacant' },
  { id:'03', status:'vacant' },
  { id:'04', status:'seated', fresh:true, guest:null, others:true, pax:4, mins:135, bill:86.00, server:'Jason', ticket:2, dishes:5 },
  { id:'05', status:'vacant' },
  { id:'06', status:'seated', guest:'jes', pax:1, mins:135, bill:25.00, server:'Aisha', ticket:1, dishes:2 },
  { id:'07', status:'blocked' },
  { id:'08', status:'paid', guest:null, others:true, pax:4, mins:135, bill:86.00, server:'Jason', ticket:2, dishes:6 },
  { id:'09', status:'vacant' },
  { id:'10', status:'vacant' },
  { id:'11', status:'paid', guest:null, others:true, pax:4, mins:135, bill:86.00, server:'Maria', ticket:1, dishes:4 },
  { id:'12', status:'seated', guest:'jho', others:true, pax:4, mins:135, bill:86.00, server:'Maria', ticket:2, dishes:5 },
  { id:'13', status:'vacant' },
  { id:'14', status:'blocked' },
  { id:'15', status:'blocked' },
  { id:'16', status:'vacant' },
  { id:'17', status:'seated', guest:'vik', others:true, pax:1, mins:218, bill:158.63, server:'Tom', ticket:3, dishes:9,
    sw:{ requestPending:true, requestText:'Could we see the wine list?', requestMin:2 } },
  { id:'18', status:'vacant' },
  { id:'19', status:'vacant' },
  { id:'20', status:'vacant' },
  { id:'21', status:'seated', guest:null, others:true, pax:2, mins:11, bill:0, server:'Aisha', ticket:0, dishes:0,
    sw:{ cat:'wine', catMin:4 } },
];

/* ══════════════════════════════════════════════════════════════
   GUEST BUCKETS
   One label per guest that tells staff how to treat them. Derived —
   never typed by hand — so it cannot go stale.
   ══════════════════════════════════════════════════════════════ */
function daysSince(lastVisit) {
  if (!lastVisit) return null;
  const m = String(lastVisit).match(/(\d+)\s*(day|week|month)/i);
  if (!m) return null;
  const n = +m[1], u = m[2].toLowerCase();
  return u === 'day' ? n : u === 'week' ? n*7 : n*30;
}
const BUCKETS = {
  new:       { label:'New guest',  tone:'plain', hint:'First time here — make the first impression count.' },
  returning: { label:'Returning',  tone:'plain', hint:'Has been here before. Recognise them.' },
  regular:   { label:'Regular',    tone:'gold',  hint:'Comes often. Greet by name and lead with their usual.' },
  vip:       { label:'High value', tone:'gold',  hint:'Spends well above average. Worth a manager hello.' },
  lapsed:    { label:'Lapsed',     tone:'amber', hint:'Has not been in for a while. Make them feel remembered.' },
  risk:      { label:'At risk',    tone:'red',   hint:'Last experience fell short. Recover it tonight.' },
};
function bucketOf(g) {
  if (!g || !g.visits) return 'new';
  if (g.prevIssue) return 'risk';
  const gap = daysSince(g.lastVisit);
  if (gap !== null && gap >= 60) return 'lapsed';
  if ((g.avgSpend || 0) >= 65) return 'vip';
  if (g.visits >= 5) return 'regular';
  return 'returning';
}
function bucketOfTable(t) {
  const g = t && t.guest ? guests[t.guest] : null;
  return g ? bucketOf(g) : null;
}

/* ══════════════════════════════════════════════════════════════
   SIGNALS — why this matters → what to do → done
   Deliberately small. A signal earns a place only if it changes
   what a staff member does next.
   ══════════════════════════════════════════════════════════════ */
const SIGNALS = [
  /* ───────── PHASE 2 · grounded in the guest profile + POS we already have ───────── */
  { id:'recovery', phase:2, lvl:'red', who:'waiter', icon:'heart-crack', score:96,
    on:c => c.g && c.g.prevIssue,
    act:'Prioritise this table',
    why:c => `Last visit went wrong — ${c.g.prevIssue.toLowerCase()}.`,
    done:'Table prioritised' },

  { id:'mgr-recovery', phase:2, lvl:'red', who:'manager', icon:'user-check', score:94,
    on:c => c.g && c.g.prevIssue && (c.bucket === 'risk') && (c.g.avgSpend||0) >= 60,
    act:'Manager touchpoint',
    why:c => `High-value guest whose last visit fell short. Worth you personally.`,
    done:'Manager visited' },

  { id:'no-order', phase:2, lvl:'amber', who:'waiter', icon:'clock', score:82,
    on:c => c.t.status === 'seated' && !c.t.dishes && c.mins >= 10,
    act:'Check in with the table',
    why:c => `Seated ${dur(c.mins)} with nothing ordered yet.`,
    done:'Checked in' },

  { id:'long-stay', phase:2, lvl:'amber', who:'waiter', icon:'hourglass', score:64,
    on:c => c.t.status === 'seated' && c.mins >= 180,
    act:'Offer the check',
    why:c => `On the table ${dur(c.mins)} — read whether they are ready to settle.`,
    done:'Check offered' },

  { id:'occasion', phase:2, lvl:'gold', who:'waiter', icon:'party-popper', score:86,
    on:c => c.g && c.g.occasion,
    act:'Acknowledge the occasion',
    why:c => `${c.g.name.split(' ')[0]} is here for a ${c.g.occasion.toLowerCase()}.`,
    done:'Occasion acknowledged' },

  { id:'vip-welcome', phase:2, lvl:'gold', who:'manager', icon:'crown', score:78,
    on:c => c.bucket === 'vip',
    act:'Personally welcome them',
    why:c => `${c.g.name.split(' ')[0]} averages ${money(c.g.avgSpend)} a visit.`,
    done:'Guest welcomed' },

  { id:'lapsed', phase:2, lvl:'gold', who:'waiter', icon:'calendar-clock', score:74,
    on:c => c.bucket === 'lapsed',
    act:'Make them feel remembered',
    why:c => `${c.g.name.split(' ')[0]} last dined here ${c.g.lastVisit}.`,
    done:'Guest welcomed back' },

  { id:'regular', phase:2, lvl:'gold', who:'waiter', icon:'star', score:72,
    on:c => c.g && c.g.visits >= 3 && c.bucket !== 'lapsed' && c.bucket !== 'risk',
    act:'Welcome them back by name',
    why:c => `${c.g.visits} visits, last ${c.g.lastVisit}.`,
    done:'Welcomed back' },

  { id:'usual', phase:2, lvl:'gold', who:'waiter', icon:'utensils', score:68,
    on:c => c.g && c.g.summary && !c.t.dishes && c.g.visits >= 2,
    act:'Lead with their usual',
    why:c => c.g.summary,
    done:'Usual suggested' },

  { id:'turn', phase:2, lvl:'gold', who:'waiter', icon:'badge-check', score:56,
    on:c => c.t.status === 'paid',
    act:'Clear and turn the table',
    why:'The party has settled.',
    done:'Table cleared' },

  /* ───────── PHASE 3 · live behaviour from the QR journey ───────── */
  { id:'request', phase:3, lvl:'red', who:'waiter', icon:'bell-ring', score:100,
    on:c => c.sw.requestPending,
    act:'Respond to the table',
    why:c => `They asked from the table${c.sw.requestMin?` ${c.sw.requestMin} min ago`:''}${c.sw.requestText?`: “${c.sw.requestText}”`:'.'}`,
    done:'Responded' },

  { id:'browsing', phase:3, lvl:'amber', who:'waiter', icon:'wine', score:90,
    on:c => c.sw.cat && c.sw.catMin >= 3,
    act:c => `Offer help choosing ${c.sw.cat === 'wine' ? 'a wine' : 'a dish'}`,
    why:c => `Browsing ${c.sw.cat} for ${c.sw.catMin} minutes without ordering.`,
    done:'Assistance offered' },

  { id:'repeat-item', phase:3, lvl:'amber', who:'waiter', icon:'eye', score:80,
    on:c => c.sw.repeatItem && c.sw.repeatViews >= 3,
    act:c => `Talk them through the ${c.sw.repeatItem}`,
    why:c => `Opened ${c.sw.repeatItem} ${c.sw.repeatViews} times without adding it.`,
    done:'Dish explained' },

  { id:'menu-idle', phase:3, lvl:'amber', who:'waiter', icon:'book-open', score:78,
    on:c => c.sw.menuOpenMin >= 4 && c.sw.itemsViewed === 0,
    act:'Walk them through the menu',
    why:c => `Menu open ${c.sw.menuOpenMin} minutes with nothing opened.`,
    done:'Menu explained' },

  { id:'hesitation', phase:3, lvl:'amber', who:'waiter', icon:'help-circle', score:70,
    on:c => c.sw.hesitationMin >= 6,
    act:'Offer ordering assistance',
    why:c => `Taking ${c.sw.hesitationMin} minutes to decide — longer than usual.`,
    done:'Assistance offered' },

  { id:'abandoned', phase:3, lvl:'amber', who:'waiter', icon:'undo-2', score:66,
    on:c => c.sw.abandoned,
    act:'Check if they need help deciding',
    why:c => `Added ${c.sw.abandoned} then removed it before ordering.`,
    done:'Checked in' },
];

const doneActions = {};                                   // "<table>:<signal>" -> true
const aKey = (tid,sid) => tid + ':' + sid;
const val = (v,c) => typeof v === 'function' ? v(c) : v;

function signalsFor(t) {
  if (!t || t.status === 'vacant' || t.status === 'blocked') return { open:[], done:[], top:null, lvl:null, all:[] };
  const g = t.guest ? guests[t.guest] : null;
  const c = { t, g, sw: t.sw || {}, mins: t.mins || 0, bucket: g ? bucketOf(g) : null };
  const all = SIGNALS.filter(s => s.phase <= state.phase)
    .filter(s => { try { return !!s.on(c); } catch(e){ return false; } })
    .map(s => ({ id:s.id, lvl:s.lvl, who:s.who, icon:s.icon, score:s.score, phase:s.phase,
                 why:val(s.why,c), act:val(s.act,c), done:s.done,
                 isDone: !!doneActions[aKey(t.id,s.id)] }));
  const rank = { red:0, amber:1, gold:2 };
  const open = all.filter(x => !x.isDone).sort((a,b) => rank[a.lvl]-rank[b.lvl] || b.score-a.score);
  return { open, done:all.filter(x => x.isDone), top:open[0] || null, lvl:open[0] ? open[0].lvl : null, all };
}
function markDone(tid, sid) {
  doneActions[aKey(tid,sid)] = true;
  renderDetail(); renderGrid();
  const s = SIGNALS.find(x => x.id === sid);
  toast(s ? s.done : 'Done', 'check-circle');
}
function attentionCount() {
  return tables.filter(t => { const l = signalsFor(t).lvl; return l === 'red' || l === 'amber'; }).length;
}

const state = { filter:'all', view:'table', q:'', searchOpen:false,
                allocId:null, allocPax:4, detailId:null, activeGuest:null, allActions:false,
                phase:2 };

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
const ic = (n, c) => `<i data-lucide="${n}"${c?` class="${c}"`:''}></i>`;
const icons = () => { if (window.lucide) window.lucide.createIcons(); };
const money = n => 'SGD' + Number(n).toFixed(2);
const T = id => tables.find(t => t.id === id);
const dur = m => { const h = Math.floor(m/60), mm = m%60; return h ? `${h}h ${mm}m` : `${mm}m`; };
const nameOf = t => t.guest ? guests[t.guest].name : 'Guest';

let toastTimer;
function toast(msg, icon) {
  const el = document.getElementById('toast');
  el.innerHTML = `${ic(icon || 'check-circle')}<span>${msg}</span>`;
  icons(); el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2400);
}
const open = id => document.getElementById(id).classList.add('on');
const shut = id => document.getElementById(id).classList.remove('on');

/* ══════════════════════════════════════════════════════════════
   TABLE GRID
   ══════════════════════════════════════════════════════════════ */
function visibleTables() {
  let list = tables.slice();
  if (state.filter === 'vacant')   list = list.filter(t => t.status === 'vacant');
  if (state.filter === 'allocate') list = list.filter(t => t.status === 'seated' || t.status === 'paid');
  if (state.filter === 'attention') {
    const rank = { red:0, amber:1 };
    list = list.filter(t => { const l = signalsFor(t).lvl; return l === 'red' || l === 'amber'; })
               .sort((a,b) => rank[signalsFor(a).lvl] - rank[signalsFor(b).lvl]);
  }
  const q = state.q.trim().toLowerCase();
  if (q) list = list.filter(t =>
    ('table ' + t.id).includes(q) || t.id.replace(/^0/,'').includes(q) ||
    (t.guest && guests[t.guest].name.toLowerCase().includes(q)) ||
    (t.status !== 'vacant' && t.status !== 'blocked' && 'guest'.includes(q))
  );
  return list;
}

function cardHtml(t) {
  if (t.status === 'vacant')
    return `<div class="tcard vacant" data-id="${t.id}"><div class="tc-vac">Table ${t.id}</div></div>`;
  if (t.status === 'blocked')
    return `<div class="tcard blocked" data-id="${t.id}"><div class="tc-vac">Table ${t.id}</div></div>`;

  const cls = t.status === 'paid' ? 'paid' : (t.fresh ? 'fresh' : 'seated');
  const sig = signalsFor(t);
  const bkt = bucketOfTable(t);
  return `<div class="tcard ${cls}" data-id="${t.id}">
    <div class="tc-head">
      <span class="tc-id">Table ${t.id}</span>
      <span style="display:inline-flex;align-items:center;gap:8px">
        ${sig.lvl ? `<span class="tc-dot ${sig.lvl}"></span>` : ''}
        <span class="tc-doc">${ic('receipt-text','sm')}</span>
      </span>
    </div>
    <div class="tc-name">${nameOf(t)}${t.others ? ' <span class="others">&amp; others</span>' : ''}</div>
    <div class="tc-meta">
      <span>${ic('user','xs')} ${t.pax}</span>
      <span>${ic('clock','xs')} ${dur(t.mins)}</span>
      ${bkt && BUCKETS[bkt].tone !== 'plain' ? `<span class="bkt ${BUCKETS[bkt].tone}" style="margin-left:auto">${BUCKETS[bkt].label}</span>` : ''}
    </div>
    ${sig.top ? `<div class="tc-act ${sig.top.lvl}">${ic(sig.top.icon,'xs')} ${sig.top.act}</div>` : ''}
    ${t.bill > 0 ? `<div class="tc-bill">${money(t.bill)}</div>` : ''}
  </div>`;
}

function renderGrid() {
  const cnt = attentionCount();
  const badge = document.getElementById('attn-cnt');
  if (badge) { badge.textContent = cnt; badge.style.display = cnt ? '' : 'none'; }
  const list = visibleTables();
  const g = document.getElementById('grid');
  g.innerHTML = list.length
    ? list.map(cardHtml).join('')
    : (state.filter === 'attention'
        ? `<div class="stub" style="grid-column:1/-1">${ic('check-circle')}<b>Nothing needs you</b><span>Every table on the floor is running fine.</span></div>`
        : `<div class="stub" style="grid-column:1/-1">${ic('search-x')}<b>No tables match</b><span>Try a different table number or name.</span></div>`);
  icons();
}

   ALLOCATE
   ══════════════════════════════════════════════════════════════ */
function openAllocate(id) {
  state.allocId = id; state.allocPax = 4;
  document.getElementById('alloc-title').textContent = 'Table ' + id;
  document.getElementById('a-phone').value = '';
  document.getElementById('a-name').value = '';
  document.getElementById('a-match').innerHTML = '';
  renderPax();
  open('veil-alloc');
  icons();
}
function renderPax() {
  document.getElementById('pax-grid').innerHTML =
    [1,2,3,4,5,6,7,8].map(n => `<button class="pax ${state.allocPax===n?'on':''}" data-pax="${n}">${n}</button>`).join('') +
    `<button class="pax wide" data-pax="custom">Custom pax</button>`;
}
function lookupGuest(v) {
  const s = v.replace(/\s/g,'').toLowerCase();
  if (s.length < 4) return null;
  return Object.values(guests).find(g =>
    g.phone.replace(/\s|X/gi,'').includes(s.replace(/\D/g,'').slice(0,4)) ||
    g.name.toLowerCase().startsWith(v.trim().toLowerCase())
  ) || null;
}
function onAllocLookup() {
  const phone = document.getElementById('a-phone').value;
  const nm    = document.getElementById('a-name').value;
  const hit = lookupGuest(nm || phone);
  const box = document.getElementById('a-match');
  if (hit && (nm || phone.length >= 4)) {
    if (!nm) document.getElementById('a-name').value = hit.name;
    box.innerHTML = `<div class="info-card" style="margin:0">
      <div class="ic-h">${ic('user-check')} Returning guest</div>
      <div class="ic-b">${hit.name} · ${hit.visits} visits · last ${hit.lastVisit || '—'}</div>
    </div>`;
  } else box.innerHTML = '';
  icons();
}
function confirmAllocate() {
  const t = T(state.allocId); if (!t) return;
  const nm = document.getElementById('a-name').value.trim();
  const hit = Object.values(guests).find(g => g.name.toLowerCase() === nm.toLowerCase());
  tables = tables.map(x => ({ ...x, fresh:false }));
  const tt = T(state.allocId);
  Object.assign(tt, {
    status:'seated', fresh:true, pax:state.allocPax, mins:0, bill:0,
    server:'Jason', ticket:0, dishes:0, others:state.allocPax > 1,
    guest: hit ? hit.id : null,
    walkInName: hit ? null : (nm || null),
  });
  shut('veil-alloc');
  renderGrid();
  toast(`Table ${tt.id} allocated · QR printed`, 'qr-code');
}

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
function partyOf(t) {
  const pool = ['ana','vik','irf'];
  const lead = t.guest || 'irf';
  if (!t.others) return [lead];
  const others = pool.filter(k => k !== lead).slice(0, Math.max(0, Math.min(3, (t.pax || 1) - 1)));
  return [lead, ...others];
}

function orderItems(t) {
  if (!t.dishes) return [];
  const pool = [
    { name:'FILLET MIGNON', qty:1, price:18.90 },
    { name:'GRILLED CHICKEN', qty:2, price:25.00 },
    { name:'CITRUS SALAD', qty:1, price:8.00 },
    { name:'LAVA CAKE', qty:2, price:16.00 },
  ];
  return pool.slice(0, Math.min(t.dishes, pool.length));
}

function recoHtml(r) {
  return `<div class="reco">
    <div class="reco-img">${ic(r.icon,'lg')}${r.best ? `<div class="best-ribbon">#1 All Time<br>Best-Seller</div>` : ''}</div>
    <div class="reco-b">
      <div class="badges">
        ${r.reorder ? `<span class="bdg reorder">${r.reorder}x Reorder</span>` : ''}
      </div>
      <div class="reco-nm">${r.name}</div>
      <div class="reco-pr">${money(r.price)}</div>
    </div>
  </div>`;
}

/* The checklist. Three rows at most before it folds — beyond that the
   waiter is reading rather than acting. */
function actionsHtml(t) {
  const sig = signalsFor(t);
  if (!sig.all.length) {
    return `<div class="todo"><div class="todo-clear">${ic('check-circle')}<span>Nothing needs doing — this table is running fine.</span></div></div>`;
  }
  const CAP = 3;
  const show = state.allActions ? sig.open : sig.open.slice(0, CAP);
  const hidden = sig.open.length - show.length;
  const total = sig.all.length, doneN = sig.done.length;

  const row = a => `<button class="todo-row ${a.lvl}" data-do="${a.id}">
      <span class="tick">${ic('check')}</span>
      <span class="todo-b">
        <span class="todo-a">${a.act}</span>
        <span class="todo-w">${a.why}</span>
      </span>
      ${a.who === 'manager' ? `<span class="todo-who">Manager</span>` : ''}
    </button>`;

  return `<div class="todo">
    <div class="todo-h"><b>What to do</b><span class="todo-prog">${doneN} of ${total} done</span></div>
    ${show.map(row).join('')}
    ${sig.done.map(a => `<div class="todo-row is-done">
        <span class="tick">${ic('check')}</span>
        <span class="todo-b"><span class="todo-a">${a.done}</span></span>
      </div>`).join('')}
    ${hidden ? `<button class="todo-more" id="act-more">+ ${hidden} more</button>` : ''}
    ${state.allActions && sig.open.length > CAP ? `<button class="todo-more" id="act-more">Show fewer</button>` : ''}
  </div>`;
}

function openDetail(id) {
  const t = T(id); if (!t || t.status === 'vacant' || t.status === 'blocked') return;
  state.detailId = id;
  state.allActions = false;
  const party = partyOf(t);
  if (!state.activeGuest || !party.includes(state.activeGuest)) state.activeGuest = party[0];
  renderDetail();
  open('veil-detail');
}

          <div class="info-card">

            <div class="ic-b ${known ? '' : 'muted'}">${
              known

                : 'Unable to get summary: We are facing some issues while getting insights, close this dialog and open again'
            }</div>
          </div>

            <div class="ic-h">${ic('file-text')} Staff Notes</div>
            <div class="ic-b">A table nearby with air conditioning.</div>
          </div>` : ''}

          <div class="row-h"><b>Guest list</b><button class="add-lnk" id="add-guest">${ic('plus','xs')} Add</button></div>
          <div class="avatars">
            ${party.map(k => `<button class="av ${k===state.activeGuest?'on':''}" data-g="${k}">${guests[k].initials}</button>`).join('')}
          </div>

          <div class="gcard">
            <div class="gc-top">
              <span class="gc-av">${g.initials}</span>
              <span style="min-width:0"><span class="gc-nm">${g.name}</span><br><span class="gc-ph">${g.phone}</span></span>
              <span class="bkt ${BUCKETS[bucketOf(g)].tone}" style="margin-left:auto">${BUCKETS[bucketOf(g)].label}</span>
            </div>
            <div class="bkt-hint" style="margin:-4px 0 10px">${BUCKETS[bucketOf(g)].hint}</div>
            <div class="info-card" style="margin:0">
              <div class="ic-h">${ic('sparkles')} Guest Summary</div>
              <div class="ic-b ${g.summary ? '' : 'muted'}">${
                g.summary || 'Unable to get summary: We are facing some issues while getting insights, close this dialog and open again'
              }</div>
            </div>
            ${g.winback ? `<div class="tag-purple">${ic('message-square','xs')} ${g.winback}</div>` : ''}
            ${(g.notes||[]).map(nt => `<div class="act-ok" style="margin:9px 0 0">${ic('bookmark')} ${nt}</div>`).join('')}
            <button class="act-more" style="margin:9px 0 0" id="remember">${ic('bookmark-plus','xs')} Remember something</button>

      <!-- DISH RECOMMENDATION -->
      <div class="dm-col">
        <div class="dm-h tab">${ic('sparkles','sm')} Dish Recommendation</div>
        <div class="dm-scroll">

        ${items.length ? `<div class="dm-scroll">${items.map(i => `

const REM_CATS = ['Preference','Dietary','Occasion','Seating','Conversation','Other'];
function openRemember() {

  document.getElementById('rem-sub').textContent = g ? `Saved to ${g.name} for next time` : 'Saved to this table';
  document.getElementById('rem-text').value = '';

function saveRemember() {
  const txt = document.getElementById('rem-text').value.trim();

function renderView() {

  const vt = document.getElementById('view-title');
  vt.style.display = onTable ? 'none' : 'block';
  vt.textContent = onTable ? '' : ({order:'Orders', menu:'Menu', settings:'Settings'})[state.view] || '';
  const c = document.getElementById('content');
  if (state.view === 'table') {
    c.innerHTML = `<div class="searchwrap ${state.searchOpen?'on':''}" id="searchwrap">
        <div class="searchbar">${ic('search')}
          <input id="q" placeholder="Search table number or guest name" value="${state.q}" />
          <button class="x-btn" id="q-clear">${ic('x','sm')}</button>
        </div>
      </div><div class="grid" id="grid"></div>`;
    renderGrid();
    if (state.searchOpen) document.getElementById('q').focus();
  } else if (state.view === 'settings') {
    c.innerHTML = settingsHtml();
  } else {
    const [i,t,s] = STUBS[state.view];
    c.innerHTML = `<div class="stub">${ic(i)}<b>${t}</b><span>${s}</span></div>`;
  }
  icons();
}

/* ══════════════════════════════════════════════════════════════
   EVENTS — one delegated listener
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-close]');
  if (el) { shut(el.dataset.close); return; }

  // filter segment
  const seg = e.target.closest('#seg button');
  if (seg) {
    state.filter = seg.dataset.f;
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b === seg));
    renderGrid(); return;
  }

  // bottom nav
  const nav = e.target.closest('#bnav button');
  if (nav) {
    state.view = nav.dataset.v;
    document.querySelectorAll('#bnav button').forEach(b => b.classList.toggle('on', b === nav));
    renderView(); return;
  }

  const ph = e.target.closest('[data-phase]');
  if (ph) { state.phase = +ph.dataset.phase; renderView(); toast(`Phase ${state.phase} active`, 'zap'); return; }
  if (e.target.closest('#btn-search'))  { state.searchOpen = !state.searchOpen; renderView(); return; }
  if (e.target.closest('#btn-history')) { toast('Order history — coming from POS', 'history'); return; }
  if (e.target.closest('#fab-edit'))    { toast('Edit floor layout', 'pencil'); return; }
  if (e.target.closest('#q-clear'))     { state.q = ''; state.searchOpen = false; renderView(); return; }

  // table card
  const card = e.target.closest('.tcard');
  if (card) {
    const t = T(card.dataset.id);
    if (!t || t.status === 'blocked') return;
    if (t.status === 'vacant') openAllocate(t.id); else openDetail(t.id);
    return;
  }

  // allocate sheet
  const pax = e.target.closest('[data-pax]');
  if (pax) {
    if (pax.dataset.pax === 'custom') {
      const v = prompt('How many guests?');
      const n = parseInt(v);
      if (n > 0) state.allocPax = n;
    } else state.allocPax = +pax.dataset.pax;
    renderPax(); return;
  }
  if (e.target.closest('#a-confirm')) { confirmAllocate(); return; }
  const rc = e.target.closest('[data-rem]');
  if (rc) { state.remCat = rc.dataset.rem; renderRemCats(); return; }
  if (e.target.closest('#rem-save')) { saveRemember(); return; }

  // detail
  if (e.target.closest('#dm-close')) { shut('veil-detail'); return; }
  const av = e.target.closest('[data-g]');
  if (av) { state.activeGuest = av.dataset.g; renderDetail(); return; }
  const doBtn = e.target.closest('[data-do]');
  if (doBtn) { markDone(state.detailId, doBtn.dataset.do); return; }
  if (e.target.closest('#act-more')) { state.allActions = !state.allActions; renderDetail(); return; }
  if (e.target.closest('#remember')) { openRemember(); return; }
  if (e.target.closest('#btn-paybill'))   { openPay(); return; }
  if (e.target.closest('#btn-receipt'))   { toast('Receipt sent to printer', 'printer'); return; }
  if (e.target.closest('#add-order'))     { toast('Opening menu to add items', 'plus'); return; }
  if (e.target.closest('#void-item'))     { toast('Select items to reduce or void', 'minus'); return; }
  if (e.target.closest('#add-guest'))     { toast('Add another guest to this table', 'user-plus'); return; }
  if (e.target.closest('#refresh-order')) { toast('Order refreshed from POS', 'refresh-cw'); return; }
  if (e.target.closest('#btn-closetable')) {
    const t = T(state.detailId);
    Object.assign(t, { status:'vacant', guest:null, others:false, pax:0, mins:0, bill:0, ticket:0, dishes:0, fresh:false, walkInName:null });
    shut('veil-detail'); renderGrid(); toast(`Table ${t.id} closed`, 'check-circle'); return;
  }
  if (e.target.closest('#pay-confirm')) {
    const t = T(state.detailId);
    t.status = 'paid';
    shut('veil-pay'); renderDetail(); renderGrid(); toast(`Table ${t.id} paid`, 'check-circle'); return;
  }

  // click the veil backdrop to dismiss
  if (e.target.id === 'veil-alloc') shut('veil-alloc');
  if (e.target.id === 'veil-pay')   shut('veil-pay');
  if (e.target.id === 'veil-rem')   shut('veil-rem');
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.q = e.target.value; renderGrid(); }
  if (e.target.id === 'a-phone' || e.target.id === 'a-name') onAllocLookup();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  ['veil-pay','veil-detail','veil-alloc'].some(id => {
    const el = document.getElementById(id);
    if (el.classList.contains('on')) { el.classList.remove('on'); return true; }
  });
});

/* init */
renderGrid(); icons();
</script>
</body>
</html>
